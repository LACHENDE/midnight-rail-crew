<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Midnight Rail Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* Midnight Rail Crew — greybox. One night train, two crew who can go anywhere: the cab (coal, firebox, valves, brake)
   and the roof (junction signs + lever). Each player privately hears single Japanese words and must act on them. */
:root{ --ink:#2A211B; --paper:#FFF8EE; --night:#0E1230; --amber:#FFB23E; --red:#E04A3C; --green:#7EE08A; --dim:#A9B3E0; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--paper);font-family:Nunito,"Zen Maru Gothic",system-ui,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation}
#game{position:fixed;inset:0}
#game canvas{display:block}
[hidden]{display:none!important}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 8px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.meters{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1;max-width:330px}
.meter{display:flex;align-items:center;gap:6px;font:900 11px Nunito,sans-serif;letter-spacing:.06em}
.meter span{width:44px;flex:none}
.bar{flex:1;height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transform-origin:0 50%;transition:transform .2s}
.bar.fire i{background:var(--amber)}.bar.water i{background:#5BC0FF}
.bar.low i{background:var(--red)}
.trip{position:relative;height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid var(--ink)}
.trip b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:4px;background:var(--amber);border:2px solid var(--ink)}
.trip em{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ink);border:2px solid var(--dim)}
.trip em.ok{background:var(--green)}.trip em.bad{background:var(--red)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto}
.badge{font:900 12px Nunito,sans-serif;background:rgba(14,18,48,.8);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;white-space:nowrap}
.badge.test{background:#3A1E19;border:2px dashed var(--amber);color:#FFDDB0}
.orders{position:absolute;left:max(10px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 100px);display:flex;flex-direction:column;gap:5px;pointer-events:auto}
.orders{max-height:calc(100% - 250px);flex-wrap:wrap;align-content:flex-start;max-width:52vw}
.ord{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:4px 6px 4px 4px;box-shadow:0 3px 0 var(--ink);min-width:128px;position:relative;overflow:hidden}
.ord.new{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.ord .who{font:900 10px Nunito,sans-serif;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 4px}
.ord b{font:900 20px "Zen Maru Gothic",sans-serif;flex:1;white-space:nowrap}
.ord small{font:800 11px Nunito,sans-serif;color:#8C5E36;display:block;line-height:1}
.ord button{border:2px solid var(--ink);border-radius:9px;background:#E2E6FA;font:900 12px Nunito,sans-serif;width:28px;height:28px;padding:0;cursor:pointer;color:var(--ink)}
.ord .t{position:absolute;left:0;bottom:0;height:4px;background:var(--red);transform-origin:0 50%}
.ord.done{background:#C9F2D1}.ord.fail{background:#FFD3CC}
.stick{position:absolute;left:max(18px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 18px);width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:3px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(255,248,238,.85);border:3px solid var(--ink)}
.act{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 18px);width:118px;height:118px;border-radius:50%;background:var(--amber);border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink);font:900 17px Nunito,"Zen Maru Gothic",sans-serif;color:var(--ink);pointer-events:auto;touch-action:none;cursor:pointer;line-height:1.1;padding:6px}
.act.off{background:#55607A;color:#A9B3E0}
.act.held{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.switch{pointer-events:auto;font:900 13px Nunito,sans-serif;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:6px 10px;cursor:pointer}
.toast{position:absolute;left:50%;top:62%;transform:translate(-50%,-50%);font:900 22px Nunito,"Zen Maru Gothic",sans-serif;padding:6px 14px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);opacity:0;white-space:nowrap}
.toast.ok{background:var(--green)}.toast.bad{background:#FF8A7E}.toast.go{background:var(--amber)}
.card{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(8,10,30,.78)}
.in{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:16px 18px 14px;width:min(560px,100%);max-height:100%;overflow:auto;text-align:center}
.in h1{margin:0;font:900 28px/1.1 "Zen Maru Gothic",sans-serif}
.in h1 small,.in h2 small{display:block;font:900 12px Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6B5E54;margin-top:4px}
.in h2{margin:0;font:900 24px/1.15 "Zen Maru Gothic",sans-serif}
.in p{margin:8px 0 0;font:700 14px/1.4 Nunito,sans-serif;color:#4A3F37}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{font:900 17px Nunito,sans-serif;color:var(--ink);background:var(--amber);border:4px solid var(--ink);border-radius:999px;padding:11px 22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn.alt{background:var(--paper)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.code{font:900 44px Nunito,sans-serif;letter-spacing:.2em;background:var(--night);color:var(--amber);border:4px solid var(--ink);border-radius:16px;padding:4px 16px;display:inline-block;margin-top:8px}
input.codein{font:900 22px Nunito,sans-serif;letter-spacing:.2em;text-transform:uppercase;width:120px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:8px}
.words{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}
.word{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:6px 2px 4px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.word b{font:900 21px "Zen Maru Gothic",sans-serif}.word small{font:800 11px Nunito,sans-serif;color:#6B5E54}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);vertical-align:-1px;margin-right:3px}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.res span{background:#F3E9DA;border-radius:12px;padding:7px 2px;font:800 11px Nunito,sans-serif;color:#6B5E54;display:flex;flex-direction:column}
.res b{font:900 20px Nunito,sans-serif;color:var(--ink)}
.small{font:800 12px Nunito,sans-serif;color:#6B5E54}
.rotate{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--night);font:900 20px Nunito,sans-serif;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){ .rotate{display:flex} }
</style>
</head>
<body>
<div id="game"></div>
<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="meters">
      <div class="meter"><span>TRAIN</span><div class="bar" id="hpBar"><i></i></div></div>
      <div class="meter"><span>FIRE</span><div class="bar fire" id="fireBar"><i></i></div></div>
      <div class="meter"><span>WATER</span><div class="bar water" id="waterBar"><i></i></div></div>
      <div class="meter"><span>TRIP</span><div class="trip" id="trip"></div></div>
    </div>
    <div class="side"><span class="badge" id="where">P1 · INSIDE</span><span class="badge test" id="testBadge" hidden>LOCAL TEST · not online</span><button class="switch" id="switchBtn" hidden>Switch to P2</button></div>
  </div>
  <div class="orders" id="orders"></div>
  <div class="stick" id="stick"><i id="knob"></i></div>
  <button class="act off" id="actBtn">—</button>
  <div class="toast" id="toast"></div>
</div>
<div class="card" id="card"></div>
<div class="rotate"><div style="font-size:46px">📱↻</div>Turn your phone sideways to play</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.80.1/phaser.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- words (single words only for this prototype) ----------
const W={ aka:{k:'あか',ro:'aka',m:'red'}, ao:{k:'あお',ro:'ao',m:'blue'}, kiiro:{k:'きいろ',ro:'kiiro',m:'yellow'},
  coal:{k:'せきたん',ro:'sekitan',m:'coal'}, brake:{k:'ブレーキ',ro:'burēki',m:'brake'},
  mizu:{k:'みず',ro:'mizu',m:'water'}, lamp:{k:'ランプ',ro:'ranpu',m:'lamp'},
  asahi:{k:'あさひ',ro:'asahi',m:'station'}, aoba:{k:'あおば',ro:'aoba',m:'station'}, sakura:{k:'さくら',ro:'sakura',m:'station'} };
const COLORS=['aka','ao','kiiro'], STATIONS=['asahi','aoba','sakura'];

// ---------- world layout ----------
const ROOFY=760;                              // the roof sits below the cab in world space; the ladder moves you between them
const CARGOY=1500;                            // the cargo car (water tank + lamps), through the cab's left door
const AREA={ cab:{x0:70,x1:890,y0:90,y1:490}, roof:{x0:70,x1:890,y0:ROOFY+120,y1:ROOFY+330}, cargo:{x0:70,x1:890,y0:CARGOY+90,y1:CARGOY+490} };
const VALVE={ aka:{x:850,y:160,c:0xE04A3C}, ao:{x:850,y:290,c:0x3B6FE0}, kiiro:{x:850,y:420,c:0xF2C230} };
const SPOT={ bin:{x:150,y:440,a:'cab'}, fire:{x:150,y:180,a:'cab'}, brake:{x:470,y:465,a:'cab'}, ladder:{x:620,y:110,a:'cab'},
  hatch:{x:300,y:ROOFY+300,a:'roof'}, lever:{x:830,y:ROOFY+170,a:'roof'},
  door:{x:85,y:310,a:'cab'}, back:{x:875,y:CARGOY+310,a:'cargo'}, pump:{x:300,y:CARGOY+180,a:'cargo'},
  lampA:{x:620,y:CARGOY+130,a:'cargo'}, lampB:{x:620,y:CARGOY+450,a:'cargo'} };
const REACH=80;
// journey (distance units ≈ seconds at full speed): 3 junctions, then the station
const JUNC=[45,95,145], STATION=185;          // ~3 minutes: a calm start, then it gets busy

// ---------- audio: tiny synth kit + the phone's Japanese voice ----------
let AC=null, jaVoice=null;
function audio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
  try{ if(!audio.warm){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='ja-JP'; speechSynthesis.speak(u); audio.warm=1; } }catch(e){} }
function tone(f,at,d,type,v,f2){ if(!AC) return; const t=AC.currentTime+(at||0), o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v||.15,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
const SND={ ok(){ tone(784,0,.12,'triangle',.2); tone(1175,.08,.18,'triangle',.16); }, bad(){ tone(140,0,.3,'square',.12); tone(95,.05,.3,'sawtooth',.08); },
  pick(){ tone(300,0,.08,'square',.08); }, fire(){ tone(180,0,.25,'sawtooth',.1,520); }, order(){ tone(988,0,.08,'square',.06); tone(1319,.08,.12,'square',.06); },
  whistle(){ tone(880,0,.5,'sine',.14); tone(1108,0,.5,'sine',.1); }, clack(v){ tone(90,0,.05,'square',.03*v); } };
function getVoice(){ if(!jaVoice){ try{ jaVoice=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null; }catch(e){} } return jaVoice; }
function say(word){ try{ const u=new SpeechSynthesisUtterance(W[word].k); u.lang='ja-JP'; u.rate=.85; const v=getVoice(); if(v) u.voice=v;
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

// ---------- state ----------
// MODE: 'local' (one device, both crew), 'host', 'guest'. The host simulates everything; the guest sends its position + actions.
let MODE='', ME='h', S=null, NET={kind:'', send:()=>{}, code:''}, guestHere=false;
const LOCAL={ actN:0, acts:[], seen:{h:0,g:0}, hinted:{}, heard:{}, ready:false };
const pos={ h:{x:300,y:300,a:'cab'}, g:{x:420,y:330,a:'cab'} };   // where each crew member is drawn
function freshState(){
  const signs=JUNC.map(()=>{ const pair=shuffle(STATIONS).slice(0,2); const dest=pair[Math.random()<.5?0:1]; return {L:pair[0], R:pair[1], dest}; });
  return { ph:'ready', ready:{h:false, g:MODE==='local'}, t:0, power:80, water:90, lamps:{A:1,B:1}, nextL:30, hp:100, dist:0, speed:0, lever:null, valves:{aka:0,ao:0,kiiro:0},
    stopped:false, brakeHold:0, detour:0, jn:0, signs, sign:null, orders:[], oid:0, nextV:6, jres:[], ev:{n:0},
    stats:{done:0, missed:0, wrong:0, hints:0}, players:{h:{x:300,y:300,a:'cab',carry:0}, g:{x:420,y:330,a:'cab',carry:0}}, arriveT:0, gid:Date.now()%1e9 };
}
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pick=a=>a[Math.floor(Math.random()*a.length)];
function ev(kind, txt){ S.ev={n:S.ev.n+1, kind, txt}; }
function addOrder(who, kind, word, life, target){ S.oid++; S.orders.push({id:S.oid, who, kind, word, target, until: life ? S.t+life : 1e9, life:life||0, done:0, hint:0}); if(S.orders.length>10) S.orders.splice(0, S.orders.length-10); }
const active=kind=>S.orders.filter(o=>!o.done && (!kind || o.kind===kind));
function finish(o, ok){ o.done = ok ? 1 : -1; o.doneT=S.t; if(ok) S.stats.done++; else S.stats.missed++; }

// ---------- host simulation ----------
function hostTick(dt){
  if(!S || S.ph!=='run'){ if(S && S.ph==='ready' && S.ready.h && S.ready.g){ S.ph='run'; ev('go','出発! Depart'); } return; }
  S.t+=dt; S.players.h.x=pos.h.x; S.players.h.y=pos.h.y; S.players.h.a=pos.h.a;
  if(MODE==='local'){ S.players.g.x=pos.g.x; S.players.g.y=pos.g.y; S.players.g.a=pos.g.a; }
  if(S.arriveT){ S.speed=Math.max(0,S.speed-dt*.8); if(S.t-S.arriveT>2.2) S.ph='over'; return; }
  // the ramp: 0 = calm start, 1 = flat-out (reached ~100 s in). Everything below scales with it.
  const f=Math.min(1, S.t/100);
  S.power=Math.max(0, S.power-(1.5+1.9*f)*dt); S.water=Math.max(0, S.water-(.8+1.7*f)*dt);
  if(S.water<=0) S.hp-=4*dt;                                                    // dry boiler: the train takes damage until someone pumps
  let sp = S.power>25 ? 1 : .3+.7*S.power/25; if(S.detour>0){ S.detour-=dt; sp*=.3; }
  S.speed += (sp-S.speed)*Math.min(1,dt*2); S.dist+=S.speed*dt;
  // orders: coloured valves every ~10 s, coal when the fire runs low, the junction word before each junction, brake before the station
  if(S.t>=S.nextV && S.dist<STATION-14){ addOrder('all', 'valve', pick(COLORS), 16-6*f); S.nextV=S.t+(11-7.5*f)+Math.random()*3*(1-f); }
  if(S.power<40 && !active('coal').length) addOrder('all', 'coal', 'coal', 22-7*f);
  if(S.water<40 && !active('water').length) addOrder('all', 'water', 'mizu', 22-7*f);
  if(S.t>=S.nextL && S.dist<STATION-14){ const dark=['A','B'].filter(k=>S.lamps[k]); if(dark.length){ const k=pick(dark); S.lamps[k]=0; addOrder('all', 'lamp', 'lamp', 18-6*f, k); } S.nextL=S.t+(26-16*f)+Math.random()*4; }
  if(S.jn<JUNC.length && S.dist>=JUNC[S.jn]-15 && !S.sign){ S.sign={...S.signs[S.jn], jn:S.jn}; addOrder('all', 'junction', S.sign.dest, 0); }
  if(S.sign && S.dist>=JUNC[S.sign.jn]){ // judge the junction: the lever picks the side; the sign on that side must be the word
    const o=active('junction')[0], chosen = S.lever==='L' ? S.sign.L : S.lever==='R' ? S.sign.R : null, ok=chosen===S.sign.dest;
    if(o) finish(o, ok); S.jres[S.sign.jn]=ok;
    if(ok) ev('ok','Right line! '+W[S.sign.dest].k); else { S.hp-=20; S.detour=4; S.stats.wrong++; ev('bad', S.lever ? 'Wrong line! Backing up…' : 'Nobody set the lever!'); }
    S.sign=null; S.lever=null; S.jn++; }
  if(S.dist>=STATION-14 && !S.orders.some(o=>o.kind==='brake')) addOrder('all', 'brake', 'brake', 0);
  S.brakeHold=Math.max(0, S.brakeHold-dt*.5);
  if(!S.arriveT && S.brakeHold>=1.5 && S.dist>=STATION-14){ const o=active('brake')[0]; if(o) finish(o, true); S.arriveT=S.t; ev('ok','到着! Arrived'); }
  else if(!S.arriveT && S.dist>=STATION+4){ const o=active('brake')[0]; if(o) finish(o, false); S.hp-=15; S.arriveT=S.t; ev('bad','Overran the station!'); }
  for(const o of S.orders) if(!o.done && o.life && S.t>o.until){ finish(o, false); S.hp-=10; if(o.kind==='lamp') S.lamps[o.target]=1; ev('bad','Missed: '+W[o.word].k); }
  if(S.hp<=0){ S.hp=30; S.detour=3; ev('bad','Breakdown! Patching up…'); }      // recoverable: never a restart
  S.hp=Math.max(0,Math.min(100,S.hp));
}
// an action from a crew member, checked against where they stand
function hostAct(who, a){
  if(!S || S.ph!=='run' || S.arriveT) return; const p=S.players[who];
  if(MODE!=='guest' && (who==='h' || MODE==='local')){ p.x=pos[who].x; p.y=pos[who].y; p.a=pos[who].a; } // this device's crew: use where they are right now
  const near=s=>s && p.a===s.a && Math.hypot(p.x-s.x, p.y-s.y)<=REACH;
  if(a.k==='hint'){ const o=S.orders.find(o=>o.id===a.id); if(o && !o.hint){ o.hint=1; S.stats.hints++; } return; }
  if(a.k==='bin' && near(SPOT.bin) && !p.carry){ p.carry=1; ev('pick',''); return; }
  if(a.k==='fire' && near(SPOT.fire) && p.carry){ p.carry=0; S.power=Math.min(100, S.power+35); ev('fire',''); active('coal').forEach(o=>finish(o,true)); return; }
  if(a.k==='brake' && near(SPOT.brake)){ S.brakeHold+=.3; if(S.dist<STATION-14) S.speed*=.97; return; }
  if(a.k==='pump' && near(SPOT.pump)){ S.water=Math.min(100, S.water+8); if(S.water>=85 && active('water').length){ active('water').forEach(o=>finish(o,true)); ev('ok','OK! '+W.mizu.k); } return; }
  if(a.k==='lamp' && (a.id==='A'||a.id==='B') && near(SPOT['lamp'+a.id]) && !S.lamps[a.id]){ S.lamps[a.id]=1; const o=S.orders.find(o=>!o.done && o.kind==='lamp' && o.target===a.id); if(o) finish(o,true); ev('ok','OK! '+W.lamp.k); return; }
  if(a.k==='lever' && near(SPOT.lever)){ S.lever = S.lever==='L' ? 'R' : 'L'; ev('lever',''); return; }
  if(a.k==='valve' && VALVE[a.c] && near({...VALVE[a.c], a:'cab'})){
    S.valves[a.c]^=1; const want=active('valve').filter(o=>o.word===a.c);
    if(want.length){ want.forEach(o=>finish(o,true)); ev('ok','OK! '+W[a.c].k); }
    else if(active('valve').length){ S.hp-=12; S.stats.wrong++; ev('bad','Wrong valve! Steam!'); }
  }
}
function hostIn(who, m){ // a guest message: absolute position + recent actions with counters
  if(!S || !m) return;
  if(m.ready && S.ph==='ready') S.ready[who]=true;
  if(typeof m.x==='number'){ const p=S.players[who]; p.x=m.x; p.y=m.y; p.a=AREA[m.a]?m.a:'cab'; pos[who]={x:m.x,y:m.y,a:p.a}; }
  (m.acts||[]).forEach(a=>{ if(a.n>LOCAL.seen[who]){ LOCAL.seen[who]=a.n; hostAct(who, a); } });
}

// ---------- my own actions ----------
function doAct(a){
  if(MODE==='guest'){ LOCAL.actN++; LOCAL.acts.push({...a, n:LOCAL.actN}); if(LOCAL.acts.length>12) LOCAL.acts.shift(); sendGuest(true); }
  else hostAct(ME, a);
}
function nearest(){ // the closest thing I can use, for the action button
  const p=pos[ME], list=[];
  const add=(k,s,label,extra)=>{ if(s.a===p.a){ const d=Math.hypot(p.x-s.x,p.y-s.y); if(d<=REACH) list.push({k,d,label,...extra}); } };
  const carry=S && S.players[ME].carry;
  if(!carry) add('bin', SPOT.bin, 'LOAD'); else add('fire', SPOT.fire, 'FIRE');
  COLORS.forEach(c=>add('valve', {...VALVE[c], a:'cab'}, 'TURN', {c}));
  add('brake', SPOT.brake, 'BRAKE\n(hold)'); add('ladder', SPOT.ladder, 'CLIMB\nUP'); add('hatch', SPOT.hatch, 'CLIMB\nDOWN');
  add('lever', SPOT.lever, 'LEVER'); add('door', SPOT.door, 'CARGO\nCAR ◀'); add('back', SPOT.back, 'CAB ▶'); add('pump', SPOT.pump, 'PUMP\n(hold)');
  if(S){ ['A','B'].forEach(k=>{ if(!S.lamps[k]) add('lamp', SPOT['lamp'+k], 'LIGHT', {id:k}); }); }
  list.sort((a,b)=>a.d-b.d); return list[0]||null;
}
function useNearest(){
  const n=nearest(); if(!n || !S || S.ph!=='run') return;
  if(n.k==='ladder'){ pos[ME]={x:SPOT.hatch.x, y:SPOT.hatch.y-50, a:'roof'}; SND.pick(); return; }
  if(n.k==='hatch'){ pos[ME]={x:SPOT.ladder.x, y:SPOT.ladder.y+60, a:'cab'}; SND.pick(); return; }
  if(n.k==='door'){ pos[ME]={x:SPOT.back.x-70, y:SPOT.back.y, a:'cargo'}; SND.pick(); return; }
  if(n.k==='back'){ pos[ME]={x:SPOT.door.x+70, y:SPOT.door.y, a:'cab'}; SND.pick(); return; }
  doAct({k:n.k, c:n.c, id:n.id});
}

// ---------- networking: claude.ai room (inside claude.ai) or PeerJS (anywhere else) ----------
async function roomApi(){ try{ return window.claude && claude.use ? await claude.use('room') : null; }catch(e){ return null; } }
async function netHost(code){
  const R=await roomApi();
  if(R){ const room=await R.join('mrc-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room};
    room.presence({role:'host'}); room.onPeers(ch=>{ const gp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='guest'); guestHere=!!gp; if(gp && gp.presence.inp) hostIn('g', gp.presence.inp); });
    NET.send=st=>room.presence({role:'host', st}).catch(()=>{}); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer('kotoba-mrc-'+code.toLowerCase(), {debug:0}); NET={kind:'online (PeerJS)', code, peer};
    peer.on('open', ()=>res(true)); peer.on('error', e=>res(e.type==='unavailable-id' ? 'taken' : 'Could not open a room: '+e.type));
    peer.on('connection', c=>{ NET.conn=c; c.on('open', ()=>{ guestHere=true; }); c.on('data', m=>m && m.inp && hostIn('g', m.inp)); c.on('close', ()=>{ guestHere=false; toast('Your friend left','bad'); }); });
    NET.send=st=>{ if(NET.conn && NET.conn.open) NET.conn.send({st}); }; });
}
async function netJoin(code){
  const R=await roomApi();
  if(R){ const room=await R.join('mrc-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room}; room.presence({role:'guest', inp:{}});
    room.onPeers(ch=>{ const hp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='host'); if(hp && hp.presence.st) onHostState(hp.presence.st); });
    NET.send=inp=>room.presence({role:'guest', inp}).catch(()=>{}); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer({debug:0}); NET={kind:'online (PeerJS)', code, peer}; let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; res('No room with that code (or the connection is blocked).'); } }, 12000);
    peer.on('error', e=>{ if(!done){ done=true; clearTimeout(t); res(e.type==='peer-unavailable' ? 'No room with that code.' : 'Connection problem: '+e.type); } });
    peer.on('open', ()=>{ const c=peer.connect('kotoba-mrc-'+code.toLowerCase(), {reliable:true}); NET.conn=c;
      c.on('open', ()=>{ if(!done){ done=true; clearTimeout(t); res(true); } }); c.on('data', m=>m && m.st && onHostState(m.st)); c.on('close', ()=>toast('The host left','bad')); });
    NET.send=inp=>{ if(NET.conn && NET.conn.open) NET.conn.send({inp}); }; });
}
let lastSend=0;
function sendGuest(now){ const t=performance.now(); if(!now && t-lastSend<(NET.room?160:80)) return; lastSend=t;
  NET.send({x:Math.round(pos.g.x), y:Math.round(pos.g.y), a:pos.g.a, acts:LOCAL.acts.slice(), ready:LOCAL.ready}); }
let lastPush=0;
function pushState(){ const t=performance.now(); if(t-lastPush<(NET.room?160:90)) return; lastPush=t; NET.send(S); }
function onHostState(st){ const fresh=!S || S.gid!==st.gid; S=st; if(fresh) newRun(); pos.h={x:st.players.h.x, y:st.players.h.y, a:st.players.h.a}; }

    [[180,CARGOY+400],[250,CARGOY+440],[760,CARGOY+230],[820,CARGOY+170],[440,CARGOY+460]].forEach(([x,y])=>{ g.fillStyle(0xB07A47); g.fillRect(x-30,y-30,60,60); g.lineStyle(4,0x2A211B); g.strokeRect(x-30,y-30,60,60); g.lineBetween(x-30,y-30,x+30,y+30); });
    g.fillStyle(0x4A5A6A); g.fillRoundedRect(SPOT.pump.x-60,CARGOY+90,90,120,12); g.lineStyle(5,0x2A211B); g.strokeRoundedRect(SPOT.pump.x-60,CARGOY+90,90,120,12);
    this.tank=this.add.rectangle(SPOT.pump.x-15, CARGOY+205, 70, 100, 0x5BC0FF).setOrigin(.5,1).setAlpha(.9);
    g.fillStyle(0x8C96A0); g.fillRect(SPOT.pump.x+34,CARGOY+150,30,50); g.strokeRect(SPOT.pump.x+34,CARGOY+150,30,50);
    this.pumpH=this.add.rectangle(SPOT.pump.x+49, CARGOY+150, 8, 40, 0x2A211B).setOrigin(.5,1);
    this.lampG={}; ['A','B'].forEach(k=>{ const sp=SPOT['lamp'+k]; g.fillStyle(0x2A211B); g.fillRect(sp.x-4, sp.y-60, 8, 40);
      this.lampG[k]={ glow:this.add.circle(sp.x, sp.y-10, 46, 0xFFE9A0, .28), bulb:this.add.circle(sp.x, sp.y-10, 18, 0xFFE14D).setStrokeStyle(4,0x2A211B) }; });
    // doors between the cab and the cargo car
    g.fillStyle(0x5A3E2E); g.fillRect(52,SPOT.door.y-50,22,100); g.fillRect(886,SPOT.back.y-50,22,100); this.label(105,SPOT.door.y-70,'◀🚪'); this.label(855,SPOT.back.y-70,'🚪▶');
    this.label(SPOT.pump.x-15, CARGOY+70+0, '💧');
    // ---- crew ----
    this.crew={}; ['h','g'].forEach(w=>{ const s=this.add.image(0,0,'shiba').setDisplaySize(64,79); if(w==='g') s.setTint(0x9DB8FF);
      const tag=this.add.text(0,-56,w==='h'?'P1':'P2',{fontFamily:'Nunito',fontStyle:'900',fontSize:'16px',color:'#2A211B',backgroundColor:w==='h'?'#FFB23E':'#7FD7FF',padding:{x:6,y:2}}).setOrigin(.5);
      const coal=this.add.circle(0,-36,11,0x1C1C22).setStrokeStyle(2,0x55555F).setVisible(false); const c=this.add.container(0,0,[s,coal,tag]); this.crew[w]={c,coal,drawn:{x:0,y:0}}; });
    this.ring=this.add.circle(0,0,REACH*.55,0xFFFFFF,0).setStrokeStyle(4,0xFFE14D,.9);
    this.follow();

  sign(x, txt){ const c=this.add.container(x,0); const b=this.add.rectangle(0,0,140,58,0xFFFFFF).setStrokeStyle(5,0x2A211B); const t=this.add.text(0,-2,txt,{fontFamily:'"Zen Maru Gothic"',fontStyle:'900',fontSize:'32px',color:'#2A211B'}).setOrigin(.5);
    const ar=this.add.text(0,30,'',{fontFamily:'Nunito',fontStyle:'900',fontSize:'18px',color:'#FFE14D'}).setOrigin(.5); c.add([b,t,ar]); c.t=t; c.ar=ar; return c; }
  label(x,y,t){ this.add.text(x,y,t,{fontSize:'22px'}).setOrigin(.5); }
  groundTex(){ if(this.textures.exists('ground')) return 'ground'; const g=this.make.graphics({add:false}); g.fillStyle(0x24324A); g.fillRect(0,0,64,64);
    g.fillStyle(0x5A4636); g.fillRect(4,10,14,44); g.fillRect(36,10,14,44); g.fillStyle(0xC9CFD8); g.fillRect(0,20,64,4); g.fillRect(0,40,64,4); g.generateTexture('ground',64,64); g.destroy(); return 'ground'; }
  follow(){ const c=this.crew && this.crew[ME]; if(c) this.cameras.main.startFollow(c.c, true, .15, .15); }
  shake(){ this.cameras.main.shake(220, .008); }
  update(time, dtMs){
    const dt=Math.min(.05, dtMs/1000);
    // move me (joystick or keys), kept inside the area I'm in
    const k=IN.keys; let dx=IN.dx+((k.arrowright||k.d)?1:0)-((k.arrowleft||k.a)?1:0), dy=IN.dy+((k.arrowdown||k.s)?1:0)-((k.arrowup||k.w)?1:0);
    const L=Math.hypot(dx,dy); if(L>1){ dx/=L; dy/=L; }
    if(S && S.ph==='run'){ const p=pos[ME], A=AREA[p.a]; p.x=Math.max(A.x0,Math.min(A.x1,p.x+dx*240*dt)); p.y=Math.max(A.y0,Math.min(A.y1,p.y+dy*240*dt)); }
    if(MODE==='host' || MODE==='local'){ hostTick(dt); if(MODE==='host' && S) pushState(); }
    if(MODE==='guest') sendGuest();
    if(!S) return;
    // draw the crew: me where I am, my crewmate smoothed toward their last known place
    ['h','g'].forEach(w=>{ const c=this.crew[w], target = (w===ME || MODE==='local') ? pos[w] : (MODE==='host' ? pos.g : pos.h), ty=target.a==='roof'?target.y:target.y;
      const snap = w===ME || Math.abs(c.drawn.y-ty)>200; c.drawn.x = snap ? target.x : c.drawn.x+(target.x-c.drawn.x)*.25; c.drawn.y = snap ? ty : c.drawn.y+(ty-c.drawn.y)*.25;
      c.c.setPosition(c.drawn.x, c.drawn.y); c.coal.setVisible(!!S.players[w].carry); c.c.setDepth(c.drawn.y); });
    // the camera keeps to the area I'm in
    const cam=this.cameras.main, a=pos[ME].a, top={cab:0, roof:ROOFY, cargo:CARGOY}[a], z=Math.max(.55, Math.min(1.5, this.scale.height/470)); if(Math.abs(cam.zoom-z)>.01) cam.setZoom(z); // fit the room's height on any phone
    if(cam._a!==a){ cam._a=a; cam.setBounds(0, top, 960, a==='roof'?480:560); }
    const n=nearest(); this.ring.setVisible(!!n); if(n){ const s = n.k==='valve' ? VALVE[n.c] : n.k==='lamp' ? SPOT['lamp'+n.id] : SPOT[n.k]; this.ring.setPosition(s.x, s.y); this.ring.setScale(1+.06*Math.sin(time/120)); }
    // the train is moving: ground scrolls past the roof, lights slide past the windows, the fire glows with its power
    const v=(S.speed||0); this.ground.tilePositionX+=v*420*dt; this.ground2.tilePositionX+=v*420*dt;
    this.winLights.forEach(l=>{ l.x-=v*260*dt; if(l.x<150) l.x=900; });
    this.fire.setScale(.6+.5*S.power/100+.05*Math.sin(time/90)); this.fire.setFillStyle(S.power<25?0x8A3A20:0xFF7A2E);
    COLORS.forEach(c=>{ const w=this.valves[c], want=S.valves[c]?Math.PI/4:0; w.rotation+=(want-w.rotation)*.2; });
    this.tank.setScale(1, Math.max(.02, S.water/100)); this.tank.setFillStyle(S.water<25?0xE04A3C:0x5BC0FF);
    ['A','B'].forEach(k=>{ const L=this.lampG[k], on=!!S.lamps[k]; L.bulb.setFillStyle(on?0xFFE14D:0x3A3A44); L.glow.setVisible(on); });
    this.brake.rotation+=S.brakeHold*dt*4; this.lever.rotation = S.lever==='L' ? -.6 : S.lever==='R' ? .6 : 0;
    if(S.sign){ this.signs.setVisible(true); this.signL.t.setText(W[S.sign.L].k); this.signR.t.setText(W[S.sign.R].k); this.signL.ar.setText('◀'); this.signR.ar.setText('▶'); } else this.signs.setVisible(false);
    if(v>.2){ this._clk=(this._clk||0)+v*dt; if(this._clk>.45){ this._clk=0; SND.clack(v); } }
    hudFrame();
  }
}
