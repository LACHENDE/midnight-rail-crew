<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Midnight Rail Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* 真夜中の地下鉄 Midnight Rail Crew v4: lost in the secret tunnels under Tokyo.
   The Driver sees the 3D tunnels and the kana signs, but never the map. The Navigator has the map (pictures only),
   but it never shows where the train is. Passengers to deliver, and a ghost train that hunts you. */
:root{ --ink:#2A211B; --paper:#FFF8EE; --night:#07050C; --amber:#FFB23E; --red:#E04A3C; --green:#7EE08A; --dim:#CFC3E6; --brass:#C9A14A; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--paper);font-family:Nunito,"Zen Maru Gothic",system-ui,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation}
[hidden]{display:none!important}
#three{position:fixed;inset:0}
#three canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 8px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.meters{display:flex;flex-direction:column;gap:5px;flex:1;max-width:min(230px,calc(50vw - 210px))}
.meter{display:flex;align-items:center;gap:6px;font:900 11px Nunito,sans-serif;letter-spacing:.06em}
.meter span{width:44px;flex:none}
.bar{flex:1;height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transform-origin:0 50%;transition:transform .2s}
.bar.low i{background:var(--red)}
.trip{position:relative;flex:1;height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid var(--ink)}
.trip b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:4px;background:var(--amber);border:2px solid var(--ink)}
.trip em{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ink);border:2px solid var(--dim)}
.trip em.ok{background:var(--green)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto;pointer-events:auto}
.badge{font:900 12px Nunito,sans-serif;background:rgba(16,10,24,.88);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.badge img{width:26px;height:26px;object-fit:contain;margin:-4px 0}
.badge.test{background:#3A1E19;border:2px dashed var(--amber);color:#FFDDB0}
.switch{font:900 13px Nunito,sans-serif;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:6px 10px;cursor:pointer}
/* driver: the cab */
.cab{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 78% 72% at 50% 44%,rgba(0,0,0,0) 58%,rgba(8,3,2,.55) 80%,rgba(8,3,2,.95))}
.cab .strut{position:absolute;bottom:0;width:20%;height:13%;background:linear-gradient(#5A1E1A,#2A0F0D);border-top:4px solid var(--brass)}
.cab .strut.l{left:0;border-top-right-radius:36px}.cab .strut.r{right:0;border-top-left-radius:36px}
#ghostVig{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(ellipse 80% 75% at 50% 50%,rgba(0,0,0,0) 45%,rgba(150,10,60,.9))}
.dash{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:rgba(16,10,24,.9);border:3px solid var(--ink);border-radius:16px;padding:3px 10px;font:900 12px Nunito,sans-serif;white-space:nowrap;pointer-events:auto}
.dash b{font-size:20px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.dash .f{font-size:19px}
.chip{border:2px solid var(--ink);border-radius:10px;background:var(--paper);color:var(--ink);font:900 17px "Zen Maru Gothic",sans-serif;padding:1px 8px;cursor:pointer;display:inline-flex;align-items:baseline;gap:4px;touch-action:none}
.chip small{font:800 10px Nunito,sans-serif;color:#2E7D4F}
.chip:disabled{background:#2E2640;color:#A99BC4;border-color:#2E2640;font:900 12px Nunito,sans-serif;cursor:default}
.lever{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:8px;align-items:flex-end;pointer-events:auto}
.lever button{min-width:88px;height:74px;border:4px solid var(--ink);border-radius:16px;background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--ink);font:900 21px "Zen Maru Gothic",Nunito,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px 10px;cursor:pointer;line-height:1.05;touch-action:none}
.lever button i{font:900 15px Nunito,sans-serif;font-style:normal;color:#6B5E54}
.lever button small{font:800 10px Nunito,sans-serif;color:#2E7D4F}
.lever button.on{background:var(--amber);transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.lever button.on i{color:var(--ink)}
.lever button:disabled{cursor:default;opacity:.85}
.lever .note{font:900 14px Nunito,sans-serif;background:rgba(16,10,24,.88);border:3px solid var(--ink);border-radius:12px;padding:8px 12px;color:var(--dim)}
.lever .note.dead{background:#5A1010;color:#FFD0C8;border-color:#FF8A7E;animation:blink .5s steps(2) infinite}
.ctl{position:absolute;right:max(12px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 12px);width:214px;height:178px;pointer-events:auto}
.ctl button{position:absolute;border:4px solid var(--ink);color:var(--ink);font:900 16px Nunito,sans-serif;box-shadow:0 5px 0 var(--ink);touch-action:none;cursor:pointer;padding:0}
.ctl [data-k=go]{right:0;bottom:0;width:124px;height:124px;border-radius:50%;background:var(--amber);font-size:22px}
.ctl [data-k=brake]{left:0;bottom:8px;width:82px;height:82px;border-radius:50%;background:#FF8A7E;font-size:14px}
.ctl .flip{right:10px;top:0;height:42px;padding:0 12px;border-radius:12px;background:#C9F2D1;font-size:14px}
.ctl button.held{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);filter:brightness(1.1)}
.bubble{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 94px);transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:16px;box-shadow:0 4px 0 var(--ink);padding:4px 10px;font:900 24px "Zen Maru Gothic",sans-serif;pointer-events:auto;white-space:nowrap;z-index:5}
.bubble small{display:block;font:800 11px Nunito,sans-serif;color:#2E7D4F}
.bubble button{border:2px solid var(--ink);border-radius:9px;background:#E2E6FA;width:32px;height:32px;font-size:14px;cursor:pointer;padding:0}
.bubble.nb{top:8px}
.bubble.pop{animation:bpop .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes bpop{from{transform:translateX(-50%) scale(.6);opacity:0}}
#fade{position:fixed;inset:0;z-index:3;background:#000;opacity:0;pointer-events:none}
#scare{position:fixed;inset:0;z-index:12;pointer-events:none;display:flex;align-items:center;justify-content:center}
#scare img{width:min(70vh,55vw)}
#scare b{position:absolute;bottom:10%;font:900 60px Nunito,sans-serif;color:#fff;-webkit-text-stroke:3px #2A211B}
/* navigator: the map desk */
.desk{position:absolute;inset:0;z-index:1;pointer-events:auto;background:radial-gradient(80% 90% at 50% 40%,#5A3A22,#24140A 78%)}
.deskIn{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 46px);bottom:calc(env(safe-area-inset-bottom) + 8px);display:flex;gap:10px;padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.tickets{width:27%;flex:none;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.tickets h4{margin:0;font:900 12px Nunito,sans-serif;letter-spacing:.12em;color:#FFDDB0}
.tickets .small{color:#FFDDB0;margin:0}
.tk{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:4px 6px;box-shadow:0 3px 0 var(--ink);position:relative;overflow:hidden;flex:none}
.tk .fc{font-size:22px}
.tk b{font:900 22px "Zen Maru Gothic",sans-serif;flex:1;line-height:1.05}
.tk small{display:block;font:800 11px Nunito,sans-serif;color:#2E7D4F}
.tk button{border:2px solid var(--ink);border-radius:9px;background:#E2E6FA;font:900 12px Nunito,sans-serif;width:28px;height:28px;padding:0;cursor:pointer;color:var(--ink)}
.tk .t{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--red);transform-origin:0 50%}
.tk.new{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.mapCard{flex:1;min-width:0;position:relative;background:radial-gradient(130% 120% at 50% 45%,#F7EBD0 50%,#D8BC88);border:4px solid var(--ink);border-radius:18px;box-shadow:inset 0 0 34px rgba(110,70,20,.4),0 6px 0 rgba(0,0,0,.45);overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.tools{width:82px;flex:none;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.tool{border:3px solid var(--ink);border-radius:14px;background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);font:900 12px Nunito,sans-serif;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tool span{font-size:22px;line-height:1}
.tool.on{background:var(--amber)}
.tool:disabled{opacity:.45;cursor:default}
.alarm{border:3px solid var(--red);border-radius:14px;background:#4A0F0A;color:#FFB4AA;font:900 11px Nunito,sans-serif;text-align:center;padding:5px 2px;animation:blink .5s steps(2) infinite}
.alarm b{display:block;font-size:24px}
@keyframes blink{50%{border-color:#FFDDB0}}
#map .ln{fill:none;stroke:#5A3B22;stroke-width:13;stroke-linecap:round}
#map .ln2{fill:none;stroke:#E2C792;stroke-width:3;stroke-linecap:round;stroke-dasharray:3 9}
#map .ln.closed{stroke:#BBA782;stroke-width:6;stroke-dasharray:9 11}
#map .st circle{fill:#FFF8EE;stroke:#2A211B;stroke-width:4}
#map .st text{font-size:38px;text-anchor:middle;dominant-baseline:central}
#map .st.closed{opacity:.33}
#map .st.depot circle{fill:#D6C6A6}
#map .st.depot text{font-size:24px}
#map .st.safe circle{stroke:#E8A21A;animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{from{stroke-width:6}to{stroke-width:14}}
#map .st.called circle{fill:#FFD98A}
#map .wt rect{fill:#2A211B;opacity:.88}
#map .wt text{font-size:19px;text-anchor:middle;dominant-baseline:central}
#map .ink{fill:none;stroke:#C0392B;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.8}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* shared */
.waveCard{position:absolute;z-index:7;left:50%;top:46%;transform:translate(-50%,-50%);width:min(540px,62vw);background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:10px 14px 12px;text-align:center;pointer-events:none;animation:wpop .35s cubic-bezier(.2,1.5,.4,1)}
.waveCard .word{pointer-events:auto}
@keyframes wpop{from{transform:translate(-50%,-50%) scale(.6);opacity:0}}
.waveCard h3{margin:0;font:900 22px "Zen Maru Gothic",Nunito,sans-serif}.waveCard h3 small{font:900 12px Nunito,sans-serif;letter-spacing:.1em;color:#6B5E54;display:block}
.waveCard p{margin:8px 0 0;font:800 13px/1.35 Nunito,sans-serif;color:#4A3F37}
.waveCard .bar2{height:6px;border-radius:9px;background:#E6DCCB;margin-top:8px;overflow:hidden}.waveCard .bar2 i{display:block;height:100%;background:var(--amber);transform-origin:0 50%}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:7px;margin-top:8px}
.word{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:6px 2px 4px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.word b{font:900 20px "Zen Maru Gothic",sans-serif;white-space:nowrap}.word small{font:800 11px Nunito,sans-serif;color:#6B5E54}
.rest{position:absolute;z-index:7;left:50%;top:calc(env(safe-area-inset-top) + 50px);transform:translateX(-50%);font:900 15px Nunito,"Zen Maru Gothic",sans-serif;background:#C9F2D1;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.rest.chase{background:#FF8A7E;animation:blink .5s steps(2) infinite}
.hud.navOn .rest{top:auto;bottom:calc(env(safe-area-inset-bottom) + 14px)}
.toast{position:absolute;z-index:8;left:50%;top:38%;transform:translate(-50%,-50%);font:900 22px Nunito,"Zen Maru Gothic",sans-serif;padding:6px 14px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);opacity:0;white-space:nowrap}
.toast.ok{background:var(--green)}.toast.bad{background:#FF8A7E}.toast.go{background:var(--amber)}
.card{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(8,5,16,.82)}
.in{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:14px 18px;width:min(660px,100%);max-height:100%;overflow:auto;text-align:center}
.in h2{margin:0;font:900 24px/1.15 "Zen Maru Gothic",sans-serif}
.in h2 small{display:block;font:900 12px Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6B5E54;margin-top:4px}
.in p{margin:8px 0 0;font:700 14px/1.4 Nunito,sans-serif;color:#4A3F37}
.hero{position:relative;height:min(30vh,170px);border-radius:14px;border:3px solid var(--ink);overflow:hidden;background:#050308}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero img{position:absolute;object-fit:contain}
.hero .p1{left:4%;bottom:-4%;height:72%}.hero .p2{right:4%;bottom:-4%;height:72%}
.hero .gh{left:63%;top:50%;height:30%;opacity:.8;transform:translateX(-50%);animation:float 2.2s ease-in-out infinite alternate}
.hero .ttl{position:absolute;left:0;right:0;top:8px;text-align:center;font:900 26px "Zen Maru Gothic",sans-serif;color:#FFF3D6;text-shadow:0 3px 0 #2A211B}
.hero .ttl small{display:block;font:900 11px Nunito,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--amber)}
@keyframes float{to{transform:translate(-50%,-12%)}}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;text-align:left}
.roles div{display:flex;gap:8px;align-items:center;background:#F3E9DA;border-radius:14px;padding:6px 8px;font:800 13px/1.3 Nunito,sans-serif}
.roles img{width:64px;height:64px;object-fit:contain;flex:none}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{font:900 17px Nunito,sans-serif;color:var(--ink);background:var(--amber);border:4px solid var(--ink);border-radius:999px;padding:11px 22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn.alt{background:var(--paper)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.code{font:900 44px Nunito,sans-serif;letter-spacing:.2em;background:var(--night);color:var(--amber);border:4px solid var(--ink);border-radius:16px;padding:4px 16px;display:inline-block;margin-top:8px}
input.codein{font:900 22px Nunito,sans-serif;letter-spacing:.2em;text-transform:uppercase;width:120px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:8px}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.res span{background:#F3E9DA;border-radius:12px;padding:7px 2px;font:800 11px Nunito,sans-serif;color:#6B5E54;display:flex;flex-direction:column}
.res b{font:900 20px Nunito,sans-serif;color:var(--ink)}
.small{font:800 12px Nunito,sans-serif;color:#6B5E54}
.rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--night);font:900 20px Nunito,sans-serif;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){ .rotate{display:flex} }
</style>
</head>
<body>
<div id="three"></div>
<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="meters">
      <div class="meter"><span>TRAIN</span><div class="bar" id="hpBar"><i></i></div></div>
      <div class="meter"><span>WAVE</span><div class="trip" id="trip"></div></div>
    </div>
    <div class="side"><span class="badge" id="role"></span><span class="badge test" id="testBadge" hidden>LOCAL TEST · not online</span><button class="switch" id="switchBtn" hidden>Switch view</button></div>
  </div>
  <div id="driverUI" hidden>
    <div class="cab"><div class="strut l"></div><div class="strut r"></div></div>
    <div id="ghostVig"></div>
    <div class="dash"><span>SPEED</span><b id="spd">0</b><span>km/h ·</span><span id="faces"></span><span>·</span><span id="here"></span></div>
    <div class="bubble" id="callD" hidden></div>
    <div class="lever" id="lever"></div>
    <div class="ctl"><button class="flip" id="flipBtn" hidden>⇄ other cab</button><button data-k="brake">BRAKE</button><button data-k="go">GO</button></div>
  </div>
  <div class="desk" id="navUI" hidden>
    <div class="deskIn">
      <div class="tickets" id="tickets"></div>
      <div class="mapCard"><svg id="map" viewBox="0 0 780 500" preserveAspectRatio="xMidYMid meet" aria-label="Tunnel map: tap a station to call out its name"></svg><div class="bubble nb" id="callN" hidden></div></div>
      <div class="tools"><div class="alarm" id="ghostAlarm" hidden>GHOST<b>👻</b></div><button class="tool" id="penBtn"><span>✏️</span>Pencil</button><button class="tool" id="clearBtn"><span>🧽</span>Clear</button><button class="tool" id="pingBtn"><span>📡</span>PING ×<b id="pingN">3</b></button></div>
    </div>
  </div>
  <div class="waveCard" id="waveCard" hidden></div>
  <div class="rest" id="restBanner" hidden></div>
  <div class="toast" id="toast"></div>
</div>
<div id="fade"></div>
<div id="scare" hidden></div>
<div class="card" id="card"></div>
<div class="rotate"><div style="font-size:46px">📱↻</div>Turn your phone sideways to play</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ART='art/web/';

// ---------- stations: the navigator's map shows only pictures, the driver's signs only kana ----------
const WD={ tokyo:{k:'とうきょう',ro:'tōkyō',m:'Tokyo',ic:'🗼'}, umi:{k:'うみ',ro:'umi',m:'sea',ic:'🌊'}, yama:{k:'やま',ro:'yama',m:'mountain',ic:'🗻'},
  tsuki:{k:'つき',ro:'tsuki',m:'moon',ic:'🌙'}, kitsune:{k:'きつね',ro:'kitsune',m:'fox',ic:'🦊'}, jinja:{k:'じんじゃ',ro:'jinja',m:'shrine',ic:'⛩️'},
  sakura:{k:'さくら',ro:'sakura',m:'cherry blossom',ic:'🌸'}, neko:{k:'ねこ',ro:'neko',m:'cat',ic:'🐱'}, inu:{k:'いぬ',ro:'inu',m:'dog',ic:'🐶'},
  sakana:{k:'さかな',ro:'sakana',m:'fish',ic:'🐟'}, hoshi:{k:'ほし',ro:'hoshi',m:'star',ic:'⭐'}, onigiri:{k:'おにぎり',ro:'onigiri',m:'rice ball',ic:'🍙'},
  dango:{k:'だんご',ro:'dango',m:'dango (sweet)',ic:'🍡'} };
// x/z on the map grid (z grows southwards); wv = the wave whose tunnels open the station
const NODES={ depot:{x:2,z:4,wv:0}, tokyo:{x:2,z:3,wv:0}, umi:{x:.8,z:3,wv:1}, yama:{x:3.2,z:3,wv:1}, kitsune:{x:2,z:2,wv:2}, tsuki:{x:.8,z:2,wv:2},

  onigiri:{x:4.4,z:1.6,wv:6}, dango:{x:.8,z:0,wv:6} };
const LINKS=[['depot','tokyo'],['tokyo','umi'],['tokyo','yama'],['tokyo','kitsune'],['umi','tsuki'],['tsuki','kitsune'],['yama','jinja'],['kitsune','jinja'],['kitsune','sakura'],
  ['tsuki','neko'],['neko','sakura'],['jinja','inu'],['sakura','inu'],['umi','sakana'],['sakura','hoshi'],['inu','onigiri'],['hoshi','dango'],['neko','dango']];

const WAVES=[
  {name:'First stops', words:['tokyo','umi','yama'], chase:false, tip:'Driver: hold GO, pick a tunnel with ◀ ▲ ▶ before each fork, BRAKE to stop in a station. Navigator: your map never shows the train. Listen to your driver and work out where you are!'},
  {name:'Moon & fox', words:['tsuki','kitsune'], chase:false, tip:'The tunnels loop now. Navigator: draw on the map with ✏️ so you don\'t get lost.'},
  {name:'The shrine', words:['jinja','sakura'], chase:true, tip:'Something is following the train… When the ghost train comes, get to the shrine ⛩️ before it catches you! You swap jobs after this wave.'},
  {name:'Cat & dog', words:['neko','inu'], chase:true, tip:'You swapped jobs! The ghost train is a little faster now.'},
  {name:'Fish & stars', words:['sakana','hoshi'], chase:true, tip:'Watch out for dead ends: stop, then ⇄ to drive back out.'},
  {name:'Last train', words:['onigiri','dango'], chase:true, tip:'The last train before dawn. Deliver everyone, and stay away from the ghost!'}];
const T_INTRO=9, T_PLAY=50, T_CALM=34, T_CHASE=24, T_REST=12;
const G=120, RH=16, RT=4.5, FLOOR=-2.7, CEIL=8, EYE=-.5, VMAX=22, ACC=7, BRK=16, FRI=.8, ZONE=12;

// ---------- the tunnel network ----------
for(const id in NODES){ const n=NODES[id]; n.id=id; n.X=(n.x-2)*G; n.Z=(n.z-2)*G; n.adj=[]; }
const EDGES=LINKS.map(([a,b],i)=>{
  const A=NODES[a], B=NODES[b], dx=B.X-A.X, dz=B.Z-A.Z, L=Math.hypot(dx,dz), bend=((i*7)%5-2)*.07*L;
  const cx=(A.X+B.X)/2-dz/L*bend, cz=(A.Z+B.Z)/2+dx/L*bend;
  // sample the curve finely, then every 1 unit of length, so a position along a tunnel is a lookup
  const raw=[], cum=[0];
  for(let k=0;k<=240;k++){ const t=k/240, u=1-t; raw.push([u*u*A.X+2*u*t*cx+t*t*B.X, u*u*A.Z+2*u*t*cz+t*t*B.Z]); if(k) cum.push(cum[k-1]+Math.hypot(raw[k][0]-raw[k-1][0], raw[k][1]-raw[k-1][1])); }
  const len=cum[240], n=Math.ceil(len), px=new Float32Array(n+1), pz=new Float32Array(n+1);
  for(let s=0,k=0;s<=n;s++){ const ss=Math.min(s,len); while(k<239 && cum[k+1]<ss) k++; const f=(ss-cum[k])/((cum[k+1]-cum[k])||1); px[s]=raw[k][0]+(raw[k+1][0]-raw[k][0])*f; pz[s]=raw[k][1]+(raw[k+1][1]-raw[k][1])*f; }

function epos(e,s){ s=clamp(s,0,e.len); const k=Math.min(Math.floor(s),e.n-1), f=s-k; return {x:e.px[k]+(e.px[k+1]-e.px[k])*f, z:e.pz[k]+(e.pz[k+1]-e.pz[k])*f}; }

let S=null;
const tpos=t=>epos(EDGES[t.e],t.s);
const wave1=()=>(S&&S.dir?S.dir.w:0)+1;
const isOpen=j=>EDGES[j].wv<=wave1();
const nodeOpen=id=>NODES[id].wv<=wave1();
const STATIONS=Object.keys(WD);
const openStations=()=>STATIONS.filter(nodeOpen);
const isNew=id=>!!WD[id] && Math.max(1,NODES[id].wv)===wave1();
const nearNode=t=>{ const e=EDGES[t.e]; return t.s<ZONE ? {id:e.a, off:t.s} : e.len-t.s<ZONE ? {id:e.b, off:e.len-t.s} : null; };

// the tunnels you can take when you arrive at a station, as seen from the cab: ◀ left, ▲ straight on, ▶ right
function exitsAt(node, inE){
  const n=NODES[node], ie=EDGES[inE], b=epos(ie, node===ie.b ? ie.len-RH : RH); let fx=n.X-b.x, fz=n.Z-b.z; const fl=Math.hypot(fx,fz)||1; fx/=fl; fz/=fl;
  const ex=n.adj.filter(j=>j!==inE && isOpen(j)).map(j=>{ const e=EDGES[j], m=epos(e, node===e.a ? RH : e.len-RH); let x=m.x-n.X, z=m.z-n.Z; const l=Math.hypot(x,z)||1; x/=l; z/=l;
    const th=Math.atan2(x*fz-z*fx, x*fx+z*fz); return {j, to:node===e.a?e.b:e.a, th, code:Math.abs(th)<.5?'s':th>0?'l':'r'}; }).sort((p,q)=>q.th-p.th);
  if(new Set(ex.map(x=>x.code)).size<ex.length) ex.forEach((x,i)=>x.code=(ex.length===2?['l','r']:['l','s','r'])[i]);
  return ex;
}
const defaultExit=ex=>ex.reduce((p,q)=>Math.abs(q.th)<Math.abs(p.th)?q:p);
const ARROW={l:'◀', s:'▲', r:'▶'};
let DIST=null, distW=-1;
function dists(){ const w=wave1(); if(distW===w) return DIST; distW=w; const ids=Object.keys(NODES), D={};
  ids.forEach(a=>{ D[a]={}; ids.forEach(b=>D[a][b]=a===b?0:1e9); });
  EDGES.forEach(e=>{ if(isOpen(e.i)){ D[e.a][e.b]=Math.min(D[e.a][e.b],e.len); D[e.b][e.a]=D[e.a][e.b]; } });
  ids.forEach(k=>ids.forEach(a=>ids.forEach(b=>{ if(D[a][k]+D[k][b]<D[a][b]) D[a][b]=D[a][k]+D[k][b]; })));
  return DIST=D; }

const SND={ bad(){ tone(140,0,.3,'square',.12); tone(95,.05,.3,'sawtooth',.08); }, fanfare(){ [523,659,784,1047].forEach((f,k)=>tone(f,k*.08,.4,'triangle',.16)); },

  chase(){ [392,370,349,330].forEach((f,k)=>tone(f,k*.18,.5,'sawtooth',.06)); }, scare(){ tone(900,0,.5,'sawtooth',.14,90); tone(60,0,.6,'square',.12); },

  ping(){ tone(1800,0,.15,'sine',.1,900); tone(1800,.25,.15,'sine',.05,900); }, pop(){ tone(660,0,.08,'sine',.07); } };
// the motor: v<0 off, 0 idle, 1 full speed
function engine(v){ try{ if(!AC) return; const k=v<0?-1:Math.round(v*12); if(k===humK) return; humK=k;
  if(v>=0 && !hum){ const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o.type='sawtooth'; o.frequency.value=40; f.type='lowpass'; f.frequency.value=160; g.gain.value=.0001; o.connect(f); f.connect(g); g.connect(AC.destination); o.start(); hum={o,f,g}; }

function getVoice(){ if(!jaVoice){ try{ jaVoice=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null; }catch(e){} } return jaVoice; }
function say(id){ try{ const u=new SpeechSynthesisUtterance(WD[id].k); u.lang='ja-JP'; u.rate=.85; const v=getVoice(); if(v) u.voice=v;
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

// ---------- state ----------
// MODE 'local' | 'host' | 'guest'. The host runs waves, passengers and the ghost; the driving phone runs the train and sends it.
let MODE='', ME='h', NET={kind:'', send:()=>{}, code:''}, guestHere=false;
const LOCAL={ actN:0, acts:[], seen:{h:0,g:0}, hinted:{}, auto:{}, wc:{}, cc:{}, seenTk:{}, ready:false, view:'', ink:[], stroke:null, pencil:false, pings:3, pingW:-1, pingUntil:0, callN:0, look:null, snap:false, gp:null, gm:null, bellT:0, waitK:'' };
const TR={e:0, s:5, d:1, v:0, sel:null, stamp:'', stopAt:null, clack:0};
function freshState(){
  return { ph:'ready', ready:{h:false, g:MODE==='local'}, t:0, gid:Date.now()%1e9, hp:100, roles:{driver:'h', nav:'g'},
    tr:{e:0, s:5, d:1, v:0}, pax:[], wait:[], pid:0, nextW:0, gh:null, ghNext:0, lastCatch:-99, call:{n:0, id:'', to:''}, callT:{driver:-9, nav:-9},
    evN:0, evq:[], stats:{del:0, perfect:0, missed:0, caught:0, purified:0, calls:0, pings:0, hints:0, bumps:0}, arriveT:0, dir:null };
}
const ev=(kind,txt)=>{ S.evN++; S.evq.push({n:S.evN, kind, txt}); if(S.evq.length>6) S.evq.shift(); };
const trSnap=()=>({e:TR.e, s:+TR.s.toFixed(2), d:TR.d, v:+TR.v.toFixed(2)});

// ---------- the Director: teaching waves, a ghost chase at the peak, then a breather ----------
function director(dt){
  const R=S.dir||(S.dir={w:0, ph:'intro', t:0, rate:0, want:2});
  R.t+=dt; const Wv=WAVES[R.w], last=R.w===WAVES.length-1;
  if(R.ph==='intro' && R.t>T_INTRO){ R.ph='play'; R.t=0; ev('wave','Wave '+(R.w+1)+' · GO!'); }
  else if(R.ph==='play' && R.t>(Wv.chase?T_CALM:T_PLAY)){ if(Wv.chase){ R.ph='chase'; R.t=0; S.ghNext=S.t+1.5; ev('chase','👻 Ghost train! Get to the shrine ⛩️'); } else endWave(); }
  else if(R.ph==='chase' && R.t>T_CHASE+(last?8:0)){ ev('calm','The ghost gave up… 💨'); endWave(); }
  else if(R.ph==='rest' && R.t>T_REST){ R.w++; R.ph='intro'; R.t=0;
    if(R.w===3){ const r=S.roles; [r.driver, r.nav]=[r.nav, r.driver]; ev('swap','役割交代! Swap jobs'); } }
  R.rate=R.ph==='play'||R.ph==='chase' ? clamp(.3+.1*R.w+.3*R.t/T_PLAY,0,1) : 0;
  R.want=Math.max(1, [2,3,3,4,4,4][R.w]-(S.hp<40?1:0)-(S.t-S.lastCatch<20?1:0));
  return R;
}
function endWave(){ const R=S.dir; S.gh=null; if(R.w===WAVES.length-1){ if(!S.arriveT){ S.arriveT=S.t; ev('ok','🌅 夜明け! Dawn: the night is over'); } } else { R.ph='rest'; R.t=0; ev('relax','ひと休み · Breather'); } }

// ---------- host simulation: passengers and the ghost train ----------
function newWait(at){ const nn=nearNode(S.tr), opts=at?[at]:openStations().filter(id=>(!nn||id!==nn.id) && !S.wait.some(w=>w.at===id)); if(!opts.length) return null;
  S.pid++; return {id:S.pid, at:pick(opts), face:pick(FACES), until:S.t+80, life:80}; }
function hostTick(dt){
  if(!S) return;
  if(S.ph==='ready'){ if(S.ready.h && S.ready.g){ S.ph='run'; S.wait.push(newWait('tokyo')); ev('go','出発! Depart'); } return; }
  if(S.ph!=='run') return;
  S.t+=dt;
  if(S.arriveT){ if(S.t-S.arriveT>2.5) S.ph='over'; return; }
  const R=director(dt), live=R.ph==='play'||R.ph==='chase';
  // patience only runs while you play: the word cards and the breathers pause it
  if(!live){ S.pax.forEach(p=>p.until+=dt); S.wait.forEach(p=>p.until+=dt); }
  if(live && S.t>=S.nextW && S.wait.length+S.pax.length<R.want){ const w=newWait(); if(w){ S.wait.push(w); ev('wait',''); } S.nextW=S.t+10-4*R.rate; }
  S.wait=S.wait.filter(p=>{ if(S.t<p.until) return true; ev('gone','💨 A passenger got tired of waiting'); return false; });
  S.pax=S.pax.filter(p=>{ if(S.t<p.until) return true; S.stats.missed++; S.hp-=10; ev('bad','A passenger gave up: '+WD[p.dest].k); return false; });
  if(R.ph==='chase') ghostTick(dt);
  if(S.hp<=0){ S.hp=40; ev('bad','Breakdown! Patching up…'); }
  S.hp=clamp(S.hp,0,100);
}
function stopAt(node, off){
  const nn=nearNode(S.tr); if(!nn || nn.id!==node || S.tr.v>1.5) return;
  const out=S.pax.filter(p=>p.dest===node), inn=S.wait.filter(w=>w.at===node), msg=[];
  if(out.length){ S.pax=S.pax.filter(p=>p.dest!==node); S.stats.del+=out.length; S.hp=Math.min(100,S.hp+4*out.length); const perfect=off<3.5; if(perfect) S.stats.perfect++; msg.push('ありがとう! '+WD[node].k+(perfect?' · ぴったり!':'')); }
  if(inn.length){ S.wait=S.wait.filter(w=>w.at!==node); const life=110-8*(S.dir?S.dir.w:0), D=dists(), dests=openStations().filter(id=>id!==node), far=dests.filter(id=>D[node][id]>G*1.5);
    inn.forEach(w=>S.pax.push({id:w.id, face:w.face, dest:pick(far.length?far:dests), until:S.t+life, life})); msg.push(inn.map(w=>w.face).join('')+' got on'); }
  if(msg.length) ev(out.length?'del':'board', msg.join(' · ')); else ev('stop','');
}
// how far the ghost is from the train if it sets off from this station
function toTrain(node){ const D=dists(), t=S.tr, e=EDGES[t.e]; return Math.min(D[node][e.a]+t.s, D[node][e.b]+e.len-t.s); }
function ghostNext(node, from){ const t=S.tr; let best=null, bd=1e12;
  for(const j of NODES[node].adj){ if(!isOpen(j)) continue; const ne=EDGES[j], other=ne.a===node?ne.b:ne.a;
    let d=j===t.e ? (ne.a===node?t.s:ne.len-t.s) : ne.len+toTrain(other); if(j===from) d+=60; if(d<bd){ bd=d; best=j; } }
  return best; }
function spawnGhost(){ const nn=nearNode(S.tr); let best=null, bd=-1;
  for(const id of openStations()){ if(id==='jinja' || (nn&&nn.id===id)) continue; const d=toTrain(id); if(d<1e8 && d>bd){ bd=d; best=id; } }
  if(!best) return; const j=ghostNext(best,-1); if(j==null) return; const e=EDGES[j];
  S.gh={e:j, s:e.a===best?0:e.len, d:e.a===best?1:-1}; ev('ghost',''); }
function ghostTick(dt){
  if(!S.gh){ if(S.t>=S.ghNext) spawnGhost(); return; }
  const g=S.gh, t=S.tr; let spd=VMAX*(.46+.07*(S.dir.w-2)); if(S.t-S.lastCatch<15) spd*=.75;
  let move=spd*dt, guard=0;
  while(move>0 && guard++<4){
    const e=EDGES[g.e];
    if(g.e===t.e){ g.d=t.s>=g.s?1:-1; g.s+=g.d*Math.min(move, Math.abs(t.s-g.s)); break; }
    const toEnd=g.d>0?e.len-g.s:g.s;
    if(move<toEnd){ g.s+=g.d*move; break; }
    g.s=g.d>0?e.len:0; move-=toEnd;
    const node=g.d>0?e.b:e.a, j=ghostNext(node, g.e); if(j==null) break;
    const ne=EDGES[j]; g.e=j; g.d=ne.a===node?1:-1; g.s=g.d>0?0:ne.len; }

    // the shrine banishes a ghost that reaches you there
    if(nn && nn.id==='jinja'){ S.stats.purified++; ev('purify','お祓い! ⛩️ The shrine banished the ghost'); endWave(); }
    else { S.gh=null; S.ghNext=S.t+6; S.lastCatch=S.t; S.hp-=25; S.stats.caught++; ev('caught','BOO! 👻 The ghost got you!'); } }
}
function hostAct(who, a){
  if(!S || S.ph!=='run' || S.arriveT) return;
  const driver=MODE==='local' || S.roles.driver===who;
  if(a.k==='hint'){ const p=S.pax.find(p=>p.id===a.id); if(p && !p.hint){ p.hint=1; S.stats.hints++; } return; }
  if(a.k==='ping'){ S.stats.pings++; return; }
  if(a.k==='call' && WD[a.id]){ const to=a.to==='nav'?'nav':'driver'; if(S.t-S.callT[to]<.35) return; S.callT[to]=S.t; S.call={n:S.call.n+1, id:a.id, to}; S.stats.calls++; return; }
  if(!driver) return;
  if(a.k==='bump'){ S.stats.bumps++; S.hp-=5; ev('bump','ドン! Dead end'); return; }
  if(a.k==='stop') stopAt(a.node, a.off);
}
function hostIn(who, m){
  if(!S || !m) return;
  if(m.ready && S.ph==='ready') S.ready[who]=true;
  if(m.tr && S.roles.driver===who) S.tr=m.tr;
  (m.acts||[]).forEach(a=>{ if(a.n>LOCAL.seen[who]){ LOCAL.seen[who]=a.n; hostAct(who, a); } });
}
function doAct(a){ if(MODE==='guest'){ LOCAL.actN++; LOCAL.acts.push({...a, n:LOCAL.actN}); if(LOCAL.acts.length>12) LOCAL.acts.shift(); sendGuest(true); } else hostAct(ME, a); }
const iDrive=()=>!!S && (MODE==='local' ? LOCAL.view==='driver' : S.roles.driver===ME);

// ---------- networking: claude.ai room inside claude.ai, PeerJS anywhere else ----------
async function roomApi(){ try{ return window.claude && claude.use ? await claude.use('room') : null; }catch(e){ return null; } }
async function netHost(code){
  const R=await roomApi();
  if(R){ const room=await R.join('mrt-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room};
    room.presence({role:'host'}); room.onPeers(ch=>{ const gp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='guest'); guestHere=!!gp; if(gp && gp.presence.inp) hostIn('g', gp.presence.inp); });
    NET.send=st=>room.presence({role:'host', st}).catch(()=>{}); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer('kotoba-mrt-'+code.toLowerCase(), {debug:0}); NET={kind:'online (PeerJS)', code, peer};
    peer.on('open', ()=>res(true)); peer.on('error', e=>res(e.type==='unavailable-id' ? 'taken' : 'Could not open a room: '+e.type));
    peer.on('connection', c=>{ NET.conn=c; c.on('open', ()=>{ guestHere=true; }); c.on('data', m=>m && m.inp && hostIn('g', m.inp)); c.on('close', ()=>{ guestHere=false; toast('Your friend left','bad'); }); });
    NET.send=st=>{ if(NET.conn && NET.conn.open) NET.conn.send({st}); }; });
}
async function netJoin(code){
  const R=await roomApi();
  if(R){ const room=await R.join('mrt-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room}; room.presence({role:'guest', inp:{}});
    room.onPeers(ch=>{ const hp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='host'); if(hp && hp.presence.st) onHostState(hp.presence.st); });
    NET.send=inp=>room.presence({role:'guest', inp}).catch(()=>{}); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer({debug:0}); NET={kind:'online (PeerJS)', code, peer}; let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; res('No room with that code (or the connection is blocked).'); } }, 12000);
    peer.on('error', e=>{ if(!done){ done=true; clearTimeout(t); res(e.type==='peer-unavailable' ? 'No room with that code.' : 'Connection problem: '+e.type); } });
    peer.on('open', ()=>{ const c=peer.connect('kotoba-mrt-'+code.toLowerCase(), {reliable:true}); NET.conn=c;
      c.on('open', ()=>{ if(!done){ done=true; clearTimeout(t); res(true); } }); c.on('data', m=>m && m.st && onHostState(m.st)); c.on('close', ()=>toast('The host left','bad')); });
    NET.send=inp=>{ if(NET.conn && NET.conn.open) NET.conn.send({inp}); }; });
}
let lastSend=0, lastPush=0;
function sendGuest(now){ const t=performance.now(); if(!now && t-lastSend<(NET.room?160:70)) return; lastSend=t;
  NET.send({acts:LOCAL.acts.slice(), ready:LOCAL.ready, tr: S && S.roles.driver==='g' ? trSnap() : null}); }

function driveTrain(dt){
  const stamp=S.gid+':'+(MODE==='local'?'L':S.roles.driver);
  if(TR.stamp!==stamp){ Object.assign(TR, S.tr, {stamp, sel:null, stopAt:null}); LOCAL.snap=true; }
  const B=IN.btn, k=IN.keys, end=!!S.arriveT, go=!end && (B.go||k.arrowup||k.w), br=end||B.brake||k.arrowdown||k.s;
  TR.v = go ? Math.min(VMAX, TR.v+ACC*dt) : Math.max(0, TR.v-(br?BRK:FRI)*dt);
  let move=TR.v*dt, guard=0;
  while(move>0 && guard++<4){
    const e=EDGES[TR.e], toEnd=TR.d>0?e.len-TR.s:TR.s;
    if(move<toEnd){ TR.s+=TR.d*move; break; }
    TR.s=TR.d>0?e.len:0; move-=toEnd;
    const node=TR.d>0?e.b:e.a, ex=exitsAt(node, TR.e);
    if(!ex.length){ if(TR.v>7){ FX.shake=.7; doAct({k:'bump'}); } TR.v=0; break; }
    const x=selExit(node, ex), ne=EDGES[x.j]; TR.e=x.j; TR.d=ne.a===node?1:-1; TR.s=TR.d>0?0:ne.len; TR.sel=null; }
  TR.clack+=TR.v*dt; if(TR.clack>7){ TR.clack=0; SND.clack(TR.v/VMAX); }
  if(MODE!=='guest') S.tr=trSnap();
  // stopping in a station lets passengers off and on
  const nn=nearNode(TR);
  if(TR.v<.35 && nn && WD[nn.id]){ if(TR.stopAt!==nn.id){ TR.stopAt=nn.id; doAct({k:'stop', node:nn.id, off:+nn.off.toFixed(1)}); } }
  else if(TR.v>2 || !nn) TR.stopAt=null;
}
// walk ahead along the track (through the points as they are set) for the camera to look at
function lookPoint(dist){
  let e=EDGES[TR.e], s=TR.s, d=TR.d, left=dist, guard=0;
  while(guard++<4){
    const toEnd=d>0?e.len-s:s;
    if(left<=toEnd) return epos(e, s+d*left);
    left-=toEnd; const node=d>0?e.b:e.a, ex=exitsAt(node, e.i);
    if(!ex.length){ const p=epos(e, d>0?e.len:0), r=edir(e, d>0?e.len:0); return {x:p.x+r.x*d*left, z:p.z+r.z*d*left}; }
    const x=selExit(node, ex); e=EDGES[x.j]; d=e.a===node?1:-1; s=d>0?0:e.len; }
  return epos(e,s);
}
function flipCab(){ if(!S || S.ph!=='run' || TR.v>.5) return; TR.d=-TR.d; TR.sel=null; LOCAL.snap=true; SND.flip(); try{ $('#fade').animate([{opacity:.9},{opacity:0}],{duration:380}); }catch(e){} }

  if(b.dataset.hint){ const id=+b.dataset.hint; LOCAL.hinted[id]=1; doAct({k:'hint', id}); return; }
  if(b.id==='penBtn'){ LOCAL.pencil=!LOCAL.pencil; b.classList.toggle('on', LOCAL.pencil); return; }
  if(b.id==='clearBtn'){ LOCAL.ink=[]; drawInk(); return; }
  if(b.id==='pingBtn'){ if(LOCAL.pings>0 && S && S.ph==='run'){ LOCAL.pings--; LOCAL.pingUntil=performance.now()+2600; SND.ping(); doAct({k:'ping'}); } return; }
  if(b.id==='switchBtn'){ LOCAL.view = LOCAL.view==='driver' ? 'nav' : 'driver'; IN.btn={}; document.querySelectorAll('.held').forEach(x=>x.classList.remove('held')); return; }
  const a=b.dataset.a; if(!a) return; audio();
  if(a==='local'){ MODE='local'; ME='h'; NET={kind:'local test', code:'—', send:()=>{}}; S=freshState(); newRun(); $('#testBadge').hidden=false; $('#switchBtn').hidden=false; return; }
  if(a==='create'){ card('<h2>Opening a room…</h2>'); let r, code; for(let i=0;i<4;i++){ code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''); r=await netHost(code); if(r!=='taken') break; }
    if(r!==true) return lobby(r||'Online play is not available here.');
    MODE='host'; ME='h'; $('#testBadge').hidden=true; $('#switchBtn').hidden=true;
    card(`<h2>Room code<small>${esc(NET.kind)}</small></h2><div class="code">${code}</div><p>Your friend opens this same page, types the code and taps Join.</p><p class="small">Waiting for your friend…</p>`);
    const wait=setInterval(()=>{ if(MODE!=='host'){ clearInterval(wait); return; } if(guestHere){ clearInterval(wait); S=freshState(); newRun(); } }, 300); return; }
  if(a==='join'){ const code=($('#codeIn').value||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(code)) return lobby('Type the 4-character code.');
    card('<h2>Joining…</h2>'); const r=await netJoin(code); if(r!==true) return lobby(r);
    MODE='guest'; ME='g'; $('#testBadge').hidden=true; $('#switchBtn').hidden=true; if(!S) card('<h2>Joined!<small>waiting for the host</small></h2>');
    const keep=setInterval(()=>{ if(MODE!=='guest'){ clearInterval(keep); return; } sendGuest(); }, 400); return; }
  if(a==='ready'){ LOCAL.ready=true; if(MODE==='guest') sendGuest(true); else { S.ready.h=true; if(MODE==='local') S.ready.g=true; } shownPh=''; return; }
  if(a==='again'){ S=freshState(); newRun(); return; }
  if(a==='lobby'){ try{ NET.peer && NET.peer.destroy(); NET.room && NET.room.leave(); }catch(x){} location.reload(); }
});

// ---------- main loop ----------
let last=0;
function loop(time){
  requestAnimationFrame(loop);
  const dt=last ? Math.min(.05,(time-last)/1000) : .016; last=time;
  toastPump(time);
  if(!S) return;
  const drive=iDrive(), run=S.ph==='run';
  if(S.ph!=='over') initThree();
  if(run && (drive || MODE==='local')) driveTrain(dt);
  if(MODE==='host' || MODE==='local'){ hostTick(dt); if(MODE==='host') pushState(); }
  if(MODE==='guest') sendGuest();
  if(drive && run && R3){ draw3(dt, time); engine(TR.v/VMAX); } else engine(-1);
  hudFrame(time);
}
requestAnimationFrame(loop);
lobby();
window.__mrc={ S:()=>S, TR, N:NODES, E:EDGES, W:WD, act:a=>doAct(a), IN, three:()=>R3, iDrive,
  exits:()=>{ const a=ahead(TR); return {node:a.node, dist:a.dist, ex:exitsAt(a.node,TR.e)}; },
  place:(from,to,dist)=>{ const j=EDGES.findIndex(e=>(e.a===from&&e.b===to)||(e.a===to&&e.b===from)), e=EDGES[j], d=e.b===to?1:-1;
    Object.assign(TR,{e:j, d, s:d>0?e.len-dist:dist, v:0, sel:null, stopAt:null}); LOCAL.snap=true; if(MODE!=='guest') S.tr=trSnap(); return j; },
  screenOf:id=>{ const svg=$('#map'), p=svg.createSVGPoint(); p.x=MX(NODES[id].x); p.y=MY(NODES[id].z); const q=p.matrixTransform(svg.getScreenCTM()); return {x:q.x, y:q.y}; } };
})();
