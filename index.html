<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Galaxy Rail Crew</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Zen+Maru+Gothic:wght@700;900&display=swap">
<style>
/* 銀河鉄道 Galaxy Rail Crew v3 — the Driver flies the train through a dark nebula in 3D (thrust, drift, brake; gate signs in kana);
   the Navigator has the only radar and the passengers' tickets (kana), and sets the course. */
:root{ --ink:#2A211B; --paper:#FFF8EE; --night:#0B0F2C; --amber:#FFB23E; --red:#E04A3C; --green:#7EE08A; --dim:#A9B3E0; --brass:#C9A14A; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--night);color:var(--paper);font-family:Nunito,"Zen Maru Gothic",system-ui,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation}
[hidden]{display:none!important}
#three{position:fixed;inset:0}
#three canvas{display:block;width:100%;height:100%}
.hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.top{position:absolute;z-index:6;left:0;right:0;top:0;display:flex;gap:8px;align-items:flex-start;padding:calc(env(safe-area-inset-top) + 8px) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.meters{display:flex;flex-direction:column;gap:5px;flex:1;max-width:min(260px,calc(50vw - 170px))}
.meter{display:flex;align-items:center;gap:6px;font:900 11px Nunito,sans-serif;letter-spacing:.06em}
.meter span{width:44px;flex:none}
.bar{flex:1;height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid var(--ink);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);transform-origin:0 50%;transition:transform .2s}
.bar.low i{background:var(--red)}
.trip{position:relative;flex:1;height:12px;border-radius:999px;background:rgba(0,0,0,.45);border:2px solid var(--ink)}
.trip b{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:4px;background:var(--amber);border:2px solid var(--ink)}
.trip em{position:absolute;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;border-radius:50%;background:var(--ink);border:2px solid var(--dim)}
.trip em.ok{background:var(--green)}
.side{display:flex;flex-direction:column;align-items:flex-end;gap:6px;margin-left:auto;pointer-events:auto}
.badge{font:900 12px Nunito,sans-serif;background:rgba(14,18,48,.85);border:2px solid var(--ink);border-radius:999px;padding:4px 10px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.badge img{width:26px;height:26px;object-fit:contain;margin:-4px 0}
.badge.test{background:#3A1E19;border:2px dashed var(--amber);color:#FFDDB0}
.switch{font:900 13px Nunito,sans-serif;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:12px;box-shadow:0 3px 0 var(--ink);padding:6px 10px;cursor:pointer}
/* driver cockpit */
.cockpit{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 62% at 50% 46%,rgba(0,0,0,0) 62%,rgba(20,8,6,.55) 82%,rgba(20,8,6,.92));transition:box-shadow .2s}
.cockpit.thr{box-shadow:inset 0 0 60px rgba(126,200,255,.45)}
.cockpit .strut{position:absolute;bottom:0;width:22%;height:16%;background:linear-gradient(#5A1E1A,#2A0F0D);border-top:4px solid var(--brass)}
.cockpit .strut.l{left:0;border-top-right-radius:40px}.cockpit .strut.r{right:0;border-top-left-radius:40px}
.cross{position:absolute;left:50%;top:46%;width:34px;height:34px;margin:-17px 0 0 -17px;border:3px solid rgba(255,248,238,.6);border-radius:50%}
.cross::after{content:"";position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:var(--amber)}
.mark{position:absolute;left:0;top:0;width:58px;height:58px;margin:-29px 0 0 -29px;border:4px solid var(--amber);border-radius:50%;box-shadow:0 0 14px rgba(255,178,62,.9);will-change:transform}
.mark i{position:absolute;left:50%;top:50%;width:0;height:0;margin:-9px 0 0 -9px;border:9px solid transparent;border-bottom:16px solid var(--amber);display:none;transform-origin:9px 9px}
.mark.edge{border-style:dashed}.mark.edge i{display:block}
.mark b{position:absolute;top:100%;left:50%;transform:translateX(-50%);margin-top:4px;font:900 13px Nunito,sans-serif;color:var(--amber);white-space:nowrap;text-shadow:0 1px 3px #000}
.pro{position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border:3px solid #7EE0FF;border-radius:50%;will-change:transform}
.pro::after{content:"";position:absolute;left:50%;top:-9px;width:3px;height:7px;margin-left:-1.5px;background:#7EE0FF}
.dash{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 8px);transform:translateX(-50%);display:flex;gap:7px;align-items:center;background:rgba(14,18,48,.85);border:3px solid var(--ink);border-radius:16px;padding:3px 12px;font:900 12px Nunito,sans-serif;white-space:nowrap}
.dash b{font-size:20px;color:var(--amber);font-variant-numeric:tabular-nums;min-width:26px;text-align:right}
.dash span.f{font-size:20px}
.pad,.thr{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 12px);height:176px;pointer-events:auto}
.pad{left:max(14px,env(safe-area-inset-left));width:176px}
.thr{right:max(14px,env(safe-area-inset-right));width:204px}
.pad button,.thr button{position:absolute;border:4px solid var(--ink);border-radius:18px;background:var(--paper);color:var(--ink);font:900 24px Nunito,sans-serif;box-shadow:0 5px 0 var(--ink);touch-action:none;cursor:pointer;padding:0}
.pad button{width:60px;height:60px}
.pad [data-k=u]{left:58px;top:0}.pad [data-k=d]{left:58px;bottom:0}.pad [data-k=l]{left:0;top:58px}.pad [data-k=r]{right:0;top:58px}
.thr [data-k=thrust]{right:0;bottom:0;width:124px;height:124px;border-radius:50%;background:var(--amber);font-size:17px}
.thr [data-k=brake]{left:0;bottom:8px;width:74px;height:74px;border-radius:50%;background:#FF8A7E;font-size:13px}
.pad button.held,.thr button.held{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);filter:brightness(1.12)}
/* navigator console */
.nav{position:absolute;inset:0;z-index:1;pointer-events:auto;background:radial-gradient(90% 80% at 50% 55%,#5A1E1A,#2A0F0D 75%)}
.console{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 50px);bottom:calc(env(safe-area-inset-bottom) + 38px);display:flex;gap:12px;align-items:center;justify-content:center;padding:0 max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
.radarWrap{flex:none;width:min(44vw,calc(100vh - 100px));height:min(44vw,calc(100vh - 100px));border-radius:50%;border:8px solid var(--brass);box-shadow:0 0 0 4px var(--ink),0 8px 0 4px rgba(0,0,0,.4);background:#06140F;overflow:hidden}
#radar{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.tickets{flex:1;max-width:30%;align-self:stretch;display:flex;flex-direction:column;gap:6px;overflow:hidden}
.tickets h4{margin:0;font:900 12px Nunito,sans-serif;letter-spacing:.12em;color:#FFDDB0}
.tk{display:flex;align-items:center;gap:6px;background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:14px;padding:4px 6px;box-shadow:0 3px 0 var(--ink);position:relative;overflow:hidden;flex:none}
.tk .fc{font-size:22px}
.tk b{font:900 22px "Zen Maru Gothic",sans-serif;flex:1;line-height:1.05}
.tk small{display:block;font:800 11px Nunito,sans-serif;color:#2E7D4F}
.tk button{border:2px solid var(--ink);border-radius:9px;background:#E2E6FA;font:900 12px Nunito,sans-serif;width:28px;height:28px;padding:0;cursor:pointer;color:var(--ink)}
.tk .t{position:absolute;left:0;bottom:0;width:100%;height:4px;background:var(--red);transform-origin:0 50%}
.tk.new{animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.navSide{flex:1;max-width:22%;display:flex;flex-direction:column;gap:8px;align-self:flex-end}
.panel{background:#1A0B09;border:3px solid var(--brass);border-radius:14px;padding:5px 8px;font:900 11px Nunito,sans-serif;letter-spacing:.08em;color:#FFDDB0;text-align:center}
.panel b{display:block;font-size:30px;line-height:1.15;letter-spacing:0;color:var(--paper);font-variant-numeric:tabular-nums}
.panel.warn{border-color:var(--red);background:#4A0F0A;color:#FFB4AA;animation:blink .5s steps(2) infinite}
@keyframes blink{50%{border-color:#FFDDB0}}
.navTip{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 8px);transform:translateX(-50%);font:900 12px Nunito,sans-serif;background:rgba(26,11,9,.9);border:2px solid var(--brass);border-radius:999px;padding:4px 12px;white-space:nowrap;color:#FFDDB0}
@keyframes pop{from{transform:scale(.6);opacity:0}}
/* shared */
.waveCard{position:absolute;z-index:7;left:50%;top:46%;transform:translate(-50%,-50%);width:min(520px,62vw);background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:22px;box-shadow:0 6px 0 var(--ink);padding:10px 14px 12px;text-align:center;pointer-events:auto;animation:pop .35s cubic-bezier(.2,1.5,.4,1)}
.waveCard h3{margin:0;font:900 22px "Zen Maru Gothic",Nunito,sans-serif}.waveCard h3 small{font:900 12px Nunito,sans-serif;letter-spacing:.1em;color:#6B5E54;display:block}
.waveCard p{margin:8px 0 0;font:800 13px/1.35 Nunito,sans-serif;color:#4A3F37}
.waveCard .bar2{height:6px;border-radius:9px;background:#E6DCCB;margin-top:8px;overflow:hidden}.waveCard .bar2 i{display:block;height:100%;background:var(--amber);transform-origin:0 50%}
.words{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:7px;margin-top:8px}
.word{border:3px solid var(--ink);border-radius:14px;background:#fff;box-shadow:0 3px 0 var(--ink);padding:6px 2px 4px;cursor:pointer;font:inherit;color:var(--ink);display:flex;flex-direction:column;align-items:center}
.word b{font:900 22px "Zen Maru Gothic",sans-serif}.word small{font:800 11px Nunito,sans-serif;color:#6B5E54}
.rest{position:absolute;z-index:7;left:50%;top:calc(env(safe-area-inset-top) + 50px);transform:translateX(-50%);font:900 15px Nunito,"Zen Maru Gothic",sans-serif;background:#C9F2D1;color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 14px;box-shadow:0 3px 0 var(--ink);white-space:nowrap}
.toast{position:absolute;z-index:8;left:50%;top:30%;transform:translate(-50%,-50%);font:900 22px Nunito,"Zen Maru Gothic",sans-serif;padding:6px 14px;border-radius:14px;border:3px solid var(--ink);background:var(--paper);color:var(--ink);box-shadow:0 4px 0 var(--ink);opacity:0;white-space:nowrap}
.toast.ok{background:var(--green)}.toast.bad{background:#FF8A7E}.toast.go{background:var(--amber)}
.card{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;padding:14px;background:rgba(8,10,30,.8)}
.in{background:var(--paper);color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);padding:14px 18px;width:min(640px,100%);max-height:100%;overflow:auto;text-align:center}
.in .key{width:100%;max-height:34vh;object-fit:cover;border-radius:14px;border:3px solid var(--ink)}
.in h1{margin:6px 0 0;font:900 28px/1.1 "Zen Maru Gothic",sans-serif}
.in h1 small,.in h2 small{display:block;font:900 12px Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#6B5E54;margin-top:4px}
.in h2{margin:0;font:900 24px/1.15 "Zen Maru Gothic",sans-serif}
.in p{margin:8px 0 0;font:700 14px/1.4 Nunito,sans-serif;color:#4A3F37}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px;text-align:left}
.roles div{display:flex;gap:8px;align-items:center;background:#F3E9DA;border-radius:14px;padding:6px 8px;font:800 13px/1.3 Nunito,sans-serif}
.roles img{width:64px;height:64px;object-fit:contain;flex:none}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.btn{font:900 17px Nunito,sans-serif;color:var(--ink);background:var(--amber);border:4px solid var(--ink);border-radius:999px;padding:11px 22px;box-shadow:0 5px 0 var(--ink);cursor:pointer}
.btn.alt{background:var(--paper)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.code{font:900 44px Nunito,sans-serif;letter-spacing:.2em;background:var(--night);color:var(--amber);border:4px solid var(--ink);border-radius:16px;padding:4px 16px;display:inline-block;margin-top:8px}
input.codein{font:900 22px Nunito,sans-serif;letter-spacing:.2em;text-transform:uppercase;width:120px;text-align:center;border:3px solid var(--ink);border-radius:12px;padding:8px}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.res span{background:#F3E9DA;border-radius:12px;padding:7px 2px;font:800 11px Nunito,sans-serif;color:#6B5E54;display:flex;flex-direction:column}
.res b{font:900 20px Nunito,sans-serif;color:var(--ink)}
.small{font:800 12px Nunito,sans-serif;color:#6B5E54}
.rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--night);font:900 20px Nunito,sans-serif;text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){ .rotate{display:flex} }
</style>
</head>
<body>
<div id="three"></div>
<div class="hud" id="hud" hidden>
  <div class="top">
    <div class="meters">
      <div class="meter"><span>TRAIN</span><div class="bar" id="hpBar"><i></i></div></div>
      <div class="meter"><span>WAVE</span><div class="trip" id="trip"></div></div>
    </div>
    <div class="side"><span class="badge" id="role"></span><span class="badge test" id="testBadge" hidden>LOCAL TEST · not online</span><button class="switch" id="switchBtn" hidden>Switch view</button></div>
  </div>
  <div id="driverUI" hidden>
    <div class="cockpit" id="cockpit"><div class="strut l"></div><div class="strut r"></div><div class="cross"></div></div>
    <div class="pro" id="pro" hidden></div>
    <div class="mark" id="mark" hidden><i></i><b></b></div>
    <div class="dash" id="dash"></div>
    <div class="pad"><button data-k="u" aria-label="Nose up">▲</button><button data-k="l" aria-label="Turn left">◀</button><button data-k="r" aria-label="Turn right">▶</button><button data-k="d" aria-label="Nose down">▼</button></div>
    <div class="thr"><button data-k="brake">BRAKE</button><button data-k="thrust">THRUST</button></div>
  </div>
  <div class="nav" id="navUI" hidden>
    <div class="console">
      <div class="tickets" id="tickets"></div>
      <div class="radarWrap"><canvas id="radar" aria-label="Radar: tap a place to set the course"></canvas></div>
      <div class="navSide"><div class="panel" id="pCourse">COURSE<b>—</b></div><div class="panel" id="pDist">DISTANCE<b>—</b></div><div class="panel" id="pSpeed">SPEED<b>0</b></div><div class="panel warn" id="pWarn" hidden>⚠ WARN YOUR DRIVER<b>☄</b></div></div>
    </div>
    <div class="navTip">Read a ticket · tap its picture on the radar to set the course · up on the radar = where the train points</div>
  </div>
  <div class="waveCard" id="waveCard" hidden></div>
  <div class="rest" id="restBanner" hidden></div>
  <div class="toast" id="toast"></div>
</div>
<div class="card" id="card"></div>
<div class="rotate"><div style="font-size:46px">📱↻</div>Turn your phone sideways to play</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ART='art/web/';

// ---------- places: the driver sees only the kana sign, the navigator only the picture ----------
const W={ umi:{k:'うみ',ro:'umi',m:'sea'}, yama:{k:'やま',ro:'yama',m:'mountain'}, tsuki:{k:'つき',ro:'tsuki',m:'moon'}, kitsune:{k:'きつね',ro:'kitsune',m:'fox'},
  jinja:{k:'じんじゃ',ro:'jinja',m:'shrine'}, sakura:{k:'さくら',ro:'sakura',m:'cherry blossom'}, kumo:{k:'くも',ro:'kumo',m:'cloud'}, dango:{k:'だんご',ro:'dango',m:'dango (sweet)'},
  home:{k:'えき',ro:'eki',m:'station'} };
// x/z = the radar plane, y = height in space
const P={ home:{x:0,y:0,z:380,ic:'🚉'}, umi:{x:-480,y:40,z:250,ic:'🌊'}, yama:{x:500,y:-30,z:250,ic:'🗻'}, tsuki:{x:-680,y:90,z:-140,ic:'🌙'}, kitsune:{x:-150,y:-40,z:0,ic:'🦊'},
  jinja:{x:250,y:30,z:-50,ic:'⛩️'}, sakura:{x:690,y:70,z:-150,ic:'🌸'}, kumo:{x:-340,y:110,z:-430,ic:'☁️'}, dango:{x:380,y:-60,z:-430,ic:'🍡'} };
const FACES=['🐼','🐸','🐰','🐻','🐱','🐵','🐨','🐯'];
const WAVES=[
  {name:'First stops', words:['umi','yama'], tip:'Navigator: read the ticket, then tap its picture on your radar to set the course. Driver: follow the gold ring. THRUST to go, BRAKE to stop. You drift like a real rocket!'},
  {name:'Moon & fox', words:['tsuki','kitsune'], tip:'Two new places. Driver: the gate signs are in kana, so check you\'re at the right one!'},
  {name:'Explore', words:['jinja','sakura'], tip:'More places out in the nebula. You swap jobs after this wave!'},
  {name:'Clouds & sweets', words:['kumo','dango'], tip:'Now you know all 8 places. Passengers get less patient…'},
  {name:'Meteors!', words:[], tip:'Meteors and yokai drift through the nebula. Only the radar can see them coming. Navigator: warn your driver!'},
  {name:'Last stretch', words:[], tip:'Everything at once. Deliver everyone before the trip ends!'}];
const T_INTRO=9, T_PLAY=45, T_REST=12;
const GATE_R=30, RADAR_RANGE=700;

// ---------- audio ----------
let AC=null, jaVoice=null, hum=null;
function audio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==='suspended') AC.resume(); }catch(e){}
  try{ if(!audio.warm){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='ja-JP'; speechSynthesis.speak(u); audio.warm=1; } }catch(e){} }
function tone(f,at,d,type,v,f2){ if(!AC) return; const t=AC.currentTime+(at||0), o=AC.createOscillator(), g=AC.createGain(); o.type=type||'sine'; o.frequency.setValueAtTime(f,t); if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v||.15,t+.01); g.gain.exponentialRampToValueAtTime(.0001,t+d); o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+.02); }
const SND={ ok(){ tone(784,0,.12,'triangle',.2); tone(1175,.08,.18,'triangle',.16); }, bad(){ tone(140,0,.3,'square',.12); tone(95,.05,.3,'sawtooth',.08); },
  gate(){ tone(988,0,.1,'sine',.12); tone(1319,.07,.2,'sine',.1); }, fanfare(){ [523,659,784,1047].forEach((f,k)=>tone(f,k*.08,.4,'triangle',.16)); },
  board(){ tone(988,0,.08,'square',.06); tone(1319,.08,.12,'square',.06); }, whistle(){ tone(880,0,.5,'sine',.14); tone(1108,0,.5,'sine',.1); },
  relax(){ tone(523,0,.6,'sine',.08); tone(659,.15,.7,'sine',.07); tone(784,.3,.9,'sine',.06); }, swap(){ tone(660,0,.2,'triangle',.12); tone(880,.2,.3,'triangle',.12); },
  lock(){ tone(1320,0,.06,'square',.07); tone(1760,.06,.1,'square',.07); }, warn(){ tone(620,0,.12,'square',.07); tone(620,.18,.12,'square',.07); } };
let humK=-1;
function engine(on, thrust){ try{ if(!AC) return; const k=on?(thrust?2:1):0; if(k===humK) return; humK=k;
  if(on && !hum){ const o=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o.type='sawtooth'; o.frequency.value=60; f.type='lowpass'; f.frequency.value=220; g.gain.value=.0001; o.connect(f); f.connect(g); g.connect(AC.destination); o.start(); hum={o,f,g}; }
  if(hum){ const t=AC.currentTime; hum.g.gain.setTargetAtTime(on ? (thrust?.07:.03) : .0001, t, .12); hum.o.frequency.setTargetAtTime(thrust?110:60, t, .25); hum.f.frequency.setTargetAtTime(thrust?700:220, t, .2); } }catch(e){} }
function getVoice(){ if(!jaVoice){ try{ jaVoice=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null; }catch(e){} } return jaVoice; }
function say(word){ try{ const u=new SpeechSynthesisUtterance(W[word].k); u.lang='ja-JP'; u.rate=.85; const v=getVoice(); if(v) u.voice=v;

const SHIP={x:0,y:0,z:460,yaw:0,pitch:0,roll:0,vx:0,vy:0,vz:0,spd:0,thrust:false,stamp:''};

// ---------- the Director: teaching waves with breathers ----------
function director(dt){
  const R=S.dir||(S.dir={w:0, ph:'intro', t:0, rate:0});
  R.t+=dt; const last=R.w===WAVES.length-1;
  if(R.ph==='intro' && R.t>T_INTRO){ R.ph='play'; R.t=0; ev('wave','Wave '+(R.w+1)+' · GO!'); }
  else if(R.ph==='play' && R.t>T_PLAY){ if(last){ if(!S.arriveT){ S.arriveT=S.t; ev('ok','到着! End of the line'); } } else { R.ph='rest'; R.t=0; ev('relax','ひと休み · Breather'); } }
  else if(R.ph==='rest' && R.t>T_REST){ R.w++; R.ph='intro'; R.t=0;
    if(R.w===3){ const r=S.roles; [r.driver, r.nav]=[r.nav, r.driver]; ev('swap','役割交代! Swap jobs'); } }
  const busy=active('ride').length/3; R.rate = R.ph==='play' ? Math.max(0, Math.min(1, .35+.1*R.w+.35*R.t/T_PLAY) - .3*busy) : 0;
  return R;
}

// ---------- host simulation ----------
function board(f){
  const cap=Math.min(3, 1+Math.floor(((S.dir?S.dir.w:0)+1)/2)); if(S.pax.length>=cap) return;
  const dests=unlocked().filter(d=>!S.pax.some(p=>p.dest===d)); if(!dests.length) return;
  const dest=pick(dests); S.pid++; S.pax.push({id:S.pid, dest, face:pick(FACES)});
  S.oid++; S.orders.push({id:S.oid, kind:'ride', word:dest, target:S.pid, life:100-30*f, until:S.t+100-30*f, done:0, hint:0}); ev('board','');
}
function hostTick(dt){
  if(!S) return;
  if(S.ph==='ready'){ if(S.ready.h && S.ready.g){ S.ph='run'; ev('go','出発! Depart'); } return; }
  if(S.ph!=='run') return;
  S.t+=dt;
  if(S.arriveT){ if(S.t-S.arriveT>2.2) S.ph='over'; return; }
  const R=director(dt), f=R.rate, play=R.ph==='play';
  // passengers: never none while playing, more as the waves go on
  if(play && f>0 && !S.pax.length) board(f);
  if(play && f>0 && S.t>=S.nextB){ board(f); S.nextB=S.t+24-10*f; }
  for(const o of S.orders) if(!o.done && o.life && S.t>o.until){ finish(o,false); S.stats.missed++; S.hp-=12; S.pax=S.pax.filter(p=>p.id!==o.target); ev('bad','A passenger gave up: '+W[o.word].k); }
  // hazards (waves 5–6): meteors and yokai drifting into the ship's path; only the radar sees them from far away
  if(R.w>=4 && play && f>0 && S.t>=S.nextH && S.hz.length<9){
    const s=S.ship, fx=-Math.sin(s.yaw)*Math.cos(s.pitch), fy=Math.sin(s.pitch), fz=-Math.cos(s.yaw)*Math.cos(s.pitch), d=220+Math.random()*140, side=(Math.random()-.5)*120, up=(Math.random()-.5)*50;
    S.hid++; S.hz.push({id:S.hid, type:Math.random()<.6?'meteor':pick(['obake','kappa','tanuki']), x:+(s.x+fx*d+Math.cos(s.yaw)*side).toFixed(1), y:+(s.y+fy*d+up).toFixed(1), z:+(s.z+fz*d-Math.sin(s.yaw)*side).toFixed(1),
      vx:(Math.random()-.5)*14, vy:(Math.random()-.5)*6, vz:(Math.random()-.5)*14, t:0});
    S.nextH=S.t+2.5+4*(1-f); }
  S.hz.forEach(h=>{ h.x+=h.vx*dt; h.y+=h.vy*dt; h.z+=h.vz*dt; h.t+=dt; }); S.hz=S.hz.filter(h=>h.t<30);
  if(S.hp<=0){ S.hp=40; ev('bad','Breakdown! Patching up…'); }
  S.hp=Math.max(0,Math.min(100,S.hp));
}
function hostAct(who, a){
  if(!S || S.ph!=='run' || S.arriveT) return;
  const driver = MODE==='local' || S.roles.driver===who, nav = MODE==='local' || S.roles.nav===who;
  if(a.k==='hint'){ const o=S.orders.find(o=>o.id===a.id); if(o && !o.hint){ o.hint=1; S.stats.hints++; } return; }
  if(a.k==='course' && nav && P[a.id]){ if(S.course!==a.id){ S.course=a.id; ev('course',''); } return; }
  if(a.k==='gate' && driver && P[a.id] && dist3(S.ship,P[a.id])<GATE_R*3){
    const off=S.pax.filter(p=>p.dest===a.id);
    if(off.length){ S.pax=S.pax.filter(p=>p.dest!==a.id); off.forEach(p=>{ const o=S.orders.find(o=>o.kind==='ride' && o.target===p.id && !o.done); if(o) finish(o,true); S.stats.del++; }); ev('del','ありがとう! '+W[a.id].k); }
    else if(S.pax.length && a.id!=='home'){ S.stats.wrong++; ev('wrong','Nobody gets off at '+W[a.id].k+'!'); }
    else ev('gate',''); return; }
  if(a.k==='hit' && driver){ const h=S.hz.find(h=>h.id===a.id); if(h){ S.hz=S.hz.filter(x=>x!==h); S.hp-=h.type==='meteor'?10:6; S.stats.hits++; ev('bad', h.type==='meteor'?'Meteor hit! ☄':'Bumped a yokai! 👻'); } }
}
function hostIn(who, m){
  if(!S || !m) return;
  if(m.ready && S.ph==='ready') S.ready[who]=true;
  if(m.ship && S.roles.driver===who) S.ship=m.ship;
  (m.acts||[]).forEach(a=>{ if(a.n>LOCAL.seen[who]){ LOCAL.seen[who]=a.n; hostAct(who, a); } });
}
function doAct(a){ if(MODE==='guest'){ LOCAL.actN++; LOCAL.acts.push({...a, n:LOCAL.actN}); if(LOCAL.acts.length>12) LOCAL.acts.shift(); sendGuest(true); } else hostAct(ME, a); }
const iDrive=()=>!!S && (MODE==='local' ? LOCAL.view==='driver' : S.roles.driver===ME);

// ---------- networking: claude.ai room inside claude.ai, PeerJS anywhere else ----------
async function roomApi(){ try{ return window.claude && claude.use ? await claude.use('room') : null; }catch(e){ return null; } }
async function netHost(code){
  const R=await roomApi();
  if(R){ const room=await R.join('grc-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room};
    room.presence({role:'host'}); room.onPeers(ch=>{ const gp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='guest'); guestHere=!!gp; if(gp && gp.presence.inp) hostIn('g', gp.presence.inp); });
    NET.send=st=>room.presence({role:'host', st}).catch(()=>{}); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer('kotoba-grc-'+code.toLowerCase(), {debug:0}); NET={kind:'online (PeerJS)', code, peer};
    peer.on('open', ()=>res(true)); peer.on('error', e=>res(e.type==='unavailable-id' ? 'taken' : 'Could not open a room: '+e.type));
    peer.on('connection', c=>{ NET.conn=c; c.on('open', ()=>{ guestHere=true; }); c.on('data', m=>m && m.inp && hostIn('g', m.inp)); c.on('close', ()=>{ guestHere=false; toast('Your friend left','bad'); }); });
    NET.send=st=>{ if(NET.conn && NET.conn.open) NET.conn.send({st}); }; });
}
async function netJoin(code){
  const R=await roomApi();
  if(R){ const room=await R.join('grc-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room}; room.presence({role:'guest', inp:{}});
    room.onPeers(ch=>{ const hp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='host'); if(hp && hp.presence.st) onHostState(hp.presence.st); });
    NET.send=inp=>room.presence({role:'guest', inp}).catch(()=>{}); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer({debug:0}); NET={kind:'online (PeerJS)', code, peer}; let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; res('No room with that code (or the connection is blocked).'); } }, 12000);
    peer.on('error', e=>{ if(!done){ done=true; clearTimeout(t); res(e.type==='peer-unavailable' ? 'No room with that code.' : 'Connection problem: '+e.type); } });
    peer.on('open', ()=>{ const c=peer.connect('kotoba-grc-'+code.toLowerCase(), {reliable:true}); NET.conn=c;
      c.on('open', ()=>{ if(!done){ done=true; clearTimeout(t); res(true); } }); c.on('data', m=>m && m.st && onHostState(m.st)); c.on('close', ()=>toast('The host left','bad')); });
    NET.send=inp=>{ if(NET.conn && NET.conn.open) NET.conn.send({inp}); }; });
}
let lastSend=0, lastPush=0;
function sendGuest(now){ const t=performance.now(); if(!now && t-lastSend<(NET.room?160:70)) return; lastSend=t;
  NET.send({acts:LOCAL.acts.slice(), ready:LOCAL.ready, ship: S && S.roles.driver==='g' ? shipSnap() : null}); }
function pushState(){ const t=performance.now(); if(t-lastPush<(NET.room?160:80)) return; lastPush=t; NET.send(S); }
function onHostState(st){ const fresh=!S || S.gid!==st.gid; S=st; if(fresh) newRun(); }

// ---------- the driver's rocket (simulated on the driving phone, so the buttons never wait for the network) ----------
// Turning only turns the nose; THRUST pushes along it; with nothing pressed the train keeps drifting. BRAKE kills the drift.
const IN={btn:{}, keys:{}};
let gateCool={}, hitSent={};
function flyShip(dt){
  const stamp=S.gid+':'+(MODE==='local'?'L':S.roles.driver); if(SHIP.stamp!==stamp){ Object.assign(SHIP, {vx:0,vy:0,vz:0}, S.ship, {roll:0, stamp}); }
  const B=IN.btn, k=IN.keys;
  const L=B.l||k.arrowleft||k.a, Rt=B.r||k.arrowright||k.d, U=B.u||k.arrowup, Dn=B.d||k.arrowdown, TH=B.thrust||k.w||k[' '], BR=B.brake||k.s||k.shift;
  const turn=(L?1:0)-(Rt?1:0);
  SHIP.yaw += turn*1.5*dt; SHIP.pitch = clamp(SHIP.pitch + ((U?1:0)-(Dn?1:0))*1.0*dt, -.8, .8);
  SHIP.roll += (turn*.35-SHIP.roll)*Math.min(1,dt*5);
  const fx=-Math.sin(SHIP.yaw)*Math.cos(SHIP.pitch), fy=Math.sin(SHIP.pitch), fz=-Math.cos(SHIP.yaw)*Math.cos(SHIP.pitch);
  SHIP.thrust = !!TH && !S.arriveT;
  if(SHIP.thrust){ SHIP.vx+=fx*60*dt; SHIP.vy+=fy*60*dt; SHIP.vz+=fz*60*dt; }
  const keep=Math.max(0, 1-(BR||S.arriveT ? 2.4 : .12)*dt); SHIP.vx*=keep; SHIP.vy*=keep; SHIP.vz*=keep;
  let sp=Math.hypot(SHIP.vx,SHIP.vy,SHIP.vz); if(sp>95){ const m=95/sp; SHIP.vx*=m; SHIP.vy*=m; SHIP.vz*=m; sp=95; } SHIP.spd=sp;
  SHIP.x+=SHIP.vx*dt; SHIP.y+=SHIP.vy*dt; SHIP.z+=SHIP.vz*dt;
  // the edge of the nebula pushes you back gently
  const r=Math.hypot(SHIP.x,SHIP.z); if(r>1050){ SHIP.vx-=SHIP.x/r*45*dt; SHIP.vz-=SHIP.z/r*45*dt; }
  if(Math.abs(SHIP.y)>260){ SHIP.y=clamp(SHIP.y,-260,260); SHIP.vy=0; }
  if(MODE!=='guest') S.ship=shipSnap();
  // gates and hazards are checked here, on the driving phone, then confirmed by the host
  const now=performance.now();
  for(const id in P){ if(dist3(SHIP,P[id])<GATE_R && !(gateCool[id]>now)){ gateCool[id]=now+3000; SND.gate(); FX.flash=.35; doAct({k:'gate', id}); } }
  for(const h of S.hz||[]){ if(!hitSent[h.id] && dist3(SHIP,h)<15){ hitSent[h.id]=1; FX.shake=.5; doAct({k:'hit', id:h.id}); } }
}

// ---------- 3D: a dark nebula, gates with kana signs, hazards ----------
const FX={shake:0, flash:0};
const BG=[.09,.06,.2];

  const scene=new T.Scene(); scene.background=new T.Color().setRGB(...BG); scene.fog=new T.Fog(scene.background.getHex(), 60, 330);

  gr.addColorStop(0,'rgba(255,255,255,.85)'); gr.addColorStop(.5,'rgba(255,255,255,.3)'); gr.addColorStop(1,'rgba(255,255,255,0)'); g2.fillStyle=gr; g2.fillRect(0,0,128,128);
  const puff=new T.CanvasTexture(pc), cols=[0xFF7EB6,0x7EC8FF,0xB88CFF,0x7EF0C8,0xFFB97E];

    s.position.set(Math.cos(a)*r,(Math.random()-.5)*360,Math.sin(a)*r); const sc=70+Math.random()*190; s.scale.set(sc,sc,1); scene.add(s); }
  // close dust that streaks past, so speed and drift are felt
  const dn=500, dpos=new Float32Array(dn*3); for(let i=0;i<dn*3;i++) dpos[i]=(Math.random()-.5)*400;
  const dg=new T.BufferGeometry(); dg.setAttribute('position', new T.BufferAttribute(dpos,3)); const dust=new T.Points(dg, new T.PointsMaterial({color:0xBFD2FF, size:1.4, sizeAttenuation:true, transparent:true, opacity:.8})); scene.add(dust);
  const loader=new T.TextureLoader(), sprite=(file, sc)=>{ const s=new T.Sprite(new T.SpriteMaterial({map:loader.load(ART+file), fog:false, transparent:true, opacity:.8})); s.scale.set(sc,sc,1); return s; };

    const glow=new T.Mesh(new T.TorusGeometry(GATE_R-7, .9, 6, 40), new T.MeshBasicMaterial({color:0xFFF3C4, transparent:true, opacity:.7})); g.add(glow);

// put a HUD element where a 3D point is on screen; off screen it sticks to the edge (returns the edge angle or null)
function pin(el, x, y, z, edge){
  const {cam, V}=R3; V.set(x,y,z).project(cam); let nx=V.x, ny=V.y; const behind=V.z>1;
  if(behind){ nx=-nx; ny=-ny; if(Math.hypot(nx,ny)<.15) ny=-1; }
  const on=!behind && Math.abs(nx)<.9 && Math.abs(ny)<.85;
  if(!on && !edge){ el.hidden=true; return null; }
  if(!on){ const m=Math.max(Math.abs(nx)/.58, ny>0 ? ny/.62 : -ny/.3); nx/=m; ny/=m; } // stay clear of the buttons
  const w2=innerWidth/2, h2=innerHeight/2, px=w2+nx*w2, py=h2-ny*h2; el.hidden=false; el.style.transform=`translate(${px.toFixed(1)}px,${py.toFixed(1)}px)`;

  const fov = 70 + SHIP.spd*.12 + (SHIP.thrust?4:0); if(Math.abs(cam.fov-fov)>.2){ cam.fov+=(fov-cam.fov)*Math.min(1,dt*4); cam.updateProjectionMatrix(); }
  // the dust box follows the ship in 400-unit cells, so it always surrounds you
  dust.position.set(Math.round(SHIP.x/400)*400, Math.round(SHIP.y/400)*400, Math.round(SHIP.z/400)*400);
  for(const id in gates){ gates[id].ring.rotation.z = time/900; }
  const live={}; (S.hz||[]).forEach(h=>{ live[h.id]=1; let s=R3.hz[h.id]; if(!s){ s=R3.hz[h.id]=new THREE.Sprite(new THREE.SpriteMaterial({map:hzTex[h.type], transparent:true})); s.scale.set(26,26,1); scene.add(s); } s.position.set(h.x,h.y,h.z); });

    const d=Math.round(dist3(SHIP,p)/5)*5+'m'; if(mk.lastElementChild.textContent!==d) mk.lastElementChild.textContent=d; } else mk.hidden=true;
  // where you are really drifting (a rocket goes where its speed points, not where its nose points)
  const pro=$('#pro'); if(SHIP.spd>4) pin(pro, SHIP.x+SHIP.vx*4, SHIP.y+6+SHIP.vy*4, SHIP.z+SHIP.vz*4, false); else pro.hidden=true;
  $('#cockpit').classList.toggle('thr', SHIP.thrust);
}

// ---------- the navigator's console: radar (heading-up) + tickets ----------
function radarFrame(){
  const cv=$('#radar'), rect=cv.getBoundingClientRect(); if(!rect.width) return;
  const px=Math.round(rect.width*Math.min(2,devicePixelRatio||1)); if(cv.width!==px){ cv.width=cv.height=px; }
  const c=cv.getContext('2d'), R=px/2, k=R*.9/RADAR_RANGE, s=S.ship, now=performance.now();
  const rx=Math.cos(s.yaw), rz=-Math.sin(s.yaw), fx=-Math.sin(s.yaw), fz=-Math.cos(s.yaw);
  const toR=(x,z)=>{ const dx=x-s.x, dz=z-s.z; let u=(dx*rx+dz*rz)*k, v=(dx*fx+dz*fz)*k; const d=Math.hypot(u,v), m=R*.86; let edge=false; if(d>m){ u*=m/d; v*=m/d; edge=true; } return [R+u, R-v, edge]; };
  c.clearRect(0,0,px,px);
  c.strokeStyle='rgba(126,224,138,.22)'; c.lineWidth=R*.012; for(let i=1;i<=3;i++){ c.beginPath(); c.arc(R,R,R*.3*i,0,6.283); c.stroke(); }
  c.beginPath(); c.moveTo(R,R*.08); c.lineTo(R,R*1.92); c.moveTo(R*.08,R); c.lineTo(R*1.92,R); c.stroke();
  const a=(now/1400)%6.283; c.fillStyle='rgba(126,224,138,.13)'; c.beginPath(); c.moveTo(R,R); c.arc(R,R,R,a-.6,a); c.closePath(); c.fill();
  // places as pictures; a small ▲/▼ says if it is above or below the train
  LOCAL.pts=[]; c.textAlign='center'; c.textBaseline='middle';
  for(const id in P){ const p=P[id], [x,y,edge]=toR(p.x,p.z), sz=R*(edge?.085:.11);
    c.globalAlpha=edge?.6:1; c.fillStyle='#FFF8EE'; c.strokeStyle='#2A211B'; c.lineWidth=R*.012; c.beginPath(); c.arc(x,y,sz*.95,0,6.283); c.fill(); c.stroke();
    c.font=`${Math.round(sz*1.15)}px serif`; c.fillStyle='#000'; c.fillText(p.ic, x, y+sz*.06);
    if(S.course===id){ c.strokeStyle='#FFB23E'; c.lineWidth=R*.025; c.beginPath(); c.arc(x,y,sz*1.35+Math.sin(now/180)*R*.01,0,6.283); c.stroke(); }
    const dy=p.y-s.y; if(Math.abs(dy)>35){ c.font=`900 ${Math.round(sz*.7)}px Nunito,sans-serif`; c.fillStyle=dy>0?'#7EE0FF':'#FFB4AA'; c.fillText(dy>0?'▲':'▼', x+sz*1.25, y-sz*.6); }
    c.globalAlpha=1; LOCAL.pts.push({id, x:x/px, y:y/px, r:sz*1.3/px}); }
  // hazards: red blips (only the radar sees them from far away)
  for(const h of S.hz||[]){ const [x,y,edge]=toR(h.x,h.z); if(edge) continue; c.fillStyle=h.type==='meteor'?'#FF6A4E':'#C9A7FF'; c.beginPath(); c.arc(x,y,R*.035,0,6.283); c.fill();
    c.font=`${Math.round(R*.07)}px serif`; c.fillText(h.type==='meteor'?'☄':'👻', x, y-R*.07); }
  // drift line (where the train is really going) and the train itself, always pointing up
  const vu=(s.vx||0)*rx+(s.vz||0)*rz, vv=(s.vx||0)*fx+(s.vz||0)*fz;
  if(Math.hypot(vu,vv)>3){ c.strokeStyle='#7EE0FF'; c.lineWidth=R*.018; c.setLineDash([R*.04,R*.03]); c.beginPath(); c.moveTo(R,R); c.lineTo(R+vu*k*4, R-vv*k*4); c.stroke(); c.setLineDash([]); }
  c.fillStyle='#FFB23E'; c.strokeStyle='#2A211B'; c.lineWidth=R*.014; c.beginPath(); c.moveTo(R,R-R*.075); c.lineTo(R+R*.05,R+R*.05); c.lineTo(R,R+R*.02); c.lineTo(R-R*.05,R+R*.05); c.closePath(); c.fill(); c.stroke();
}
function navFrame(){
  radarFrame();
  const s=S.ship, set=(id,v)=>{ const b=$(id+' b'); if(b.textContent!==v) b.textContent=v; };
  set('#pCourse', S.course ? P[S.course].ic : '—');
  set('#pDist', S.course ? Math.round(dist3(s, P[S.course])/5)*5+'m' : '—');
  set('#pSpeed', String(Math.round(Math.hypot(s.vx||0,s.vy||0,s.vz||0))));
  const near=(S.hz||[]).filter(h=>dist3(s,h)<170), wn=$('#pWarn');
  if(near.length){ if(wn.hidden){ wn.hidden=false; SND.warn(); } set('#pWarn', near.some(h=>h.type==='meteor')?'☄':'👻'); } else wn.hidden=true;
  // the tickets (only the navigator sees these); the first two times a word appears its meaning shows by itself
  const box=$('#tickets'), list=S.orders.filter(o=>o.kind==='ride' && (!o.done || S.t-(o.doneT||S.t)<1.2));
  list.forEach(o=>{ if(LOCAL.auto[o.id]==null){ const c=LOCAL.wc[o.word]||0; LOCAL.auto[o.id]=c<2; LOCAL.wc[o.word]=c+1; } });
  const tk=list.map(o=>o.id+':'+o.done+':'+(LOCAL.hinted[o.id]?1:0)).join('|');
  if(box.dataset.k!==tk){ box.dataset.k=tk;
    box.innerHTML=`<h4>🎫 TICKETS</h4>`+(list.length ? list.map(o=>{ const p=S.pax.find(p=>p.id===o.target)||{face:'🙂'}, show=LOCAL.hinted[o.id]||LOCAL.auto[o.id];
      return `<div class="tk ${LOCAL.seenTk[o.id]?'':'new'}" data-tk="${o.word}"><span class="fc">${o.done>0?'✅':o.done<0?'💢':p.face}</span><button data-say="${o.word}" aria-label="Hear it">🔊</button>
        <b>${W[o.word].k}${show?`<small>${W[o.word].ro} · ${W[o.word].m}</small>`:''}</b>${o.done?'':`<button data-hint="${o.id}" aria-label="Hint">?</button><span class="t" data-t="${o.id}"></span>`}</div>`; }).join('') : '<p class="small" style="color:#FFDDB0">No passengers right now</p>');
    list.forEach(o=>{ if(!LOCAL.seenTk[o.id]){ LOCAL.seenTk[o.id]=1; if(!o.done){ SND.board(); setTimeout(()=>say(o.word), 200); } } }); }
  box.querySelectorAll('[data-t]').forEach(el=>{ const o=S.orders.find(x=>x.id==el.dataset.t); if(o) el.style.transform=`scaleX(${Math.max(0,(o.until-S.t)/o.life).toFixed(3)})`; });
}

// ---------- HUD, cards ----------
function toast(txt, kind){ const t=$('#toast'); t.textContent=txt; t.className='toast '+(kind||''); try{ t.animate([{opacity:0,transform:'translate(-50%,-30%) scale(.7)'},{opacity:1,transform:'translate(-50%,-50%) scale(1.05)',offset:.15},{opacity:1,transform:'translate(-50%,-50%)',offset:.8},{opacity:0,transform:'translate(-50%,-70%)'}],{duration:1500}); }catch(e){} }
function card(html){ const c=$('#card'); c.innerHTML=`<div class="in">${html}</div>`; c.hidden=false; }
function lobby(msg){
  MODE=''; S=null; $('#hud').hidden=true;
  card(`<img class="key" src="${ART}key-art.webp" alt="The galaxy train with the shiba crew and yokai"><h1>銀河鉄道<small>Galaxy Rail Crew</small></h1>
    <p>One of you <b>flies</b> the train through a dark nebula. The other has the only <b>radar</b> and the passengers' tickets. Work together to deliver everyone!</p>
    ${msg?`<p style="color:#C9361F;font-weight:900">${esc(msg)}</p>`:''}
    <div class="row"><button class="btn" data-a="create">Create a room</button><input class="codein" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code"><button class="btn alt" data-a="join">Join</button></div>
    <div class="row"><button class="btn alt" data-a="local">Local test · both on this device</button></div>`);
}
function howTo(){
  const me=MODE==='guest'?'g':'h';
  card(`<h2>How to play<small>no Japanese needed to start</small></h2>
    <div class="roles"><div><img src="${ART}crew-p1-cap.webp" alt=""><span><b>🚀 Driver</b> (${me==='h'?'you':'your friend'} first): ◀ ▶ ▲ ▼ turn the nose, THRUST pushes, BRAKE stops the drift. Follow the gold ring and fly through the gate. Signs are in kana!</span></div>
    <div><img src="${ART}crew-p2.webp" alt=""><span><b>📡 Navigator</b> (${me==='g'?'you':'your friend'} first): you have the only radar. Read a 🎫 ticket, find its picture, tap it to set the course. Warn about meteors!</span></div></div>
    <p>Each wave teaches its new words first, then you play, then a breather. You swap jobs after wave 3.</p>
    <div class="row"><button class="btn" data-a="ready">Ready ▶</button></div>`);
}
function results(){
  const st=S.stats, t=Math.round(S.t);
  card(`<img class="key" src="${ART}key-art.webp" alt="" style="max-height:24vh"><h2>${st.del>=8?'到着! Amazing crew':'到着! Arrived'}<small>${st.hints?`with ${st.hints} hint${st.hints>1?'s':''}`:'no hints'}</small></h2>
    <div class="res"><span><b>${st.del}</b>delivered</span><span><b>${st.missed}</b>gave up</span><span><b>${st.wrong}</b>wrong stops</span><span><b>${st.hits}</b>bumps</span><span><b>${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}</b>time</span></div>
    <div class="row">${MODE!=='guest'?'<button class="btn" data-a="again">Fly again ▶</button>':'<p class="small">The host can start the next run.</p>'}<button class="btn alt" data-a="lobby">Lobby</button></div>`);
}
let shownPh='', evSeen=0;
function newRun(){ evSeen=S.ev.n; shownPh=''; LOCAL.ready=false; LOCAL.hinted={}; LOCAL.auto={}; LOCAL.wc={}; LOCAL.seenTk={}; LOCAL.view=MODE==='local'?'driver':''; gateCool={}; hitSent={};
  $('#tickets').dataset.k='-'; $('#waveCard').dataset.k=''; }
function hudFrame(){
  if(!S) return;
  if(S.ph!==shownPh){ shownPh=S.ph;
    if(S.ph==='ready'){ if(!LOCAL.ready) howTo(); else card(`<h2>Waiting…<small>for your crewmate</small></h2><p>Room <b>${esc(NET.code)}</b> · ${esc(NET.kind)}</p>`); }
    else if(S.ph==='run'){ $('#card').hidden=true; $('#hud').hidden=false; }
    else if(S.ph==='over'){ results(); } }
  const drive=iDrive(); $('#driverUI').hidden=!drive; $('#navUI').hidden=drive; $('#three').style.visibility=drive?'visible':'hidden';
  const roleTxt=`${ME}|${drive}|${MODE}`, rl=$('#role'); if(rl.dataset.k!==roleTxt){ rl.dataset.k=roleTxt;
    rl.innerHTML=`<img src="${ART}${ME==='h'?'crew-p1-cap':'crew-p2'}.webp" alt="">${MODE==='local'?(drive?'DRIVER view':'NAVIGATOR view'):(ME==='h'?'P1':'P2')+' · '+(drive?'DRIVER':'NAVIGATOR')}`; }
  if(S.ev.n>evSeen){ evSeen=S.ev.n; const e=S.ev;
    if(e.kind==='ok'||e.kind==='del'){ SND.fanfare(); toast(e.txt,'ok'); } else if(e.kind==='bad'||e.kind==='wrong'){ SND.bad(); toast(e.txt,'bad'); FX.shake=Math.max(FX.shake,.4); }
    else if(e.kind==='go'||e.kind==='wave'){ SND.whistle(); toast(e.txt,'go'); } else if(e.kind==='relax'){ SND.relax(); toast(e.txt,'ok'); }
    else if(e.kind==='swap'){ SND.swap(); toast(e.txt,'go'); } else if(e.kind==='course'){ SND.lock(); if(drive) toast('New course! Follow the gold ring','go'); } }
  const set=(id,v,low)=>{ const b=$(id); b.firstElementChild.style.transform=`scaleX(${Math.max(0,v/100).toFixed(3)})`; b.classList.toggle('low', !!low); };
  set('#hpBar', S.hp, S.hp<35);
  const trip=$('#trip'); if(!trip.childElementCount) trip.innerHTML=WAVES.slice(0,-1).map((x,i)=>`<em style="left:${(i+1)/WAVES.length*100}%"></em>`).join('')+'<b></b>';
  const D=S.dir||{w:0,ph:'intro',t:0}; trip.querySelectorAll('em').forEach((e,i)=>e.classList.toggle('ok', i<D.w));
  trip.querySelector('b').style.left=Math.min(100,(D.w+(D.ph==='intro'?0:D.ph==='play'?.1+.7*Math.min(1,D.t/T_PLAY):.85))/WAVES.length*100)+'%';
  // wave intro card (words + pictures, spoken) and the breather banner
  const wc=$('#waveCard'), rb=$('#restBanner');
  if(S.ph==='run' && D.ph==='intro'){ const Wv=WAVES[D.w], key='w'+D.w+':'+S.gid;
    if(wc.dataset.k!==key){ wc.dataset.k=key; wc.innerHTML=`<h3><small>WAVE ${D.w+1} OF ${WAVES.length}</small>${esc(Wv.name)}</h3>
      ${Wv.words.length?`<div class="words">${Wv.words.map(k=>`<button class="word" data-hear="${k}"><b>${P[k].ic} ${W[k].k}</b><small>${W[k].ro} · ${W[k].m}</small></button>`).join('')}</div>`:''}
      <p>${esc(Wv.tip)}</p><div class="bar2"><i></i></div>`; Wv.words.forEach((k,i)=>setTimeout(()=>say(k), 500+i*1300)); }
    wc.hidden=false; const bi=wc.querySelector('.bar2 i'); if(bi) bi.style.transform=`scaleX(${Math.max(0,1-D.t/T_INTRO).toFixed(3)})`;
  } else wc.hidden=true;
  rb.hidden=!(S.ph==='run' && D.ph==='rest'); if(D.ph==='rest'){ const nx=WAVES[D.w+1]; const t=`ひと休み · Breather${nx?' · next: '+nx.name:''}`; if(rb.textContent!==t) rb.textContent=t; }
  if(drive){ const d=$('#dash'), sp=Math.round(SHIP.spd/2)*2, k=sp+'|'+S.pax.map(p=>p.face).join('')+'|'+!!S.course; if(d.dataset.k!==k){ d.dataset.k=k;
    d.innerHTML=`<span>SPEED</span><b>${sp}</b><span>·</span>${S.pax.length?S.pax.map(p=>`<span class="f">${p.face}</span>`).join(''):'<span>nobody aboard</span>'}<span>· ${S.course?'🎯 course set':'ask your navigator!'}</span>`; } }
  else navFrame();
}

// ---------- input ----------
let lastTouchEnd=0;
document.addEventListener('touchend', e=>{ const now=Date.now(); if(now-lastTouchEnd<350) e.preventDefault(); lastTouchEnd=now; }, {passive:false});
document.addEventListener('dblclick', e=>e.preventDefault(), {passive:false});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
// hold buttons: each finger works on its own, so you can turn and thrust at the same time
document.querySelectorAll('#driverUI [data-k]').forEach(b=>{ const k=b.dataset.k;
  b.addEventListener('pointerdown', e=>{ e.preventDefault(); audio(); IN.btn[k]=1; b.classList.add('held'); try{ b.setPointerCapture(e.pointerId); }catch(x){} });
  const up=()=>{ IN.btn[k]=0; b.classList.remove('held'); }; ['pointerup','pointercancel','lostpointercapture'].forEach(t=>b.addEventListener(t, up)); });
addEventListener('blur', ()=>{ IN.btn={}; IN.keys={}; document.querySelectorAll('.held').forEach(b=>b.classList.remove('held')); });
addEventListener('keydown', e=>{ if(e.target.tagName==='INPUT') return; IN.keys[e.key.toLowerCase()]=1; if(e.key===' ') e.preventDefault(); });
addEventListener('keyup', e=>{ IN.keys[e.key.toLowerCase()]=0; });
// tap a picture on the radar to set the course
$('#radar').addEventListener('pointerdown', e=>{ e.preventDefault(); audio(); const r=e.currentTarget.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
  let best=null, bd=1e9; for(const p of LOCAL.pts){ const d=Math.hypot(p.x-x,p.y-y); if(d<Math.max(p.r,.07) && d<bd){ bd=d; best=p; } }
  if(best && best.id!=='home'){ doAct({k:'course', id:best.id}); SND.lock(); } });
document.addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;
  if(b.dataset.hear){ audio(); say(b.dataset.hear); return; }
  if(b.dataset.say){ say(b.dataset.say); return; }
  if(b.dataset.hint){ const id=+b.dataset.hint; LOCAL.hinted[id]=1; doAct({k:'hint', id}); return; }
  if(b.id==='switchBtn'){ LOCAL.view = LOCAL.view==='driver' ? 'nav' : 'driver'; IN.btn={}; return; }
  const a=b.dataset.a; if(!a) return; audio();
  if(a==='local'){ MODE='local'; ME='h'; NET={kind:'local test', code:'—', send:()=>{}}; S=freshState(); newRun(); $('#testBadge').hidden=false; $('#switchBtn').hidden=false; return; }
  if(a==='create'){ card('<h2>Opening a room…</h2>'); let r, code; for(let i=0;i<4;i++){ code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''); r=await netHost(code); if(r!=='taken') break; }
    if(r!==true) return lobby(r||'Online play is not available here.');
    MODE='host'; ME='h'; $('#testBadge').hidden=true; $('#switchBtn').hidden=true;
    card(`<h2>Room code<small>${esc(NET.kind)}</small></h2><div class="code">${code}</div><p>Your friend opens this same page, types the code and taps Join.</p><p class="small">Waiting for your friend…</p>`);
    const wait=setInterval(()=>{ if(MODE!=='host'){ clearInterval(wait); return; } if(guestHere){ clearInterval(wait); S=freshState(); newRun(); } }, 300); return; }
  if(a==='join'){ const code=($('#codeIn').value||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(code)) return lobby('Type the 4-character code.');
    card('<h2>Joining…</h2>'); const r=await netJoin(code); if(r!==true) return lobby(r);
    MODE='guest'; ME='g'; $('#testBadge').hidden=true; $('#switchBtn').hidden=true; if(!S) card('<h2>Joined!<small>waiting for the host</small></h2>');
    const keep=setInterval(()=>{ if(MODE!=='guest'){ clearInterval(keep); return; } sendGuest(); }, 400); return; }
  if(a==='ready'){ LOCAL.ready=true; if(MODE==='guest') sendGuest(true); else { S.ready.h=true; if(MODE==='local') S.ready.g=true; } shownPh=''; return; }
  if(a==='again'){ S=freshState(); newRun(); return; }
  if(a==='lobby'){ try{ NET.peer && NET.peer.destroy(); NET.room && NET.room.leave(); }catch(x){} location.reload(); }
});

// ---------- main loop ----------
let last=0;
function loop(time){
  requestAnimationFrame(loop);
  const dt=last ? Math.min(.05,(time-last)/1000) : .016; last=time;
  if(!S) return;
  const drive=iDrive(), run=S.ph==='run';
  if(run && (drive || MODE==='local')) flyShip(dt);
  if(MODE==='host' || MODE==='local'){ hostTick(dt); if(MODE==='host') pushState(); }
  if(MODE==='guest') sendGuest();
  if(drive && run){ initThree(); draw3(dt, time); engine(true, SHIP.thrust); } else engine(false);
  hudFrame();
}
requestAnimationFrame(loop);
lobby();
window.__grc={ S:()=>S, ship:SHIP, mode:()=>MODE, me:()=>ME, iDrive, P, W, act:a=>doAct(a), IN, three:()=>R3, radar:()=>LOCAL.pts };
})();
</script>
</body>
</html>
