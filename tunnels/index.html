<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Midnight Subway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 真夜中の地下鉄 Midnight Subway: the last train under Tokyo, for two.
   The Driver is in the cab: speed, brakes, the horn, and the passengers' tickets (only on this screen, in kana).
   The Navigator is in the control room: the live map, the points at every junction (only on this screen), the ghost train.
   The host phone runs the line; the driving phone runs the train and sends it. */
:root{ --bg:#04060B; --ink:#F1E9DD; --dim:#A9A29A; --line:rgba(241,233,221,.14); --red:#E0352B; --amber:#FF9A4D; --green:#5CE08A; --cyan:#5BE0FF;
  --sl:env(safe-area-inset-left); --sr:env(safe-area-inset-right); --st:env(safe-area-inset-top); --sb:env(safe-area-inset-bottom); --ui:"Zen Kaku Gothic New",system-ui,sans-serif; }
:root[data-lang=zh]{ --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation;font-family:inherit}
[hidden]{display:none!important}
#three{position:fixed;inset:0}
#three canvas{display:block;width:100%;height:100%}
#vig{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;background:radial-gradient(ellipse 80% 75% at 50% 50%,rgba(0,0,0,0) 45%,rgba(60,220,150,.55))}
#cab{position:fixed;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse 80% 74% at 50% 46%,rgba(0,0,0,0) 60%,rgba(0,0,0,.6) 84%,rgba(0,0,0,.92))}
.hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.bars{position:absolute;z-index:4;left:max(14px,var(--sl));top:calc(var(--st) + 12px);display:flex;flex-direction:column;gap:6px;width:min(190px,22vw)}
.bar{display:flex;align-items:center;gap:8px;font:900 10px var(--ui);letter-spacing:.2em;color:var(--dim)}
.bar span{width:46px;flex:none}
.bar div{flex:1;height:7px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;transform-origin:0 50%;background:#7EE08A;transition:transform .15s}
.bar.low i{background:var(--red)}
.time{font:700 11px var(--ui);letter-spacing:.12em;color:var(--dim)}
.score{position:absolute;z-index:4;right:max(14px,var(--sr));top:calc(var(--st) + 8px);text-align:right;font:400 26px "Dela Gothic One";color:#FFE9D6;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.score small{display:block;font:900 10px var(--ui);letter-spacing:.16em;color:var(--dim);margin-top:2px}
/* the driver: tickets along the top, the next station, the controls */
#drv::before{content:"";position:absolute;left:0;right:0;top:0;height:calc(var(--st) + 84px);background:linear-gradient(rgba(4,6,11,.82),rgba(4,6,11,0));pointer-events:none}
.tix{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--st) + 8px);display:flex;gap:7px;pointer-events:auto;max-width:56vw}
.tk{all:unset;position:relative;display:flex;align-items:center;gap:7px;padding:6px 10px 9px 8px;border-radius:9px;background:rgba(10,13,20,.86);box-shadow:inset 0 0 0 1px rgba(241,233,221,.22);cursor:pointer;min-width:74px}
.tk:active{background:rgba(40,46,60,.9)}
.tk .pw{width:14px;height:22px;border-radius:7px 7px 3px 3px;flex:none;position:relative}
.tk .pw::before{content:"";position:absolute;left:2px;top:-9px;width:10px;height:10px;border-radius:50%;background:#D9B796}
.tk b{display:block;font:900 20px/1.05 var(--ui);color:#fff;white-space:nowrap}
.tk small{display:block;font:700 9.5px var(--ui);color:#9FB4C8;white-space:nowrap;letter-spacing:.04em}
.tk em{position:absolute;left:8px;right:8px;bottom:4px;height:3px;border-radius:2px;background:rgba(255,255,255,.12);overflow:hidden}
.tk em i{display:block;height:100%;background:var(--green);transform-origin:0 50%}
.tk em i.low{background:var(--red)}
.tk u{position:absolute;right:-5px;top:-6px;width:17px;height:17px;border-radius:50%;background:var(--amber);color:#0B0E14;font:900 10px/17px var(--ui);text-align:center;text-decoration:none}
.tk.sent{box-shadow:inset 0 0 0 2px var(--amber)}
.tixhint{font:700 11px var(--ui);color:#FFD6B0;background:rgba(10,13,20,.8);border-radius:8px;padding:6px 10px;align-self:center;white-space:nowrap}
.next{position:absolute;right:max(14px,var(--sr));top:calc(var(--st) + 62px);display:flex;align-items:center;gap:10px;pointer-events:none}
.sign{background:#10151F;border-radius:7px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.18);padding:5px 12px 7px;text-align:center;position:relative;overflow:hidden;min-width:96px}
.sign::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--c,#5B6B86)}
.sign i{display:block;font:900 9px var(--ui);letter-spacing:.24em;color:var(--dim);font-style:normal}
.sign b{display:block;font:900 21px/1.15 var(--ui);color:#fff}
.sign small{display:block;font:700 10px var(--ui);color:#9FB4C8}
.lim{width:46px;height:46px;border-radius:50%;background:#F4F0E6;box-shadow:inset 0 0 0 5px #D8342B;display:flex;align-items:center;justify-content:center;font:400 17px "Dela Gothic One";color:#111}
.lim.over{animation:blink .35s steps(2) infinite}
.pts{font:900 12px var(--ui);color:#FFE9D6;background:rgba(10,13,20,.8);padding:5px 8px;border-radius:7px;white-space:nowrap}
.pts b{font:400 16px "Dela Gothic One";color:var(--green);margin:0 2px}
.warn{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);font:400 22px "Dela Gothic One";color:#FF6B5E;text-shadow:0 0 18px rgba(224,53,43,.8),0 2px 0 #000;white-space:nowrap;animation:blink .4s steps(2) infinite;text-align:center}
.warn small{display:block;font:900 12px var(--ui);letter-spacing:.2em;color:#FFD6B0}
@keyframes blink{50%{opacity:.35}}
.speed{position:absolute;left:50%;bottom:calc(var(--sb) + 10px);transform:translateX(-50%);font:400 32px "Dela Gothic One";color:#FFE9D6;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.speed small{font:900 10px var(--ui);letter-spacing:.2em;color:var(--dim);margin-left:4px}
.ctl button{position:absolute;pointer-events:auto;border:0;color:#F1E9DD;background:rgba(241,233,221,.10);box-shadow:inset 0 0 0 2px rgba(241,233,221,.38);font:900 15px var(--ui);letter-spacing:.12em;touch-action:none;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ctl [data-k=brake]{left:max(14px,var(--sl));bottom:calc(var(--sb) + 14px);width:108px;height:108px;border-radius:50%;background:rgba(224,53,43,.16);box-shadow:inset 0 0 0 2px rgba(255,122,110,.75)}
.ctl [data-k=go]{right:max(14px,var(--sr));bottom:calc(var(--sb) + 14px);width:122px;height:122px;border-radius:50%;background:rgba(92,224,138,.14);box-shadow:inset 0 0 0 2px rgba(92,224,138,.75);font-size:20px}
.ctl [data-k=horn]{right:calc(max(14px,var(--sr)) + 136px);bottom:calc(var(--sb) + 22px);width:84px;height:62px;border-radius:16px;background:rgba(255,154,77,.14);box-shadow:inset 0 0 0 2px rgba(255,154,77,.75);font-size:13px}
.ctl button.held{background:rgba(241,233,221,.32)}
.ctl [data-k=horn].hot{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{background:rgba(255,154,77,.55)}}
/* the navigator: the control room */
.desk{position:fixed;inset:0;z-index:2;pointer-events:auto;background:radial-gradient(90% 90% at 40% 40%,#0C1424,#04060B 80%)}
.mapw{position:absolute;left:max(8px,var(--sl));top:calc(var(--st) + 44px);bottom:calc(var(--sb) + 6px);right:calc(max(8px,var(--sr)) + min(240px,30vw))}
#map{width:100%;height:100%;display:block;touch-action:none}
#map .ln{fill:none;stroke:#1C273C;stroke-width:14;stroke-linecap:round}
#map .ln2{fill:none;stroke:#7186AC;stroke-width:4;stroke-linecap:round}
#map .ln.closed{stroke:#141A28;stroke-width:6;stroke-dasharray:6 9}
#map .route{fill:none;stroke:#FF9A4D;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;opacity:.55}
#map .blade{fill:none;stroke:#FFE9D6;stroke-width:6;stroke-linecap:round}
#map .blade.lock{stroke:#FF9A4D}
#map .stub{fill:none;stroke:#E0352B;stroke-width:4;stroke-linecap:round;opacity:.7}
#map .st circle.ring{fill:#0B1220;stroke-width:4}
#map .st.closed{opacity:.22}
#map .st.junc circle.ring{stroke-dasharray:none}
#map .ic path,#map .ic circle,#map .ic ellipse{fill:none;stroke:#F1E9DD;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
#map .ic .f{fill:#F1E9DD;stroke:none}
#map .ic .pk{fill:#F2A7C3;stroke:none}
#map .ic .gr{fill:#8FD19E;stroke:none}
#map .ic .k{fill:#E8C547;stroke:none}
#map .wt circle,#map .wt path{fill:#F1E9DD}
#map .wt rect{fill:rgba(10,13,20,.9);stroke:rgba(241,233,221,.3)}
#map .lbl rect{fill:#F1E9DD}
#map .lbl text{fill:#0B0E14;font:900 17px var(--ui);text-anchor:middle;dominant-baseline:central}
#map .hz circle{fill:#E0352B}
#map .hz text{fill:#fff;font:900 13px var(--ui);text-anchor:middle;dominant-baseline:central}
#map .tap{fill:transparent}
.side{position:absolute;right:max(8px,var(--sr));top:calc(var(--st) + 44px);bottom:calc(var(--sb) + 8px);width:min(232px,29vw);display:flex;flex-direction:column;gap:7px;pointer-events:auto}
.side h4{margin:0;font:900 10px var(--ui);letter-spacing:.28em;color:var(--amber);text-transform:uppercase}
.ab{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);border-radius:9px;padding:6px 8px;min-height:40px;position:relative}
.ab .pw{width:12px;height:19px;border-radius:6px 6px 3px 3px;flex:none;position:relative;margin-top:6px}
.ab .pw::before{content:"";position:absolute;left:1px;top:-8px;width:10px;height:10px;border-radius:50%;background:#D9B796}
.ab b{flex:1;font:900 19px var(--ui);color:#fff;white-space:nowrap;overflow:hidden}
.ab b.q{color:var(--dim);font-size:12px;font-weight:700}
.ab button{flex:none;width:30px;height:28px;border-radius:7px;border:0;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:900 12px var(--ui);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.ab svg{width:22px;height:22px}
.ab .mi path,.ab .mi circle,.ab .mi ellipse{fill:none;stroke:#F1E9DD;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ab .mi .f{fill:#F1E9DD;stroke:none} .ab .mi .pk{fill:#F2A7C3;stroke:none} .ab .mi .gr{fill:#8FD19E;stroke:none} .ab .mi .k{fill:#E8C547;stroke:none}
.ab em{position:absolute;left:8px;right:8px;bottom:3px;height:2px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.ab em i{display:block;height:100%;background:var(--green);transform-origin:0 50%}
.ab.new{animation:flash .6s ease-out}
@keyframes flash{from{box-shadow:inset 0 0 0 2px var(--amber)}}
.none{font:700 12px/1.5 var(--ui);color:var(--dim)}
.alarm{border-radius:9px;background:rgba(60,220,150,.14);box-shadow:inset 0 0 0 1px rgba(120,255,190,.6);color:#BFFFE0;font:900 12px var(--ui);letter-spacing:.08em;padding:8px 10px;animation:blink .6s steps(2) infinite}
.navtop{position:absolute;left:calc(max(14px,var(--sl)) + min(190px,22vw) + 16px);top:calc(var(--st) + 10px);font:700 11px var(--ui);color:var(--dim);letter-spacing:.06em;max-width:46vw}
.navtop b{color:#FFE9D6}
/* shared */
.banner{position:absolute;left:50%;top:calc(var(--st) + 56px);transform:translateX(-50%);background:rgba(10,13,20,.92);box-shadow:inset 0 0 0 1px rgba(241,233,221,.25);border-radius:12px;padding:8px 12px;display:flex;gap:10px;align-items:center;white-space:nowrap;z-index:6}
.banner .k{font:900 10px var(--ui);letter-spacing:.24em;color:var(--amber);writing-mode:vertical-rl}
.banner .w{display:flex;align-items:center;gap:6px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.05)}
.banner .w svg{width:28px;height:28px}
.banner .w b{display:block;font:900 18px/1.1 var(--ui);color:#fff}
.banner .w small{display:block;font:700 10px var(--ui);color:#9FB4C8}
.banner .mi path,.banner .mi circle,.banner .mi ellipse{fill:none;stroke:#F1E9DD;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.banner .mi .f{fill:#F1E9DD;stroke:none} .banner .mi .pk{fill:#F2A7C3;stroke:none} .banner .mi .gr{fill:#8FD19E;stroke:none} .banner .mi .k{fill:#E8C547;stroke:none}
.toast{position:absolute;z-index:8;left:50%;top:25%;transform:translate(-50%,-50%);font:400 22px "Dela Gothic One";color:#FFE9D6;text-shadow:0 2px 12px rgba(0,0,0,.85),0 0 2px #000;opacity:0;white-space:nowrap;text-align:center}
.toast small{display:block;font:900 12px var(--ui);letter-spacing:.06em;color:#E6DED2;margin-top:2px}
.toast.ok{color:#9CF2B4}.toast.bad{color:#FF7A6E}.toast.go{color:var(--amber)}
:root[data-lang=zh] .toast{font-family:var(--ui);font-weight:900}
#scare{position:fixed;inset:0;z-index:12;pointer-events:none;display:flex;align-items:center;justify-content:center;font:400 120px "Dela Gothic One";color:#E8FFF4;text-shadow:0 0 40px rgba(120,255,190,.9)}
.count{position:fixed;inset:0;z-index:7;display:flex;align-items:center;gap:30px;padding:0 max(44px,var(--sr)) 0 max(44px,var(--sl));background:rgba(4,6,11,.8);pointer-events:none}
.count ol{flex:1;margin:0;padding:0;list-style:none;counter-reset:s}
.count h3{margin:0 0 10px;font:900 13px var(--ui);letter-spacing:.3em;color:var(--amber)}
.count li{counter-increment:s;display:flex;gap:14px;align-items:baseline;font:700 15px/1.4 var(--ui);color:#F1E9DD;margin:6px 0}
.count li::before{content:counter(s);font:400 19px "Dela Gothic One";color:var(--amber);width:18px;flex:none}
.count .n{font:400 120px "Dela Gothic One";color:#FFE9D6;min-width:150px;text-align:right}
.ui{position:fixed;inset:0;z-index:9;display:flex;align-items:center;padding:14px max(18px,var(--sl));background:linear-gradient(90deg,rgba(4,6,11,.95),rgba(4,6,11,.74) 52%,rgba(4,6,11,.15))}
.panel{width:min(560px,100%);max-height:100%;overflow:auto;padding:2px}
.kicker{font:700 11px var(--ui);letter-spacing:.34em;color:var(--amber);text-transform:uppercase}
h1{margin:6px 0 4px;font:400 50px/1 "Dela Gothic One";letter-spacing:.04em;color:#FFE9D6;text-shadow:0 0 26px rgba(91,224,255,.35)}
h2{margin:6px 0 8px;font:400 28px/1.1 "Dela Gothic One";color:#FFE9D6}
:root[data-lang=zh] h2,:root[data-lang=zh] .role b{font-family:var(--ui);font-weight:900;letter-spacing:.02em}
.lead{margin:10px 0 12px;font:500 14px/1.65 var(--ui);color:#C9C2B8;max-width:50ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{font:900 14px var(--ui);letter-spacing:.08em;color:#0B0E14;background:var(--ink);border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(241,233,221,.35)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.55}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.role{all:unset;cursor:pointer;display:block;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(241,233,221,.16)}
.role:active{background:rgba(255,255,255,.09)}
.role i{display:block;font:700 10px var(--ui);letter-spacing:.28em;color:var(--amber);font-style:normal;text-transform:uppercase;margin-bottom:4px}
.role b{display:block;font:400 21px "Dela Gothic One";color:#FFE9D6}
.role small{display:block;margin-top:6px;font:500 12.5px/1.5 var(--ui);color:var(--dim)}
.steps{margin:6px 0 2px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:baseline;font:700 13px/1.45 var(--ui);color:#E6DED2;margin:4px 0}
.steps li::before{content:counter(s);font:400 16px "Dela Gothic One";color:var(--amber);width:14px;flex:none}
.note{font:500 12.5px/1.55 var(--ui);color:var(--dim);margin-top:10px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stats span{display:flex;flex-direction:column;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05);font:700 10px var(--ui);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stats b{font:400 22px "Dela Gothic One";color:#FFE9D6;letter-spacing:0}
.stars{font:400 30px "Dela Gothic One";color:var(--amber);letter-spacing:.1em;margin-top:2px}
.stars .off{color:rgba(241,233,221,.16)}
.rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--bg);font:700 16px var(--ui);text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){ .rotate{display:flex} }
@media (max-height:400px){ .count li{font-size:14px;margin:4px 0} .ctl [data-k=go]{width:110px;height:110px} .ctl [data-k=brake]{width:96px;height:96px} }
</style>
</head>
<body>
<div id="three"></div>
<div id="cab" hidden></div>
<div id="vig"></div>
<div class="hud" id="hud" hidden>
  <div id="drv" hidden>
    <div class="tix" id="tix"></div>
    <div class="next" id="next"></div>
    <div class="warn" id="warn" hidden></div>
    <div class="speed" id="speed"></div>
    <div class="ctl"><button data-k="brake">BRAKE</button><button data-k="horn">HORN</button><button data-k="go">GO</button></div>
  </div>
  <div class="desk" id="nav" hidden>
    <div class="navtop" id="navTop"></div>
    <div class="mapw"><svg id="map" viewBox="0 0 780 480" preserveAspectRatio="xMidYMid meet" aria-label="The line"></svg></div>
    <div class="side" id="side"></div>
  </div>
  <div class="bars"><div class="bar" id="hpBar"><span id="hpL">TRAIN</span><div><i id="hpI"></i></div></div><div class="time" id="time"></div></div>
  <div class="score" id="score">0<small id="sub"></small></div>
  <div class="banner" id="banner" hidden></div>
  <div class="toast" id="toast"></div>
</div>
<div id="scare" hidden></div>
<div class="count" id="count" hidden></div>
<div class="ui" id="ui"><div class="panel" id="panel"></div></div>
<div class="rotate" id="rot">横にしてね</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// inside 夜ふかし (the hub page) the hub holds the connection, the seats and the language; on its own this page is practice with しばBot
const HUB=(()=>{ try{ const h=window.parent!==window && window.parent.HUBAPI; return h && h.v ? h : null; }catch(e){ return null; } })();
const LANG=HUB ? HUB.lang : (()=>{ try{ const v=JSON.parse(localStorage.getItem('yofu_lang')); if(v==='zh'||v==='en') return v; }catch(e){} return /^zh/i.test(navigator.language||'')?'zh':'en'; })();
const T=(en,zh)=>LANG==='zh'?zh:en;
document.documentElement.dataset.lang=LANG;
const store={ get(k,d){ try{ const v=localStorage.getItem('ms_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('ms_'+k, JSON.stringify(v)); }catch(e){} } };

// ---------- the line: eleven stations, opening in three phases ----------
const WD={ tokyo:{k:'とうきょう',ro:'tōkyō',m:['Tokyo','东京']}, umi:{k:'うみ',ro:'umi',m:['sea','海']}, yama:{k:'やま',ro:'yama',m:['mountain','山']},
  tsuki:{k:'つき',ro:'tsuki',m:['moon','月亮']}, kitsune:{k:'きつね',ro:'kitsune',m:['fox','狐狸']}, jinja:{k:'じんじゃ',ro:'jinja',m:['shrine','神社']},

// ---------- the tunnel network ----------
for(const id in NODES){ const n=NODES[id]; n.id=id; n.X=(n.x-2)*G; n.Z=(n.z-2)*G; n.adj=[]; }
const EDGES=LINKS.map(([a,b],i)=>{
  const A=NODES[a], B=NODES[b], dx=B.X-A.X, dz=B.Z-A.Z, L=Math.hypot(dx,dz), bend=((i*7)%5-2)*.07*L;
  const cx=(A.X+B.X)/2-dz/L*bend, cz=(A.Z+B.Z)/2+dx/L*bend;
  // sample the curve finely, then every 1 unit of length, so a position along a tunnel is a lookup
  const raw=[], cum=[0];
  for(let k=0;k<=240;k++){ const t=k/240, u=1-t; raw.push([u*u*A.X+2*u*t*cx+t*t*B.X, u*u*A.Z+2*u*t*cz+t*t*B.Z]); if(k) cum.push(cum[k-1]+Math.hypot(raw[k][0]-raw[k-1][0], raw[k][1]-raw[k-1][1])); }

  for(let s=0,k=0;s<=n;s++){ const ss=Math.min(s,len); while(k<239 && cum[k+1]<ss) k++; const f=(ss-cum[k])/((cum[k+1]-cum[k])||1); px[s]=raw[k][0]+(raw[k+1][0]-raw[k][0])*f; pz[s]=raw[k][1]+(raw[k+1][1]-raw[k][1])*f; }
  A.adj.push(i); B.adj.push(i);
  return {i, a, b, len, n, px, pz, cx, cz, ph:Math.max(A.ph,B.ph), depot:a==='depot'||b==='depot'};
});
function epos(e,s){ s=clamp(s,0,e.len); const k=Math.min(Math.floor(s),e.n-1), f=s-k; return {x:e.px[k]+(e.px[k+1]-e.px[k])*f, z:e.pz[k]+(e.pz[k+1]-e.pz[k])*f}; }
function edir(e,s){ const a=epos(e,s-1), b=epos(e,s+1), dx=b.x-a.x, dz=b.z-a.z, l=Math.hypot(dx,dz)||1; return {x:dx/l, z:dz/l}; }
let S=null;
const phase=()=>S?S.phase:0;
const isOpen=j=>EDGES[j].ph<=phase();
const nodeOpen=id=>NODES[id].ph<=phase();
const STATIONS=Object.keys(WD);
const openStations=()=>STATIONS.filter(nodeOpen);
const tpos=t=>epos(EDGES[t.e],t.s);
const nearNode=t=>{ const e=EDGES[t.e]; return t.s<ZONE ? {id:e.a, off:t.s} : e.len-t.s<ZONE ? {id:e.b, off:e.len-t.s} : null; };
const ahead=t=>{ const e=EDGES[t.e]; return t.d>0 ? {node:e.b, dist:e.len-t.s} : {node:e.a, dist:t.s}; };
const legs=node=>NODES[node].adj.filter(j=>isOpen(j) && !EDGES[j].depot);
const isJunction=node=>legs(node).length>=3;
// the tunnels you can take out of a station, with their angle as seen from the cab (for the straight-on default)
function exitsAt(node, inE){
  const n=NODES[node], ie=EDGES[inE], b=epos(ie, node===ie.b ? ie.len-RH : RH); let fx=n.X-b.x, fz=n.Z-b.z; const fl=Math.hypot(fx,fz)||1; fx/=fl; fz/=fl;
  return n.adj.filter(j=>j!==inE && isOpen(j) && !EDGES[j].depot).map(j=>{ const e=EDGES[j], m=epos(e, node===e.a ? RH : e.len-RH); let x=m.x-n.X, z=m.z-n.Z; const l=Math.hypot(x,z)||1; x/=l; z/=l;
    const th=Math.atan2(x*fz-z*fx, x*fx+z*fz); return {j, to:node===e.a?e.b:e.a, th, code:Math.abs(th)<.5?'s':th>0?'l':'r'}; });
}
const defaultExit=ex=>ex.reduce((p,q)=>Math.abs(q.th)<Math.abs(p.th)?q:p);
// the points: the navigator sets each junction to one of its tunnels; arriving down that very tunnel, the train goes straight on
function swExit(node, inE){ const ex=exitsAt(node,inE); if(!ex.length) return null; const set=S && S.sw ? S.sw[node] : null; return ex.find(x=>x.j===set)||defaultExit(ex); }
const ARROW={l:'◀', s:'▲', r:'▶'};
let DIST=null, distP=-1;
function dists(){ const p=phase(); if(distP===p && DIST) return DIST; distP=p; const ids=Object.keys(NODES), D={};
  ids.forEach(a=>{ D[a]={}; ids.forEach(b=>D[a][b]=a===b?0:1e9); });
  EDGES.forEach(e=>{ if(isOpen(e.i)){ D[e.a][e.b]=Math.min(D[e.a][e.b],e.len); D[e.b][e.a]=D[e.a][e.b]; } });
  ids.forEach(k=>ids.forEach(a=>ids.forEach(b=>{ if(D[a][k]+D[k][b]<D[a][b]) D[a][b]=D[a][k]+D[k][b]; })));
  return DIST=D; }
// follow the track ahead through the points as they are set: tunnel pieces {e, from, to, d, at} and stations {node, at}
function walk(t, max){ const out=[]; let e=EDGES[t.e], s=t.s, d=t.d, acc=0;

    out.push({e:e.i, from:s, to:s+d*len, d, at:acc}); acc+=len; if(len<toEnd-1e-6) break;
    const node=d>0?e.b:e.a; out.push({node, at:acc}); const x=swExit(node, e.i); if(!x) break;

      const n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; NOISE=b; rumble(); }

function engineTick(dt,on,v,braking){ engT-=dt; if(!RUMB || engT>0) return; engT=.1; try{ const t=AC.currentTime, k=v/VMAX;

// ---------- the line (run by the host phone): phases, passengers, the ghost train, things on the tracks ----------
function initSwitches(){ for(const id in NODES){ if(!nodeOpen(id) || !isJunction(id)) continue; const ok=legs(id); if(!ok.includes(S.sw[id])) S.sw[id]=ok[0]; } }
function newWait(at){ const a=ahead(S.tr).node, nn=nearNode(S.tr), busy=new Set(S.wait.map(w=>w.at));
  const opts=at?[at]:openStations().filter(id=>id!==a && (!nn||id!==nn.id) && !busy.has(id)); if(!opts.length) return null;
  S.pid++; return {id:S.pid, at:pick(opts), look:Math.floor(Math.random()*COATS.length), until:S.t+55, life:55}; }
function hostTick(dt){ if(!S) return;
  if(S.ph==='ready'){ if(S.ready.h && S.ready.g){ S.ph='count'; S.cd=3.2; } return; }
  if(S.ph==='count'){ S.cd-=dt; if(S.cd<=0){ S.ph='run'; initSwitches(); S.wait.push(newWait('tokyo')); ev('go'); } return; }
  if(S.ph!=='run') return;
  S.t+=dt;
  const ph=PH.filter(p=>S.t>=p.t).length-1; if(ph>S.phase){ S.phase=ph; initSwitches(); ev('new',{ph}); }
  const want=[2,3,4][S.phase]-(S.hp<35?1:0);
  if(S.t>=S.nextW && S.wait.length+S.pax.length<want){ const w=newWait(); if(w){ S.wait.push(w); ev('wait'); } S.nextW=S.t+rnd(5,9)-S.phase*1.2; }
  S.wait=S.wait.filter(w=>{ if(S.t<w.until) return true; ev('left',{at:w.at}); return false; });
  S.pax=S.pax.filter(p=>{ if(S.t<p.until) return true; S.stats.missed++; S.hp-=5; S.score=Math.max(0,S.score-50); ev('gaveup',{w:p.dest}); return false; });
  ghostTick(dt);
  if(S.t>=S.hzNext && S.hz.length<2){ spawnHazard(); S.hzNext=S.t+rnd(10,15)-S.phase*1.5; }
  S.hz=S.hz.filter(h=>S.t<h.until);

  else if(S.t>=RUN_T){ S.ph='over'; S.win=true; ev('dawn'); } }

// ---------- the train (run on the driving phone, so the buttons never wait for the network) ----------
const IN={btn:{}, keys:{}};
function driveTrain(dt){

  const B=IN.btn, k=IN.keys, end=S.ph!=='run'; let go=!end && (B.go||k.arrowup||k.w), br=end||B.brake||k.arrowdown||k.s;
  if(MODE==='bot' && ROLE==='nav' && !end){ const c=botDrive(dt); go=c.go; br=c.brake; }
  TR.v = go ? Math.min(VMAX, TR.v+ACC*dt) : Math.max(0, TR.v-(br?BRK:FRI)*dt); TR.braking=!!br && TR.v>3;

// ---------- しばBot: plays the other seat when you practise ----------
// as navigator it only knows the destinations you have told it (tap a ticket); as driver it calls every ticket out to you
const BN={t:0}, BD={wait:0, callT:2.5, honk:{}};

  // where on screen a station, or a point on a tunnel next to a junction, is on the navigator's map
  scrSt:id=>{ const p=mapEl.createSVGPoint(); p.x=MX(NODES[id].x); p.y=MY(NODES[id].z); const q=p.matrixTransform(mapEl.getScreenCTM()); return {x:q.x, y:q.y}; },
  scrTun:(node,j,f)=>{ const e=EDGES[j], s=e.a===node?e.len*f:e.len*(1-f), q=epos(e,s), m=W2M(q.x,q.z), p=mapEl.createSVGPoint(); p.x=m.x; p.y=m.y; const r=p.matrixTransform(mapEl.getScreenCTM()); return {x:r.x, y:r.y}; } };
})();
</script>
