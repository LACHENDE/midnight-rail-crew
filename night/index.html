<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Night Parade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 百鬼夜行 Night Parade: a two-player car chase on the Shuto Expressway at 2 a.m.
   The Driver weaves through traffic in 3D; the Gunner rides backwards in the truck bed and fires お札 at the yokai
   carrying the kana that gets called. Each phone runs its own half; snapshots and events travel between them. */
:root{ --bg:#05070D; --ink:#F1E9DD; --dim:#A9A29A; --red:#E0352B; --amber:#FF9A4D; --cyan:#5BE0FF; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation;font-family:inherit}
[hidden]{display:none!important}
#three{position:fixed;inset:0}
#three canvas{display:block;width:100%;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hud{position:fixed;inset:0;z-index:3;pointer-events:none}
.bars{position:absolute;left:max(14px,env(safe-area-inset-left));top:calc(env(safe-area-inset-top) + 12px);display:flex;flex-direction:column;gap:7px;width:min(200px,23vw)}
.bar{display:flex;align-items:center;gap:8px;font:900 10px "Zen Kaku Gothic New";letter-spacing:.2em;color:var(--dim)}
.bar span{width:46px;flex:none}
.bar div{flex:1;height:7px;background:rgba(255,255,255,.12);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;transform-origin:0 50%;background:#7EE08A;transition:transform .15s}
.bar.low i{background:var(--red)}
.bar.boost i{background:linear-gradient(90deg,#5BE0FF,#B98CFF)}
.score{position:absolute;right:max(14px,env(safe-area-inset-right));top:calc(env(safe-area-inset-top) + 8px);text-align:right;font:400 28px "Dela Gothic One";color:#FFE9D6;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.score small{display:block;font:900 11px "Zen Kaku Gothic New";letter-spacing:.16em;color:var(--dim);margin-top:2px}
.mirror{position:absolute;border:3px solid #0B0D12;border-radius:10px;box-shadow:0 0 0 1px rgba(255,255,255,.14),0 6px 18px rgba(0,0,0,.55)}
.mirror span{position:absolute;left:8px;top:4px;font:900 9px "Zen Kaku Gothic New";letter-spacing:.2em;color:rgba(241,233,221,.75);text-shadow:0 1px 3px #000}
.callD{position:absolute;left:50%;transform:translateX(-50%);font:900 12px "Zen Kaku Gothic New";letter-spacing:.06em;color:#FFE9D6;background:rgba(8,10,16,.78);border-radius:999px;padding:3px 12px;white-space:nowrap}
.callD b{font:400 18px "Dela Gothic One";color:var(--amber);margin:0 5px}
.callG{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 10px);transform:translateX(-50%);text-align:center;white-space:nowrap}
.callG .lbl{font:900 10px "Zen Kaku Gothic New";letter-spacing:.32em;color:var(--amber)}
.callG .k{font:400 50px/1.05 "Dela Gothic One";color:#FFE9D6;text-shadow:0 0 18px rgba(255,154,77,.55),0 2px 0 #000;letter-spacing:.04em}
.callG .h{font:400 30px "Yuji Syuku";color:rgba(255,233,214,.8);margin-left:10px;vertical-align:6px}
.callG .t{margin:5px auto 0;width:170px;height:5px;border-radius:4px;background:rgba(255,255,255,.16);overflow:hidden}
.callG .t i{display:block;height:100%;background:var(--amber);transform-origin:0 50%}
.callG.hot .k{color:#FF7A6E;text-shadow:0 0 24px rgba(224,53,43,.85),0 2px 0 #000}
.callG.hot .t i{background:var(--red)}
.speed{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 10px);transform:translateX(-50%);font:400 34px "Dela Gothic One";color:#FFE9D6;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.speed small{font:900 11px "Zen Kaku Gothic New";letter-spacing:.2em;color:var(--dim);margin-left:4px}
.ctl button{position:absolute;pointer-events:auto;border:0;color:#F1E9DD;background:rgba(241,233,221,.10);box-shadow:inset 0 0 0 2px rgba(241,233,221,.38);font:400 30px "Dela Gothic One";touch-action:none;cursor:pointer;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
.ctl [data-k=l]{left:max(14px,env(safe-area-inset-left));bottom:calc(env(safe-area-inset-bottom) + 14px);width:92px;height:92px;border-radius:22px}
.ctl [data-k=r]{left:calc(max(14px,env(safe-area-inset-left)) + 104px);bottom:calc(env(safe-area-inset-bottom) + 14px);width:92px;height:92px;border-radius:22px}
.ctl [data-k=boost]{right:max(14px,env(safe-area-inset-right));bottom:calc(env(safe-area-inset-bottom) + 14px);width:118px;height:118px;border-radius:50%;font-size:16px;letter-spacing:.12em;background:rgba(91,224,255,.16);box-shadow:inset 0 0 0 2px rgba(91,224,255,.7)}
.ctl button.held{background:rgba(241,233,221,.3)}
.ctl [data-k=boost].held{background:rgba(91,224,255,.48)}
.count{position:fixed;inset:0;z-index:5;display:flex;align-items:center;gap:30px;padding:0 max(44px,env(safe-area-inset-right)) 0 max(44px,env(safe-area-inset-left));background:rgba(5,7,13,.74);pointer-events:none}
.count ol{flex:1;margin:0;padding:0;list-style:none;counter-reset:s}
.count h3{margin:0 0 10px;font:900 13px "Zen Kaku Gothic New";letter-spacing:.3em;color:var(--amber)}
.count li{counter-increment:s;display:flex;gap:14px;align-items:baseline;font:700 16px/1.45 "Zen Kaku Gothic New";color:#F1E9DD;margin:7px 0}
.count li::before{content:counter(s);font:400 20px "Dela Gothic One";color:var(--amber);width:18px;flex:none}
.count .n{font:400 120px "Dela Gothic One";color:#FFE9D6;min-width:150px;text-align:right}
.ui{position:fixed;inset:0;z-index:6;display:flex;align-items:center;padding:14px max(18px,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(5,7,13,.94),rgba(5,7,13,.72) 52%,rgba(5,7,13,.1))}
.panel{width:min(540px,100%);max-height:100%;overflow:auto;padding:2px}
.kicker{font:700 11px "Zen Kaku Gothic New";letter-spacing:.34em;color:var(--amber);text-transform:uppercase}
h1{margin:6px 0 4px;font:400 54px/1 "Dela Gothic One";letter-spacing:.04em;color:#FFE9D6;text-shadow:0 0 26px rgba(224,53,43,.5)}
h2{margin:6px 0 8px;font:400 28px/1.1 "Dela Gothic One";color:#FFE9D6}
.lead{margin:10px 0 14px;font:500 14px/1.65 "Zen Kaku Gothic New";color:#C9C2B8;max-width:48ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{font:900 14px "Zen Kaku Gothic New";letter-spacing:.08em;color:#0B0E14;background:var(--ink);border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(241,233,221,.35)}
.btn:active{transform:translateY(1px)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.role{all:unset;cursor:pointer;display:block;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(241,233,221,.16)}
.role:active{background:rgba(255,255,255,.09)}
.role i{display:block;font:700 10px "Zen Kaku Gothic New";letter-spacing:.28em;color:var(--amber);font-style:normal;text-transform:uppercase;margin-bottom:4px}
.role b{display:block;font:400 21px "Dela Gothic One";color:#FFE9D6}
.role small{display:block;margin-top:6px;font:500 12.5px/1.5 "Zen Kaku Gothic New";color:var(--dim)}
.code{font:400 44px "Dela Gothic One";letter-spacing:.24em;color:var(--amber)}
input.codein{font:400 22px "Dela Gothic One";letter-spacing:.2em;text-transform:uppercase;width:130px;padding:9px 12px;border-radius:8px;border:0;background:var(--ink);color:#0B0E14}
.note{font:500 12.5px/1.55 "Zen Kaku Gothic New";color:var(--dim);margin-top:10px}
.err{color:#FF8A7E;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stats span{display:flex;flex-direction:column;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05);font:700 10px "Zen Kaku Gothic New";letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stats b{font:400 22px "Dela Gothic One";color:#FFE9D6;letter-spacing:0}
.stars{font:400 30px "Dela Gothic One";color:var(--amber);letter-spacing:.1em;margin-top:2px}
.stars .off{color:rgba(241,233,221,.16)}
.rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--bg);font:700 16px "Zen Kaku Gothic New";text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){ .rotate{display:flex} }
</style>
</head>
<body>
<div id="three"></div>
<canvas id="fx"></canvas>
<div class="hud" id="hud" hidden>
  <div class="bars"><div class="bar" id="hpBar"><span>TRUCK</span><div><i id="hpI"></i></div></div><div class="bar boost" id="boBar"><span>BOOST</span><div><i id="boI"></i></div></div></div>
  <div class="score" id="score">0<small id="sub"></small></div>
  <div class="mirror" id="mirror" hidden><span>バックカメラ</span></div>
  <div class="callD" id="callD" hidden></div>
  <div class="callG" id="callG" hidden></div>
  <div class="speed" id="speed" hidden></div>
  <div class="ctl" id="ctl" hidden><button data-k="l" aria-label="Steer left">◀</button><button data-k="r" aria-label="Steer right">▶</button><button data-k="boost">BOOST</button></div>
</div>
<div class="count" id="count" hidden></div>
<div class="ui" id="ui"><div class="panel" id="panel"></div></div>
<div class="rotate">Turn your phone sideways · 横にしてね</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ---------- the run: lanes, speeds, and the kana the parade carries ----------
const LANES=[-5.25,-1.75,1.75,5.25], XMAX=5.8, V0=30, V1=42, VBOOST=14, RUN_T=150;
const PHASES=[{t:0,kana:'あいうえお',max:3,every:6.5,traffic:.5},{t:25,kana:'あいうえおかきくけこ',max:5,every:5.2,traffic:.65},
  {t:60,kana:'あいうえおかきくけこさしすせそ',max:6,every:4.4,traffic:.8},{t:100,kana:'あいうえおかきくけこさしすせそたちつてと',max:8,every:3.7,traffic:1}];
const ROMA={あ:'a',い:'i',う:'u',え:'e',お:'o',か:'ka',き:'ki',く:'ku',け:'ke',こ:'ko',さ:'sa',し:'shi',す:'su',せ:'se',そ:'so',た:'ta',ち:'chi',つ:'tsu',て:'te',と:'to',な:'na',に:'ni',ぬ:'nu',ね:'ne',の:'no',
  は:'ha',ひ:'hi',ふ:'fu',へ:'he',ほ:'ho',ま:'ma',み:'mi',む:'mu',め:'me',も:'mo',や:'ya',ゆ:'yu',よ:'yo',ら:'ra',り:'ri',る:'ru',れ:'re',ろ:'ro',わ:'wa',を:'wo',ん:'n'};
const roma=k=>(ROMA[k]||k).toUpperCase();
const phaseAt=t=>PHASES.reduce((p,q)=>t>=q.t?q:p,PHASES[0]);
const store={ get(k,d){ try{ const v=localStorage.getItem('np_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('np_'+k, JSON.stringify(v)); }catch(e){} } };
// the kana's shape stays next to the call until you have hit it three times
const MASTER=store.get('kana',{}); const known=k=>(MASTER[k]||0)>=3; const learn=k=>{ MASTER[k]=(MASTER[k]||0)+1; store.set('kana',MASTER); };

// ---------- sound ----------
let AC=null, MG=null, NOISE=null, ENG=null, engT=0, jaVoice=null;
function audio(){ try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); MG=AC.createGain(); MG.gain.value=.9; MG.connect(AC.destination);
      const n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; NOISE=b; loops(); }
    if(AC.state==='suspended') AC.resume(); }catch(e){}
  try{ if(!audio.warm){ const u=new SpeechSynthesisUtterance(' '); u.volume=0; u.lang='ja-JP'; speechSynthesis.speak(u); audio.warm=1; } }catch(e){} }
function nz(dur,o={}){ if(!AC) return; try{ const t=AC.currentTime+(o.at||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=NOISE; s.loop=true;
  f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+dur); f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.g||.2,t+(o.a||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(f); f.connect(g); g.connect(MG); s.start(t,Math.random()*1.5); s.stop(t+dur+.05); }catch(e){} }
function tn(fr,dur,o={}){ if(!AC) return; try{ const t=AC.currentTime+(o.at||0), s=AC.createOscillator(), g=AC.createGain(); s.type=o.type||'sine'; s.frequency.setValueAtTime(fr,t); if(o.f2) s.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.g||.1,t+(o.a||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(g); g.connect(MG); s.start(t); s.stop(t+dur+.05); }catch(e){} }
function loops(){ // rain, the engine and the wind
  const r=AC.createBufferSource(), hp=AC.createBiquadFilter(), lp=AC.createBiquadFilter(), rg=AC.createGain(); r.buffer=NOISE; r.loop=true; hp.type='highpass'; hp.frequency.value=700; lp.type='lowpass'; lp.frequency.value=3600; rg.gain.value=.035; r.connect(hp); hp.connect(lp); lp.connect(rg); rg.connect(MG); r.start();
  const o1=AC.createOscillator(), o2=AC.createOscillator(), f=AC.createBiquadFilter(), g=AC.createGain(); o1.type='sawtooth'; o2.type='square'; o1.frequency.value=60; o2.frequency.value=30.4; f.type='lowpass'; f.frequency.value=400; g.gain.value=.0001; o1.connect(f); o2.connect(f); f.connect(g); g.connect(MG); o1.start(); o2.start();
  const w=AC.createBufferSource(), wf=AC.createBiquadFilter(), wg=AC.createGain(); w.buffer=NOISE; w.loop=true; wf.type='bandpass'; wf.frequency.value=600; wf.Q.value=.6; wg.gain.value=.0001; w.connect(wf); wf.connect(wg); wg.connect(MG); w.start();
  ENG={o1,o2,f,g,wf,wg}; }
function engineTick(dt,on){ engT-=dt; if(!ENG || engT>0) return; engT=.1; try{ const t=AC.currentTime, sp=CAR.v/(V1+VBOOST), b=CAR.boosting?1:0;
  ENG.g.gain.setTargetAtTime(on?.045+.03*b:.0001,t,.12); ENG.o1.frequency.setTargetAtTime(55+sp*95+b*25,t,.12); ENG.o2.frequency.setTargetAtTime(27.5+sp*47,t,.12); ENG.f.frequency.setTargetAtTime(300+sp*900+b*700,t,.12);
  ENG.wg.gain.setTargetAtTime(on?.018+sp*.05:.0001,t,.2); ENG.wf.frequency.setTargetAtTime(400+sp*1000,t,.2); }catch(e){} }
const SFX={
  shot(){ nz(.08,{type:'highpass',f:2200,g:.16}); tn(220,.1,{type:'triangle',f2:70,g:.18}); }, boom(){ nz(.55,{type:'lowpass',f:1100,f2:120,g:.34}); tn(72,.45,{g:.3,f2:34}); },
  roar(){ nz(.6,{f:520,f2:170,q:2,g:.22}); tn(150,.5,{type:'sawtooth',f2:70,g:.06}); }, crash(){ nz(.35,{type:'highpass',f:900,g:.34}); nz(.55,{type:'lowpass',f:320,g:.32}); tn(58,.32,{type:'square',g:.12}); },
  scrape(){ nz(.25,{f:3400,q:4,g:.12}); }, whoosh(){ nz(.42,{f:500,f2:2600,q:.8,g:.2,a:.07}); }, charm(){ [1319,1760,2093].forEach((f,i)=>tn(f,.5,{g:.06,at:i*.06})); },
  board(){ tn(90,.25,{type:'square',g:.12}); nz(.3,{f:800,q:1,g:.18}); }, knock(){ tn(230,.12,{type:'triangle',g:.16,f2:80}); nz(.12,{type:'lowpass',f:700,g:.2}); },
  call(){ tn(988,.25,{type:'triangle',g:.08}); tn(1480,.35,{type:'triangle',g:.06,at:.08}); }, tick(){ tn(1100,.04,{type:'square',g:.04}); },
  gong(){ tn(196,1.5,{g:.12}); tn(294,1.1,{g:.06}); nz(.4,{type:'lowpass',f:500,g:.07}); }, dawn(){ [523,659,784,1047,1319].forEach((f,i)=>tn(f,1.3,{type:'triangle',g:.07,at:i*.12})); } };
const buzz=ms=>{ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };
function say(k){ if(!k) return; try{ const u=new SpeechSynthesisUtterance(k); u.lang='ja-JP'; u.rate=.9; if(!jaVoice) jaVoice=speechSynthesis.getVoices().find(v=>/^ja/i.test(v.lang))||null; if(jaVoice) u.voice=jaVoice;
  if(speechSynthesis.speaking||speechSynthesis.pending) speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }

// ---------- state ----------
// MODE 'bot' | 'net'; ROLE 'driver' | 'gunner'. The driving phone owns the truck and the traffic; the gunner's phone owns the yokai.
let MODE='', ROLE='', RUN=null, IS_HOST=false, ID=0, clock=0;
const CAR={x:0, vx:0, v:24, boost:1, boosting:false, hp:100, dist:0, crashT:0, xT:0};
let TRAFFIC=[], CHARMS=[], YOKAI=[], BOARD=[], CALL=null, DYING=[];
const carHere=()=>!RUN || ROLE==='driver' || MODE==='bot', yokaiHere=()=>RUN && (ROLE==='gunner' || MODE==='bot');
const FX={shake:0, pops:[], shots:[], recoil:0};
let tSpawn=0, cSpawn=6, ySpawn=1, callT=5;
function resetWorld(){ Object.assign(CAR,{x:0,vx:0,v:V0,boost:1,boosting:false,hp:100,dist:0,crashT:0,xT:0}); TRAFFIC=[]; CHARMS=[]; YOKAI=[]; BOARD=[]; CALL=null; DYING=[]; tSpawn=0; cSpawn=6; ySpawn=.8; callT=4.5; FX.pops=[]; FX.shots=[]; }
function hurt(n){ if(!RUN || RUN.ph!=='run') return; FX.shake=Math.max(FX.shake, n>10?.9:.45);
  if(carHere()){ CAR.hp=Math.max(0,CAR.hp-n); if(CAR.hp<=0) endRun(false); } else sendEvt({t:'dmg', n}); }
const score=()=>{ const s=RUN?RUN.s:null; return s ? s.kscore+s.near*20+s.charms*30+Math.floor(CAR.dist/20) : 0; };

// ---------- the truck and the traffic (the driving phone) ----------
const CAR_COLS=[0x2B3A55,0x7A1F1F,0xC9CDD2,0x1E1E22,0x3D5C4A,0x8A6A2F,0xE6E1D3,0x4A3A6A];
const IN={btn:{}, keys:{}};
function driveInput(){ if(!RUN || (MODE==='bot' && ROLE==='gunner')) return {steer:BOTD.steer, boost:BOTD.boost};
  const B=IN.btn, k=IN.keys; return {steer:((B.r||k.arrowright||k.d)?1:0)-((B.l||k.arrowleft||k.a)?1:0), boost:!!(B.boost||k[' ']||k.shift||k.arrowup||k.w)}; }
function stepCar(dt){ const t=RUN?RUN.t:0, ph=phaseAt(t), inp=driveInput(), live=RUN && RUN.ph==='run';
  const pull=BOARD.reduce((s,b)=>s+b.side*2.6,0);
  CAR.vx+=(inp.steer*11+pull-CAR.vx)*Math.min(1,dt*7); CAR.x+=CAR.vx*dt;
  if(Math.abs(CAR.x)>XMAX){ CAR.x=Math.sign(CAR.x)*XMAX; if(Math.abs(CAR.vx)>5 && live){ hurt(3); SFX.scrape(); sparks(CAR.x,.6,0,8); } CAR.vx*=-.3; }
  const base=V0+(V1-V0)*clamp(t/RUN_T,0,1)-(RUN?0:6);
  CAR.boosting=inp.boost && CAR.boost>.02 && live;
  CAR.boost=CAR.boosting?Math.max(0,CAR.boost-dt*.3):Math.min(1,CAR.boost+dt*.04);
  const want=base+(CAR.boosting?VBOOST:0)-(CAR.crashT>0?15:0); CAR.v+=(want-CAR.v)*Math.min(1,dt*(CAR.v<want?1.4:3));
  if(live) CAR.dist+=CAR.v*dt; if(CAR.crashT>0) CAR.crashT-=dt;
  tSpawn-=dt; if(tSpawn<=0){ spawnTraffic(base); tSpawn=(1.5-ph.traffic*.8)*rnd(.7,1.3); }
  for(const c of TRAFFIC){ const pz=c.z; c.z+=(CAR.v-c.v)*dt; if(c.spin) c.x+=c.spin*dt*3;
    const len=c.type==='truck'?3.6:2.1, w=c.type==='truck'?1.15:.95;
    if(!c.hit && Math.abs(c.z)<len+2.1 && Math.abs(c.x-CAR.x)<w+.95) crash(c, live);
    if(!c.near && !c.hit && pz<0 && c.z>=0 && Math.abs(c.x-CAR.x)<3.3 && live){ c.near=true; RUN.s.near++; CAR.boost=Math.min(1,CAR.boost+.14); SFX.whoosh(); pop('ニアミス！','#5BE0FF'); } }

    <p class="lead">2 a.m. on the Shuto Expressway. A parade of yokai is chasing your truck. One of you drives. The other rides in the back and fires お札 at the yokai, but only at the one whose kana gets called.</p>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <div class="row"><button class="btn red" data-a="friend">Play with a friend</button><button class="btn ghost" data-a="practice">Practice with しばBot</button></div>`); }
function friendUI(msg){ ui(`<div class="kicker">Play with a friend</div><h2>Ride together</h2><p class="lead">One of you creates a room and picks a seat. The other types the code.</p>${msg?`<p class="err">${esc(msg)}</p>`:''}
  <div class="row"><button class="btn red" data-a="create">Create a room</button><input class="codein" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" aria-label="Room code"><button class="btn" data-a="join">Join</button></div>
  <div class="row"><button class="btn ghost" data-a="lobby">Back</button></div>`); }
function roomUI(){ ui(`<div class="kicker">Room · ${esc(NET.kind)}</div><div class="code">${esc(NET.code)}</div>
  <p class="lead">${guestHere?`Your friend is here. You ${ROLE==='driver'?'drive, they shoot':'shoot, they drive'}. Ready?`:`Send this code to your friend. You're the <b>${ROLE==='driver'?'Driver':'Gunner'}</b>; they'll be the ${ROLE==='driver'?'Gunner':'Driver'}.`}</p>
  <div class="row">${guestHere?'<button class="btn red" data-a="start">Hit the road</button>':'<span class="note">Waiting for your friend…</span>'}<button class="btn ghost" data-a="lobby">Leave</button></div>`); }
function guestUI(){ ui(`<div class="kicker">Room · ${esc(NET.kind)}</div><h2>${ROLE?(ROLE==='driver'?'You drive':'You shoot'):'Connected'}</h2><p class="lead">${ROLE?'The host starts the run.':'Waiting for the host…'}</p><div class="row"><button class="btn ghost" data-a="lobby">Leave</button></div>`); }
function newRun(){ const first=!store.get('seen_'+ROLE,false); store.set('seen_'+ROLE,true); initThree();
  RUN={ph:'count', cd:first?7:4, t:0, s:{kills:0,wrong:0,combo:0,best:0,kscore:0,near:0,charms:0,crashes:0}, win:false, shown:false};
  resetWorld(); hideUI(); $('#hud').hidden=false; IN.btn={};
  const c=$('#count'); c.hidden=false; c.innerHTML=`<div><h3>${ROLE==='driver'?'YOU DRIVE · 運転':'YOU SHOOT · 射手'}</h3><ol>${STEPS[ROLE].map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div><div class="n" id="cdN"></div>`; }
function endRun(win){ if(!RUN || RUN.ph!=='run') return; RUN.ph='over'; RUN.win=win; CALL=null;
  if(MODE==='net' && ROLE==='driver') sendEvt({t:'over', win, s:RUN.s, d:Math.round(CAR.dist)});
  if(win) SFX.dawn(); else { SFX.crash(); FX.shake=1.2; } setTimeout(results, win?1500:1000); }
function results(){ if(!RUN || RUN.shown) return; RUN.shown=true; const s=RUN.s, sc=score(), key='best_'+MODE+'_'+ROLE, best=Math.max(store.get(key,0),sc); store.set(key,best);
  const stars=(RUN.win?1:0)+(sc>=4000?1:0)+(sc>=7000?1:0), again=MODE==='bot'||IS_HOST?'<button class="btn red" data-a="again">Run it again</button>':'<span class="note">The host can start the next run.</span>';
  $('#hud').hidden=true;
  ui(`<div class="kicker">${RUN.win?'夜明け · Dawn':'大破 · Wrecked'}</div><h2>${RUN.win?'逃げ切った！':'やられた…'}</h2><div class="stars">${'★'.repeat(stars)}<span class="off">${'★'.repeat(3-stars)}</span></div>
    <div class="stats"><span>Score<b>${sc}</b></span><span>退治<b>${s.kills}</b></span><span>ちがう<b>${s.wrong}</b></span><span>Distance<b>${(CAR.dist/1000).toFixed(1)}km</b></span></div>
    <p class="note">ニアミス ${s.near} · お守り ${s.charms} · best combo ×${s.best}. Your best as ${ROLE==='driver'?'driver':'gunner'}${MODE==='bot'?' with しばBot':''}: ${best}</p>
    <div class="row">${again}<button class="btn ghost" data-a="lobby">Lobby</button></div>`); }
document.addEventListener('click', async e=>{ const b=e.target.closest('button'); if(!b || !b.dataset.a) return; audio(); const a=b.dataset.a;
  if(a==='practice') return ui(`<div class="kicker">Practice with しばBot</div><h2>Pick your seat</h2><p class="lead">しばBot takes the other seat so you can learn yours. The real fun is with a friend.</p>${ROLE_CARDS('p')}<div class="row"><button class="btn ghost" data-a="lobby">Back</button></div>`);
  if(a==='pdriver'||a==='pgunner'){ MODE='bot'; ROLE=a==='pdriver'?'driver':'gunner'; newRun(); return; }
  if(a==='friend') return friendUI();
  if(a==='create') return ui(`<div class="kicker">Create a room</div><h2>Your seat?</h2>${ROLE_CARDS('h')}<div class="row"><button class="btn ghost" data-a="friend">Back</button></div>`);
  if(a==='hdriver'||a==='hgunner'){ ROLE=a==='hdriver'?'driver':'gunner'; ui('<h2>Opening a room…</h2>'); let r, code;
    for(let i=0;i<4;i++){ code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''); r=await netHost(code); if(r!=='taken') break; }
    if(r!==true) return friendUI(r||'Online play is not available here.'); MODE='net'; IS_HOST=true; roomUI(); return; }
  if(a==='join'){ const code=($('#codeIn').value||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(code)) return friendUI('Type the 4-character code.');
    ROLE=''; IS_HOST=false; ui('<h2>Joining…</h2>'); const r=await netJoin(code); if(r!==true) return friendUI(r); MODE='net'; if(!RUN) guestUI(); return; }
  if(a==='start'||a==='again'){ if(MODE==='net'){ if(!IS_HOST) return; sendEvt({t:'start'}); } newRun(); return; }
  if(a==='lobby'){ try{ NET && NET.peer && NET.peer.destroy(); NET && NET.room && NET.room.leave(); }catch(x){} location.reload(); } });

// ---------- online: claude.ai room inside claude.ai, PeerJS anywhere else ----------
// each phone streams a snapshot of what it owns ~10× a second; one-off events (damage, kills, start, over) are numbered so none get lost
let NET=null, guestHere=false, snapT=0, flushAt=0, flushQ=false;
async function roomApi(){ try{ return window.claude && claude.use ? await claude.use('room') : null; }catch(e){ return null; } }
function onGuest(){ guestHere=true; sendEvt({t:'hello', role:ROLE}); if(!RUN || RUN.ph==='over') roomUI(); }
function flush(){ if(!NET || !NET.room) return; const now=performance.now(); const go=()=>{ flushAt=performance.now(); NET.room.presence({role:IS_HOST?'host':'guest', snap:NET.snap||null, out:NET.out}).catch(()=>{}); };
  if(now-flushAt>140) go(); else if(!flushQ){ flushQ=true; setTimeout(()=>{ flushQ=false; go(); },150); } }
function sendSnap(s){ if(!NET) return; if(NET.peer){ if(NET.conn && NET.conn.open) NET.conn.send({s}); } else { NET.snap=s; flush(); } }
function sendEvt(m){ if(!NET) return; if(NET.peer){ if(NET.conn && NET.conn.open) NET.conn.send({e:m}); } else { NET.outN++; NET.out.push({n:NET.outN, m}); if(NET.out.length>40) NET.out.shift(); flush(); } }
function onData(d){ if(!d) return; if(d.e) onEvt(d.e); if(d.s) onSnap(d.s); }
function onPresence(p){ if(!p) return; if(p.out) for(const x of p.out) if(x.n>NET.inN){ NET.inN=x.n; onEvt(x.m); } if(p.snap) onSnap(p.snap); }
function onEvt(m){
  if(m.t==='hello'){ ROLE=m.role==='driver'?'gunner':'driver'; if(!RUN) guestUI(); return; }
  if(m.t==='start'){ if(ROLE) newRun(); return; }
  if(!RUN) return;
  if(m.t==='dmg' && ROLE==='driver'){ CAR.hp=Math.max(0,CAR.hp-m.n); FX.shake=Math.max(FX.shake,.6); if(CAR.hp<=0) endRun(false); return; }
  if(m.t==='kill' && ROLE==='driver'){ DYING.push({id:-(++ID), x:m.x, z:m.z, k:m.k, look:m.look, dt:0}); burstAt(m.x,2.2,m.z,0x7FD8FF,18); SFX.boom(); return; }
  if(m.t==='over' && ROLE==='gunner'){ Object.assign(RUN.s,{near:m.s.near,charms:m.s.charms,crashes:m.s.crashes}); CAR.dist=m.d; RUN.ph='run'; endRun(m.win); } }
// the other phone's objects keep moving between snapshots, then ease toward the true positions
function onSnap(s){ if(!RUN) return;
  if(s.t==='car' && ROLE==='gunner'){ CAR.xT=s.x; CAR.vx=s.vx; CAR.v=s.v; CAR.boost=s.b; CAR.boosting=!!s.bo; CAR.hp=s.hp; CAR.dist=s.d; if(s.cr>CAR.crashT+.3){ FX.shake=Math.max(FX.shake,.9); SFX.crash(); } CAR.crashT=s.cr;
    TRAFFIC=s.tr.map(a=>{ const o=TRAFFIC.find(c=>c.id===a[0]); return o?Object.assign(o,{x:a[1],z:o.z+(a[2]-o.z)*.5,v:a[3],hit:!!a[6]}):{id:a[0],x:a[1],z:a[2],v:a[3],type:a[4]?'truck':'car',ci:a[5],hit:!!a[6],spin:a[6]?.5:0}; });
    CHARMS=s.ch.map(a=>{ const o=CHARMS.find(c=>c.id===a[0]); return o?Object.assign(o,{x:a[1],z:o.z+(a[2]-o.z)*.5}):{id:a[0],x:a[1],z:a[2]}; });
    Object.assign(RUN.s,{near:s.s.near,charms:s.s.charms,crashes:s.s.crashes}); }
  if(s.t==='yk' && ROLE==='driver'){ YOKAI=s.y.map(a=>{ const o=YOKAI.find(y=>y.id===a[0]); const st=a[4]?'charge':'calm'; return o?Object.assign(o,{x:o.x+(a[2]-o.x)*.5,z:o.z+(a[3]-o.z)*.5,st,vrel:a[6],tx:a[2]}):{id:a[0],k:a[1],x:a[2],tx:a[2],z:a[3],st,look:a[5],vrel:a[6]}; });
    BOARD=s.bd.map(a=>({id:a[0],k:a[1],side:a[2],hp:a[3],look:a[4],board:true}));
    const nc=s.call?{id:s.call[0],k:s.call[1],t:s.call[2],warn:s.call[3]}:null; if(nc && (!CALL || CALL.id!==nc.id)){ SFX.call(); setTimeout(()=>say(nc.k),130); } CALL=nc;
    Object.assign(RUN.s,{kills:s.s.kills,wrong:s.s.wrong,combo:s.s.combo,best:s.s.best,kscore:s.s.kscore}); } }
function netTick(dt){ if(MODE!=='net' || !NET || !RUN) return; snapT-=dt; if(snapT>0) return; snapT=NET.room?.15:.1;
  if(ROLE==='driver') sendSnap({t:'car', x:+CAR.x.toFixed(2), vx:+CAR.vx.toFixed(2), v:+CAR.v.toFixed(2), b:+CAR.boost.toFixed(2), bo:CAR.boosting?1:0, hp:Math.round(CAR.hp), d:Math.round(CAR.dist), cr:+CAR.crashT.toFixed(2),
    tr:TRAFFIC.map(c=>[c.id,+c.x.toFixed(2),+c.z.toFixed(1),+c.v.toFixed(1),c.type==='truck'?1:0,c.ci,c.hit?1:0]), ch:CHARMS.map(c=>[c.id,+c.x.toFixed(2),+c.z.toFixed(1)]), s:{near:RUN.s.near,charms:RUN.s.charms,crashes:RUN.s.crashes}});
  else sendSnap({t:'yk', y:YOKAI.map(q=>[q.id,q.k,+q.x.toFixed(2),+q.z.toFixed(1),q.st==='charge'?1:0,q.look,+q.vrel.toFixed(1)]), bd:BOARD.map(b=>[b.id,b.k,b.side,b.hp,b.look]),
    call:CALL?[CALL.id,CALL.k,+CALL.t.toFixed(2),CALL.warn]:null, s:{kills:RUN.s.kills,wrong:RUN.s.wrong,combo:RUN.s.combo,best:RUN.s.best,kscore:RUN.s.kscore}}); }
async function netHost(code){ const R=await roomApi();
  if(R){ const room=await R.join('night-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room, out:[], outN:0, inN:0}; flush();
    room.onPeers(ch=>{ const gp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='guest'); if(gp && !guestHere) onGuest(); if(gp) onPresence(gp.presence); }); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer('kotoba-night-'+code.toLowerCase(), {debug:0}); NET={kind:'online', code, peer};
    peer.on('open', ()=>res(true)); peer.on('error', e=>res(e.type==='unavailable-id' ? 'taken' : 'Could not open a room: '+e.type));
    peer.on('connection', c=>{ NET.conn=c; c.on('open', onGuest); c.on('data', onData); c.on('close', ()=>{ guestHere=false; }); }); }); }
async function netJoin(code){ const R=await roomApi();
  if(R){ const room=await R.join('night-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room, out:[], outN:0, inN:0}; flush();
    room.onPeers(ch=>{ const hp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='host'); if(hp) onPresence(hp.presence); }); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer({debug:0}); NET={kind:'online', code, peer}; let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; res('No room with that code (or the connection is blocked).'); } }, 12000);
    peer.on('error', e=>{ if(!done){ done=true; clearTimeout(t); res(e.type==='peer-unavailable' ? 'No room with that code.' : 'Connection problem: '+e.type); } });
    peer.on('open', ()=>{ const c=peer.connect('kotoba-night-'+code.toLowerCase(), {reliable:true}); NET.conn=c;
      c.on('open', ()=>{ if(!done){ done=true; clearTimeout(t); res(true); } }); c.on('data', onData); }); }); }

// ---------- main loop ----------
let last=0;
function frame(now){ requestAnimationFrame(frame); const dt=last?Math.min(.05,(now-last)/1000):.016; last=now; clock+=dt;
  if(RUN && RUN.ph==='count'){ const before=Math.ceil(RUN.cd); RUN.cd-=dt; const n=Math.ceil(RUN.cd); if(n!==before && RUN.cd>0) SFX.tick(); const el=$('#cdN'); if(el && el.textContent!==String(Math.max(1,n))) el.textContent=String(Math.max(1,n));
    if(RUN.cd<=0){ RUN.ph='run'; $('#count').hidden=true; SFX.gong(); } }
  const run=RUN && RUN.ph==='run';
  if(!RUN || run || RUN.ph==='count'){
    if(carHere()){ if(!RUN || (MODE==='bot' && ROLE==='gunner')) botDriver(dt); stepCar(dt); }
    else { CAR.x+=(CAR.xT-CAR.x)*Math.min(1,dt*12); for(const c of TRAFFIC) c.z+=(CAR.v-c.v)*dt; for(const ch of CHARMS) ch.z+=CAR.v*dt; } }
  if(run){ RUN.t+=dt;
    if(yokaiHere()){ stepYokai(dt); if(MODE==='bot' && ROLE==='driver') botGunner(dt); }
    else for(const y of YOKAI){ y.z+=(y.vrel||0)*dt; }
    if(carHere() && RUN.t>=RUN_T) endRun(true);
    netTick(dt); }
  if(R3) draw3(dt);
  drawFX(dt); hudTick(); engineTick(dt, !!R3); }
requestAnimationFrame(frame);
lobbyUI();
// build the 3D scene once the fonts are in, so signs and lanterns draw with them
Promise.race([document.fonts ? Promise.all(['400 40px "Dela Gothic One"','400 40px "Yuji Syuku"','700 20px "Zen Kaku Gothic New"'].map(f=>document.fonts.load(f,'渋谷新宿らーめんカラオケあいうえお守札'))) : Promise.resolve(), new Promise(r=>setTimeout(r,2500))]).then(initThree);
window.__night={ RUN:()=>RUN, CAR, T:()=>TRAFFIC, CH:()=>CHARMS, Y:()=>YOKAI, B:()=>BOARD, CALL:()=>CALL, role:()=>ROLE, mode:()=>MODE, IN, three:()=>R3,
  shoot:id=>{ const t=YOKAI.find(y=>y.id===id)||BOARD.find(b=>b.id===id); shootTarget(t); }, scrY:id=>{ const y=YOKAI.find(q=>q.id===id); return y?scrOf(y.x,2.9,y.z):null; }, scrB:i=>{ const b=BOARD[i]; return b?scrOf(CAR.x+b.side*.62,1.6,3.5):null; },
  car:(x,z,lane)=>{ TRAFFIC.push({id:++ID, x:x, z, v:CAR.v*.5, type:'car', ci:0, near:false, hit:false, spin:0}); }, charm:(x,z)=>CHARMS.push({id:++ID,x,z}),
  yokai:(k,z,st)=>{ const y={id:++ID,k,x:CAR.x,tx:CAR.x,tt:9,z,hold:z,vrel:0,st:st||'calm',t:0,look:0}; YOKAI.push(y); return y.id; }, call:id=>{ const y=YOKAI.find(q=>q.id===id); CALL={id,k:y.k,t:0,warn:3}; } };
})();
</script>
