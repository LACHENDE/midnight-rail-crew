<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#05070D">
<title>夜ふかし · Up All Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 夜ふかし Up All Night: one link for two players. Pair once with a room code, then play the three games back to back.
   This page holds the only connection (PeerJS). Each game runs in a frame and talks to its partner through window.HUBAPI. */
:root{ --bg:#05070D; --ink:#F1E9DD; --dim:#A9A29A; --line:rgba(241,233,221,.14); --red:#E0352B; --amber:#FF9A4D; --green:#7EE08A;
  --ui:"Zen Kaku Gothic New",system-ui,sans-serif; }
:root[lang=zh]{ --ui:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
body{overflow:hidden;-webkit-user-select:none;user-select:none}
button,input{font-family:inherit;touch-action:manipulation}
[hidden]{display:none!important}
#app{position:fixed;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top) + 10px) max(16px,env(safe-area-inset-right)) calc(env(safe-area-inset-bottom) + 12px) max(16px,env(safe-area-inset-left));
  background:radial-gradient(120% 90% at 88% -10%,rgba(224,53,43,.17),transparent 55%),radial-gradient(90% 80% at -5% 105%,rgba(91,224,255,.08),transparent 60%),var(--bg)}
:root[lang=zh] h2{font-family:var(--ui);font-weight:900;letter-spacing:.02em}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.07;mix-blend-mode:overlay;z-index:1}
.top{display:flex;align-items:center;gap:10px;min-height:34px}
.brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.brand b{font:400 22px "Dela Gothic One";letter-spacing:.04em;color:#FFE9D6}
.brand span{font:900 10px var(--ui);letter-spacing:.3em;color:var(--amber);text-transform:uppercase}
.names{display:flex;align-items:center;gap:6px;font:700 13px var(--ui);color:var(--dim);min-width:0}
.names input{width:7.5em;font:900 13px var(--ui);color:var(--ink);background:transparent;border:0;border-bottom:1px dashed rgba(241,233,221,.3);padding:2px 0;-webkit-user-select:text;user-select:text}
.names b{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:9em}
.names .heart{color:var(--red)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;font:900 11px var(--ui);letter-spacing:.06em;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green)}
.pill.down i{background:var(--amber);box-shadow:0 0 8px var(--amber);animation:blink .8s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.lang{font:900 12px var(--ui);color:var(--ink);background:transparent;border:0;box-shadow:inset 0 0 0 1px rgba(241,233,221,.3);border-radius:999px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.lang em{font-style:normal;color:var(--dim)}
.lang b{color:var(--amber)}
.kicker{font:900 11px var(--ui);letter-spacing:.34em;color:var(--amber);text-transform:uppercase}
h1{margin:4px 0 0;font:400 clamp(46px,9vh,74px)/1 "Dela Gothic One";letter-spacing:.04em;color:#FFE9D6;text-shadow:0 0 30px rgba(224,53,43,.45)}
h2{margin:6px 0 6px;font:400 26px/1.15 "Dela Gothic One";color:#FFE9D6}
.sub{font:400 18px "Yuji Syuku";color:#C9C2B8;margin-top:2px;letter-spacing:.12em}
.lead{margin:10px 0 12px;font:500 14px/1.65 var(--ui);color:#C9C2B8;max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{font:900 14px var(--ui);letter-spacing:.06em;color:#0B0E14;background:var(--ink);border:0;border-radius:8px;padding:12px 18px;cursor:pointer;white-space:nowrap}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(241,233,221,.35)}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.45}
input.codein{font:400 22px "Dela Gothic One";letter-spacing:.2em;text-transform:uppercase;width:128px;padding:9px 12px;border-radius:8px;border:0;background:var(--ink);color:#0B0E14;-webkit-user-select:text;user-select:text}
label.nm{display:flex;align-items:center;gap:10px;font:700 12px var(--ui);color:var(--dim);letter-spacing:.08em}
label.nm input{font:900 15px var(--ui);color:var(--ink);background:rgba(255,255,255,.05);border:0;box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:9px 12px;width:12em;-webkit-user-select:text;user-select:text}
.note{font:500 12.5px/1.55 var(--ui);color:var(--dim)}
.err{color:#FF8A7E;font-weight:900}
.small{font:700 12px var(--ui);color:var(--dim)}
.small a{color:var(--ink);text-decoration:none;box-shadow:inset 0 -1px 0 rgba(241,233,221,.35);margin:0 2px}
/* welcome: words on the left, the three games on the right */
.wel{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:center;min-height:100%}
.collage{position:relative;height:min(64vh,300px)}
.solo{text-align:right;margin:14px 0 0}
.collage div{position:absolute;width:62%;aspect-ratio:16/9;border-radius:10px;background:#111 center/cover;box-shadow:0 14px 34px rgba(0,0,0,.6),0 0 0 1px rgba(241,233,221,.12)}
.collage div b{position:absolute;left:10px;bottom:6px;font:400 16px "Dela Gothic One";color:#FFE9D6;text-shadow:0 2px 8px #000}
.collage .c0{left:2%;top:4%;transform:rotate(-5deg)}
.collage .c1{right:0;top:30%;transform:rotate(4deg);z-index:2}
.collage .c2{left:10%;bottom:0;transform:rotate(-1.5deg);z-index:3}
/* pairing */
.pair{max-width:620px;margin:auto;padding-top:6px}
.code{font:400 54px "Dela Gothic One";letter-spacing:.24em;color:var(--amber);line-height:1.1}
.link{font:700 12px var(--ui);color:var(--dim);background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 1px var(--line);border-radius:8px;padding:8px 10px;word-break:break-all;-webkit-user-select:text;user-select:text}
.spin{display:inline-block;width:12px;height:12px;border-radius:50%;border:2px solid var(--amber);border-right-color:transparent;animation:rot .8s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes rot{to{transform:rotate(360deg)}}
/* the menu: three games, then tonight */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:10px}
.gc{border-radius:12px;overflow:hidden;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column}
.gc.last{box-shadow:inset 0 0 0 1px rgba(255,154,77,.55)}
.th{position:relative;aspect-ratio:16/8;background:#0B0F18 center/cover no-repeat}
.th .jp{position:absolute;left:12px;bottom:22px;font:400 22px "Dela Gothic One";color:#FFE9D6;text-shadow:0 2px 10px #000;letter-spacing:.03em}
.th>span{position:absolute;left:12px;bottom:6px;font:900 10px var(--ui);letter-spacing:.24em;color:var(--amber);text-transform:uppercase}
.th .st{position:absolute;right:10px;top:8px;font:400 15px "Dela Gothic One";color:var(--amber);font-style:normal;text-shadow:0 1px 6px #000}
.th .st em{font-style:normal;color:rgba(241,233,221,.25)}
.bd{padding:9px 12px 12px;display:flex;flex-direction:column;gap:8px;flex:1}
.bd p{margin:0;font:500 12px/1.5 var(--ui);color:var(--dim)}
.seats{display:flex;align-items:center;gap:8px;font:700 12.5px var(--ui);color:var(--ink);margin-top:auto}
.seats span{flex:1;min-width:0}
.seats .sw{flex:none;width:34px;height:30px;border-radius:8px;border:0;background:rgba(255,255,255,.07);box-shadow:inset 0 0 0 1px var(--line);color:var(--ink);font:900 15px var(--ui);cursor:pointer}
.play{width:100%}
.tonight{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:12px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.035);box-shadow:inset 0 0 0 1px var(--line)}
.tonight .k{font:900 10px var(--ui);letter-spacing:.3em;color:var(--amber);text-transform:uppercase;margin-right:4px}
.tonight b{font:400 18px "Dela Gothic One";color:#FFE9D6;margin-right:10px}
.tonight .rec{font:700 12px var(--ui);color:var(--dim);flex:1}
/* the game frame and the connection overlay */
#stage{position:fixed;inset:0;z-index:5;background:#000}
#stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#netOv{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:rgba(5,7,13,.78);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);padding:20px;text-align:center}
#netOv .n{font:400 96px "Dela Gothic One";color:#FFE9D6;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);z-index:12;font:900 13px var(--ui);background:var(--ink);color:#0B0E14;border-radius:999px;padding:9px 16px;opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}
#toast.on{opacity:1}
@media (max-height:420px){ .lead{margin:6px 0 8px;font-size:13px;max-width:52ch} label.nm input{padding:7px 10px} .wel .row{margin-top:8px} .bd p{display:none} .th{aspect-ratio:16/7} h1{font-size:50px} .code{font-size:44px} }
@media (orientation:portrait),(max-width:640px){ .wel{grid-template-columns:1fr} .collage{height:220px} .cards{grid-template-columns:1fr} .th{aspect-ratio:16/7} .bd p{display:block} }
</style>
</head>
<body>
<main id="app"></main>
<div id="grain"></div>
<div id="stage" hidden></div>
<div id="netOv" hidden></div>
<div id="toast"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const now=()=>performance.now();
const LS={ get(k,d){ try{ const v=localStorage.getItem('yofu_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('yofu_'+k, JSON.stringify(v)); }catch(e){} }, del(k){ try{ localStorage.removeItem('yofu_'+k); }catch(e){} } };

// ---------- language: each phone picks its own, and the games read the same setting ----------
let LANG=LS.get('lang', /^zh/i.test(navigator.language||'')?'zh':'en');
const T=(en,zh)=>LANG==='zh'?zh:en;
const setLangAttr=()=>{ document.documentElement.lang=LANG==='zh'?'zh':'en'; };
setLangAttr();

// ---------- the three games: seats[g]==='h' means the host takes the first role ----------
const GAMES=[
  {id:'night', path:'night/', jp:'百鬼夜行', en:'Night Parade', zh:'百鬼夜行', roles:['driver','gunner'],
   vb:{driver:['drive','drives','开车'], gunner:['shoot','shoots','射击']},
   line:['Car chase on the expressway. One drives through traffic; one shoots the yokai carrying the called kana.','高速公路上的飙车。一人开车躲避车流，一人射击提着被点名假名的妖怪。']},
  {id:'restaurant', path:'../midnight-restaurant/', jp:'まよなか屋', en:'Midnight Restaurant', zh:'午夜拉面摊', roles:['cook','counter'],
   vb:{cook:['cook','cooks','煮面'], counter:['run the counter','runs the counter','管柜台']},
   line:['A little ramen stall on a rainy night. One cooks; one seats the guests, hears their orders in Japanese and serves.','雨夜里的小拉面摊。一人煮面，一人招呼客人、听日语点单、上菜。']},
  {id:'tunnels', path:'tunnels/', jp:'真夜中の地下鉄', en:'Midnight Subway', zh:'午夜地铁', roles:['driver','nav'],
   vb:{driver:['drive','drives','开车'], nav:['route','routes','指挥路线']},
   line:['The last train under Tokyo. One drives and reads the tickets; one throws the switches on the map.','东京地下的末班车。一人开车读车票，一人在地图上扳道岔。']}];
const GI=Object.fromEntries(GAMES.map(g=>[g.id,g]));
const gName=g=>T(GI[g].en, GI[g].zh);
const freshHS=()=>({v:0, scr:'menu', g:null, sid:0, seats:{night:'h', restaurant:'g', tunnels:'g'}, night:{id:'', games:[]}});
let HS=freshHS(), GOT_ST=false;
const roleOf=(g,side)=>GI[g].roles[HS.seats[g]===side?0:1];

// ---------- names (optional; only your partner sees them) ----------
const myName=()=>String(LS.get('name','')||'').slice(0,12);
const names=()=>({me:T('You','你'), mine:myName(), partner:L.pname||T('Partner','搭档')});

// ---------- the link: one PeerJS data connection, numbered messages that survive a reconnect ----------
// The host registers kotoba-yofu-<code>-h; the guest dials it (and dials again whenever the link drops).
// Reliable messages carry q (1, 2, 3…) and wait in outQ until the partner's heartbeat acknowledges them.
const PFX='kotoba-yofu-';
const L={peer:null, conn:null, up:false, everUp:false, lastRx:0, tx:0, rx:0, outQ:[], inst:Math.random().toString(36).slice(2,10), pinst:null, pname:'',
  code:'', side:'', dialing:false, dialT:0, reconT:0, err:'', mute:0, opened:false, tries:0};
const hostId=c=>PFX+c.toLowerCase()+'-h';
function lraw(m){ if(L.conn && L.conn.open){ try{ L.conn.send(m); }catch(e){} } }
function lsend(m, rel){ if(rel){ m.q=++L.tx; L.outQ.push(m); if(L.outQ.length>600) L.outQ.shift(); } lraw(m); }
function onRaw(m){ if(!m || typeof m!=='object' || now()<L.mute) return; L.lastRx=now();
  if(m.t==='hi'){ onHi(m); return; }
  if(!L.up && L.pinst) linkUp();
  if(m.t==='hb'){ while(L.outQ.length && L.outQ[0].q<=m.a) L.outQ.shift(); return; }
  if(m.q!=null){ if(m.q<=L.rx) return; if(m.q>L.rx+1){ lraw({t:'rs'}); return; } L.rx=m.q; }
  route(m); }
function onHi(m){ const fresh=!!L.pinst && L.pinst!==m.inst;
  L.pinst=m.inst; L.pname=String(m.name||'').slice(0,12);
  // the partner's page reloaded: number from 1 again, and drop what was meant for the old page
  if(fresh){ L.rx=0; L.tx=0; L.outQ=[]; }
  linkUp(); L.outQ.forEach(lraw);
  if(L.side==='h'){ if(fresh && HS.scr==='game'){ HS.scr='menu'; HS.v++; saveHS(); } lsend({t:'st', st:HS}, true); }
  render(); }
function route(m){
  if(m.t==='st'){ if(L.side!=='g') return; HS=m.st; HS.seats=Object.assign(freshHS().seats, HS.seats); GOT_ST=true; tally();
    if(LEFT_SID && HS.scr==='game' && HS.sid===LEFT_SID) request('menu'); else if(HS.scr==='menu' || HS.sid!==LEFT_SID) LEFT_SID=0;
    render(); return; }
  if(m.t==='req'){ if(L.side==='h') apply(m.a, m.arg); return; }
  if(m.t==='g'){ deliverGame(m.sid, m.d); return; }
  if(m.t==='nm'){ L.pname=String(m.name||'').slice(0,12); render(); return; }
  if(m.t==='rs'){ L.outQ.forEach(lraw); return; }
  if(m.t==='bye'){ toast(T(`${names().partner} ended the night`,`${names().partner} 结束了今晚`)); leave(true); } }
function linkUp(){ if(L.up) return; L.up=true; L.everUp=true; L.err=''; saveSess(); netOv(); pill();
  // you went back to the menu while the link was down: take your partner there too
  if(LEFT_SID && L.side==='g' && HS.scr==='game' && HS.sid===LEFT_SID) request('menu'); }
function linkDown(){ if(!L.up) return; L.up=false; netOv(); pill(); }
function adopt(c){ if(L.conn && L.conn!==c){ try{ L.conn.close(); }catch(e){} }
  L.conn=c; L.dialing=false; L.lastRx=now();
  c.on('data', d=>{ if(L.conn===c) onRaw(d); });
  c.on('close', ()=>{ if(L.conn===c){ L.conn=null; linkDown(); } });
  c.on('error', ()=>{});
  lraw({t:'hi', inst:L.inst, name:myName(), v:1}); }
function newPeer(){ const host=L.side==='h'; try{ L.peer && L.peer.destroy(); }catch(e){}
  if(!window.Peer){ fail(T('The connection library did not load. Check the internet (or the VPN) and reload.','联机组件没有加载。请检查网络（或 VPN）后刷新。')); return; }
  const P=new Peer(host?hostId(L.code):undefined, {debug:0}); L.peer=P; L.opened=false;
  P.on('open', ()=>{ if(L.peer!==P) return; L.opened=true; L.tries=0; if(host) render(); else dial(); });
  P.on('connection', c=>{ if(!host || L.peer!==P) return; c.on('open', ()=>adopt(c)); });
  P.on('error', e=>{ if(L.peer!==P) return; const t=e && e.type;
    if(t==='peer-unavailable'){ L.dialing=false; if(!L.everUp){ L.err='wait'; render(); } return; }
    if(t==='unavailable-id'){
      // a fresh room whose code is taken: pick another; our own room after a reload: wait for the old registration to clear
      if(host && !L.everUp && !L.rejoin){ L.code=newCode(); HS.night={id:L.code+':'+dayKey(), games:[]}; }
      setTimeout(()=>{ if(L.peer===P) newPeer(); }, L.rejoin?2500:200); return; }
    if(t==='browser-incompatible'){ fail(T('This browser cannot play online. Open the link in Safari or Chrome.','此浏览器不支持联机。请用 Safari 或 Chrome 打开链接。')); return; }
    // a lost signalling server is not fatal (the heartbeat calls reconnect); only a destroyed peer is rebuilt, which would drop the data link
    L.tries++; setTimeout(()=>{ if(L.peer===P && (P.destroyed || !L.opened)) newPeer(); }, Math.min(8000, 1500*L.tries)); }); }
function dial(){ const P=L.peer; if(!P || P.destroyed){ newPeer(); return; } if(!L.opened || P.disconnected) return;
  if(now()-L.dialT<(L.dialing?7000:2500)) return; L.dialing=true; L.dialT=now();
  if(L.conn){ try{ L.conn.close(); }catch(e){} L.conn=null; }
  const c=P.connect(hostId(L.code), {reliable:true}); c.on('open', ()=>adopt(c)); c.on('error', ()=>{ L.dialing=false; }); }
// heartbeat: keeps the link honest, acknowledges messages, redials when it goes quiet
setInterval(()=>{ if(!L.peer) return; const t=now();
  if(L.conn && L.conn.open) lraw({t:'hb', a:L.rx});
  const quiet=t-L.lastRx;
  if(L.up && quiet>3500) linkDown();
  if(L.side==='g' && L.opened && !L.up && (!L.conn || !L.conn.open || quiet>7000)) dial();
  if(L.peer.disconnected && !L.peer.destroyed && t-L.reconT>3000){ L.reconT=t; try{ L.peer.reconnect(); }catch(e){} }
  if(L.up && Date.now()-(LS.get('sess',{}).at||0)>30000) saveSess(); }, 700);
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState!=='visible' || !L.peer) return; if(L.everUp) wake();
  if(L.peer.disconnected && !L.peer.destroyed){ try{ L.peer.reconnect(); }catch(e){} } if(L.side==='g' && !L.up) dial(); });

// ---------- rooms ----------
const newCode=()=>Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const dayKey=()=>{ const d=new Date(Date.now()-6*3600e3); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };
const saveSess=()=>{ if(L.code) LS.set('sess',{code:L.code, side:L.side, at:Date.now()}); };
const saveHS=()=>{ if(L.side==='h') LS.set('hs',{code:L.code, hs:HS}); };
function start(side, code, rejoin){ L.side=side; L.code=code; L.rejoin=!!rejoin; L.everUp=false; L.up=false; L.pinst=null; L.tx=0; L.rx=0; L.outQ=[]; L.err=''; GOT_ST=false;
  // a night saved before a game was added still gets a seat for it
  if(side==='h'){ const saved=LS.get('hs',null); HS=rejoin && saved && saved.code===code ? Object.assign(freshHS(), saved.hs, {scr:'menu'}) : freshHS(); HS.seats=Object.assign(freshHS().seats, HS.seats); if(!GI[HS.g]) HS.g=null; if(!HS.night.id) HS.night={id:code+':'+dayKey(), games:[]}; }
  else HS=freshHS();
  newPeer(); render(); }
function leave(quiet){ if(!quiet && L.up) lraw({t:'bye'}); const P=L.peer; setTimeout(()=>{ try{ P && P.destroy(); }catch(e){} }, 400);
  L.peer=null; L.conn=null; L.up=false; L.everUp=false; L.side=''; L.code=''; L.pinst=null; LEFT_SID=0;
  LS.del('sess'); unmount(); HS=freshHS(); GOT_ST=false; $('#netOv').hidden=true; history.replaceState(null,'',location.pathname); render(); }
function fail(msg){ try{ L.peer && L.peer.destroy(); }catch(e){} L.peer=null; L.side=''; L.code=''; LS.del('sess'); render(msg); }

// ---------- what the host decides; the partner asks for it ----------
function request(a, arg){ if(L.side==='h') apply(a, arg); else lsend({t:'req', a, arg}, true); }
function apply(a, arg){
  if(a==='play'){ if(!GI[arg]) return; HS.scr='game'; HS.g=arg; HS.sid++; }
  else if(a==='again'){ if(!HS.g) return; HS.scr='game'; HS.sid++; }
  else if(a==='swapagain'){ if(!HS.g) return; HS.seats[HS.g]=HS.seats[HS.g]==='h'?'g':'h'; HS.scr='game'; HS.sid++; }
  else if(a==='next'){ const i=GAMES.findIndex(x=>x.id===HS.g); HS.g=GAMES[(i+1)%GAMES.length].id; HS.scr='game'; HS.sid++; }
  else if(a==='menu'){ HS.scr='menu'; }
  else if(a==='swap'){ if(!GI[arg]) return; HS.seats[arg]=HS.seats[arg]==='h'?'g':'h'; }
  else if(a==='result'){ const r=arg; if(!r || !GI[r.g] || HS.night.games.some(x=>x.sid===r.sid)) return;
    HS.night.games.push({g:r.g, sid:r.sid, score:Math.max(0,Math.round(+r.score||0)), stars:clamp(r.stars|0,0,3), win:!!r.win}); if(HS.night.games.length>60) HS.night.games.shift(); }
  else return;
  HS.v++; saveHS(); tally(); lsend({t:'st', st:HS}, true); render(); }

// ---------- tonight, and the record over many nights ----------
let REC=LS.get('rec',{nights:0, best:0, ids:[]});
const nightTotal=()=>HS.night.games.reduce((s,x)=>s+x.score,0);
const bestStars=g=>{ const rs=HS.night.games.filter(x=>x.g===g); return rs.length?Math.max(...rs.map(x=>x.stars)):-1; };
function tally(){ const id=HS.night.id; if(!id || !HS.night.games.length) return; let ch=false;
  if(!REC.ids.includes(id)){ REC.ids.push(id); if(REC.ids.length>80) REC.ids.shift(); REC.nights++; ch=true; }
  const tot=nightTotal(); if(tot>REC.best){ REC.best=tot; ch=true; } if(ch) LS.set('rec',REC); }

// ---------- the game frame ----------
let FRAME=null, GH=null, GBUF=[], LEFT_SID=0, RES=null;
function deliverGame(sid, d){ if(sid<HS.sid) return;
  if(GH && GH.sid===sid){ try{ GH.on(d); }catch(e){ setTimeout(()=>{ throw e; }); } }
  else { GBUF.push({sid, d}); if(GBUF.length>400) GBUF.shift(); } }
function mount(g, sid){ if(FRAME && FRAME.sid===sid) return; unmount(); GBUF=GBUF.filter(x=>x.sid>=sid);
  const f=document.createElement('iframe'); f.src=`${GI[g].path}?hub=1&sid=${sid}`; f.title=gName(g); f.setAttribute('allow','autoplay; fullscreen; screen-wake-lock; microphone');   // microphone: the restaurant listens for the 接客 lines
  $('#stage').appendChild(f); $('#stage').hidden=false; $('#app').hidden=true; FRAME={el:f, sid, g}; wake(); }
function unmount(){ if(!FRAME) return; try{ const w=FRAME.el.contentWindow; if(w && w.__bye) w.__bye(); }catch(e){} FRAME.el.remove(); FRAME=null; GH=null; $('#stage').hidden=true; $('#app').hidden=false; }
const gameLive=()=>L.up && !RES;
// what a game sees: its seat, the names, a channel to its other half, and the buttons back to the hub
let SAFE={t:0,r:0,b:0,l:0};
window.HUBAPI={ v:1,
  get lang(){ return LANG; }, get host(){ return L.side==='h'; }, get sid(){ return HS.sid; }, get game(){ return HS.g; },
  role(){ return roleOf(HS.g, L.side); }, names(){ const n=names(); return {me:n.mine||n.me, partner:n.partner}; }, safe(){ return SAFE; },
  nextName(){ const i=GAMES.findIndex(x=>x.id===HS.g); return gName(GAMES[(i+1)%GAMES.length].id); },
  open(onMsg, onLink){ const sid=HS.sid; GH={sid, on:onMsg, lu:null, link(up){ if(this.lu===up) return; this.lu=up; try{ onLink && onLink(up); }catch(e){ setTimeout(()=>{ throw e; }); } }};
    const buf=GBUF.filter(x=>x.sid===sid); GBUF=GBUF.filter(x=>x.sid>sid); buf.forEach(x=>deliverGame(x.sid, x.d));
    setTimeout(()=>{ if(GH && GH.sid===sid) GH.link(gameLive()); }, 0);
    // objects made inside the frame belong to its own JavaScript realm, which PeerJS's packer rejects: copy them into this one
    return { send:(d,rel)=>{ if(HS.sid===sid) lsend({t:'g', sid, d:JSON.parse(JSON.stringify(d))}, rel!==false); }, live:gameLive }; },
  result(r){ if(r && HS.g) request('result', {g:HS.g, sid:HS.sid, score:+r.score||0, stars:r.stars|0, win:!!r.win}); },
  again(){ request('again'); }, swapAgain(){ request('swapagain'); }, next(){ request('next'); }, menu(){ request('menu'); } };

// the connection overlay over a game: paused while the link is down, then a short count back in
function netOv(){ const ov=$('#netOv'), inGame=!!FRAME;
  if(!inGame){ ov.hidden=true; clearTimeout(RES); RES=null; return; }
  if(!L.up){ clearTimeout(RES); RES=null; if(GH) GH.link(false); ov.hidden=false;
    ov.innerHTML=`<div><div class="kicker">${T('Connection lost','连接中断')}</div><h2><span class="spin"></span>${T(`Finding ${esc(names().partner)}…`,`正在重新连接 ${esc(names().partner)}…`)}</h2>
      <p class="note">${T('The game is paused. It carries on by itself when you are both back.','游戏已暂停。两人都回来后会自动继续。')}</p><div class="row" style="justify-content:center" id="ovBtns"></div></div>`;
    clearTimeout(netOv.t); netOv.t=setTimeout(()=>{ const b=$('#ovBtns'); if(b && !L.up) b.innerHTML=`<button class="btn ghost" data-a="ovmenu">${T('Back to the menu','回到菜单')}</button>`; }, 25000); return; }
  if(ov.hidden){ if(GH) GH.link(true); return; }
  let n=3; ov.innerHTML=`<div><div class="kicker">${T('Back together','重新连上了')}</div><div class="n">${n}</div></div>`;
  const tick=()=>{ n--; if(n<=0){ ov.hidden=true; RES=null; if(GH) GH.link(true); return; } const el=ov.querySelector('.n'); if(el) el.textContent=n; RES=setTimeout(tick,650); };
  clearTimeout(RES); RES=setTimeout(tick,650); }

// ---------- screens ----------
const linkURL=()=>location.origin+location.pathname.replace(/index\.html$/,'')+'#join='+L.code;
function pill(){ const p=$('#pill'); if(!p) return; p.classList.toggle('down', !L.up); p.innerHTML=`<i></i>${L.up?T('Connected','已连接'):T('Reconnecting…','重新连接中…')}`; }
const langBtn=()=>`<button class="lang" data-a="lang">${LANG==='zh'?'<em>EN</em> · <b>中文</b>':'<b>EN</b> · <em>中文</em>'}</button>`;
const thumb=g=>`url(art/menu-${g}.webp)`;
function welcomeUI(msg){ const sess=LS.get('sess',null), recent=sess && Date.now()-sess.at<12*3600e3;
  return `<div class="top"><div class="sp"></div>${langBtn()}</div>
  <div class="wel"><div>
    <div class="kicker">${T('Three games for two · after midnight','两人三款游戏 · 午夜之后')}</div>
    <h1>夜ふかし</h1><div class="sub">${T('Up All Night','熬夜')}</div>
    <p class="lead">${T('A yokai car chase, a little ramen stall in the rain, the last train under Tokyo. One room code, three co-op games, and Japanese you say to each other.','妖怪飙车、雨夜里的小拉面摊、东京地下的末班车。一个房间码，三款合作游戏，一边说日语一边玩。')}</p>
    ${msg?`<p class="err">${esc(msg)}</p>`:''}
    <label class="nm">${T('Your name','你的名字')}<input id="nameIn" maxlength="12" autocomplete="off" placeholder="${T('optional','可不填')}" value="${esc(myName())}"></label>
    ${recent?`<div class="row"><button class="btn red" data-a="rejoin">${T(`Rejoin room ${esc(sess.code)}`,`回到房间 ${esc(sess.code)}`)}</button></div>`:''}
    <div class="row"><button class="btn ${recent?'':'red'}" data-a="create">${T('Start a night','开一局')}</button>
      <input class="codein" id="codeIn" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters" aria-label="${T('Room code','房间码')}"><button class="btn ghost" data-a="join">${T('Join','加入')}</button></div>
  </div><div><div class="collage">${GAMES.map((G,i)=>`<div class="c${i}" style="background-image:${thumb(G.id)}"><b>${G.jp}</b></div>`).join('')}</div>
    <p class="small solo">${T('Practise alone with しばBot:','和 しばBot 单人练习：')} <a href="night/">${T('Night Parade','百鬼夜行')}</a> · <a href="../midnight-restaurant/">${T('Restaurant','拉面摊')}</a> · <a href="tunnels/">${T('Subway','地铁')}</a></p></div></div>`; }
function pairUI(){ const host=L.side==='h';
  if(host && !L.opened) return `<div class="top"><div class="sp"></div>${langBtn()}</div><div class="pair"><div class="kicker">${T('Your room','你的房间')}</div><h2><span class="spin"></span>${T('Opening a room…','正在开房间…')}</h2><div class="row"><button class="btn ghost" data-a="cancel">${T('Cancel','取消')}</button></div></div>`;
  if(host) return `<div class="top"><div class="sp"></div>${langBtn()}</div><div class="pair">
    <div class="kicker">${T('Your room','你的房间')}</div><div class="code">${esc(L.code)}</div>
    <p class="lead">${T('Send your partner this link. When it opens on their phone, you are both in.','把这个链接发给你的搭档。对方在手机上打开就能进来。')}</p>
    <div class="link" id="linkTxt">${esc(linkURL())}</div>
    <div class="row"><button class="btn red" data-a="share">${T('Send the link','发送链接')}</button><button class="btn" data-a="copy">${T('Copy','复制')}</button><button class="btn ghost" data-a="cancel">${T('Cancel','取消')}</button></div>
    <p class="note"><span class="spin"></span>${T('Waiting for your partner…','等待搭档加入…')}</p>
    <p class="note">${T('Tip: open it in Safari or Chrome. Chat apps’ built-in browsers (WeChat, LINE) can block the connection.','提示：请用 Safari 或 Chrome 打开。微信等聊天软件的内置浏览器可能会阻止连接。')}</p></div>`;
  const waiting=L.err==='wait';
  return `<div class="top"><div class="sp"></div>${langBtn()}</div><div class="pair">
    <div class="kicker">${T('Joining','加入中')}</div><div class="code">${esc(L.code)}</div>
    <h2><span class="spin"></span>${L.up?T('Connected · getting the menu…','已连接 · 正在载入…'):waiting?T('Waiting for the room to open…','等待房间开启…'):T('Connecting…','连接中…')}</h2>
    ${waiting?`<p class="note">${T('The host’s page isn’t open yet (or the code is wrong). Keep this page open; it joins as soon as the room is there.','房主的页面还没打开（或房间码不对）。保持此页面打开，房间一出现就会自动加入。')}</p>`:''}
    <div class="row"><button class="btn ghost" data-a="cancel">${T('Cancel','取消')}</button></div></div>`; }
function menuUI(){ const n=names(), side=L.side, other=side==='h'?'g':'h';
  const seat=(G,role,who,me)=>{ const v=G.vb[role]; return LANG==='zh' ? `${esc(who)}${/[A-Za-z0-9]$/.test(who)?' ':''}${v[2]}` : `${esc(who)} ${me?v[0]:v[1]}`; };
  const stars=GAMES.reduce((s,G)=>s+Math.max(0,bestStars(G.id)),0), cnt=HS.night.games.length;
  return `<div class="top"><div class="brand"><b>夜ふかし</b><span>${T('Up All Night','熬夜')}</span></div>
    <div class="names"><input id="meName" maxlength="12" value="${esc(n.mine)}" placeholder="${T('your name','你的名字')}" aria-label="${T('Your name','你的名字')}"><span class="heart">♥</span><b>${esc(n.partner)}</b></div>
    <div class="sp"></div><span class="pill" id="pill"></span>${langBtn()}</div>
  <div class="cards">${GAMES.map(G=>{ const st=bestStars(G.id);
    return `<article class="gc${HS.g===G.id?' last':''}" data-g="${G.id}">
      <div class="th" style="background-image:linear-gradient(180deg,rgba(5,7,13,0) 35%,rgba(5,7,13,.94)),${thumb(G.id)}"><b class="jp">${G.jp}</b><span>${esc(gName(G.id))}</span>${st>=0?`<i class="st">${'★'.repeat(st)}<em>${'★'.repeat(3-st)}</em></i>`:''}</div>
      <div class="bd"><p>${esc(T(G.line[0],G.line[1]))}</p>
        <div class="seats"><span>${seat(G,roleOf(G.id,side),n.me,true)} · ${seat(G,roleOf(G.id,other),n.partner,false)}</span><button class="sw" data-a="swap" data-g="${G.id}" aria-label="${T('Swap seats','换位置')}">⇄</button></div>
        <button class="btn red play" data-a="play" data-g="${G.id}">${T('Play','开始')}</button></div></article>`; }).join('')}</div>
  <div class="tonight"><span class="k">${T('Tonight','今晚')}</span><b>★ ${stars}/9</b><b>${nightTotal().toLocaleString()}</b><span>${T('pts','分')}</span>
    <span class="rec">${cnt} ${T(cnt===1?'game':'games','局')} · ${T('best night','最佳之夜')} ${REC.best.toLocaleString()} · ${T('nights together','一起熬夜')} ${REC.nights}</span>
    <button class="btn ghost" data-a="end">${T('End the night','结束今晚')}</button></div>`; }
let shown='';
function render(msg){ const app=$('#app');
  let key, html;
  if(!L.side){ key='wel:'+LANG+':'+(msg||''); html=()=>welcomeUI(msg); unmount(); }
  else if(!L.everUp || (L.side==='g' && !GOT_ST)){ key='pair:'+L.side+':'+L.opened+':'+L.up+':'+L.err+':'+L.code+':'+LANG; html=pairUI; unmount(); }
  else if(HS.scr==='game' && HS.g && LEFT_SID!==HS.sid){ mount(HS.g, HS.sid); key=shown; }
  else { unmount(); key='menu:'+HS.v+':'+LANG+':'+L.pname+':'+myName()+':'+REC.best; html=menuUI; }
  if(html && key!==shown){ shown=key; const keep=document.activeElement && document.activeElement.id; app.innerHTML=html(); pill(); if(keep==='meName'||keep==='nameIn'){ const el=$('#'+keep); if(el){ el.focus(); const v=el.value; el.setSelectionRange(v.length,v.length); } } }
  netOv(); }
let toastT=0;
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove('on'),1800); }

// ---------- input ----------
document.addEventListener('click', async e=>{ const b=e.target.closest('button'); if(!b || !b.dataset.a) return; const a=b.dataset.a;
  if(a==='lang'){ LANG=LANG==='zh'?'en':'zh'; LS.set('lang',LANG); setLangAttr(); shown=''; render(); return; }
  if(a==='create'){ wake(); start('h', newCode(), false); return; }
  if(a==='join'){ const code=($('#codeIn').value||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(code)){ render(T('Type the 4-character room code.','请输入 4 位房间码。')); return; } wake(); start('g', code, false); return; }
  if(a==='rejoin'){ const s=LS.get('sess',null); if(s){ wake(); start(s.side, s.code, true); } return; }
  if(a==='cancel'){ leave(true); return; }
  if(a==='share'){ const url=linkURL(); try{ if(navigator.share){ await navigator.share({title:'夜ふかし', text:T(`Play with me tonight · room ${L.code}`,`今晚一起玩 · 房间 ${L.code}`), url}); return; } }catch(x){ if(x && x.name==='AbortError') return; } copyLink(); return; }
  if(a==='copy'){ copyLink(); return; }
  if(a==='play'){ wake(); request('play', b.dataset.g); return; }
  if(a==='swap'){ request('swap', b.dataset.g); return; }
  if(a==='end'){ leave(false); return; }
  if(a==='ovmenu'){ LEFT_SID=HS.sid; $('#netOv').hidden=true; if(L.side==='h') apply('menu'); else { unmount(); shown=''; render(); } return; } });
async function copyLink(){ try{ await navigator.clipboard.writeText(linkURL()); toast(T('Link copied','已复制链接')); }catch(x){ const r=document.createRange(), el=$('#linkTxt'); if(el){ r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); } toast(T('Select the link and copy it','请选中链接后复制')); } }
document.addEventListener('input', e=>{ const id=e.target.id;
  if(id==='nameIn' || id==='meName'){ LS.set('name', e.target.value.trim().slice(0,12)); if(id==='meName' && L.up){ clearTimeout(document.nmT); document.nmT=setTimeout(()=>lsend({t:'nm', name:myName()}, true), 400); } }
  if(id==='codeIn') e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''); });
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.id==='codeIn'){ const b=document.querySelector('[data-a=join]'); b && b.click(); } if(e.key==='Enter' && e.target.id==='meName') e.target.blur(); });

// keep the screen awake while you play
let WL=null;
async function wake(){ try{ if('wakeLock' in navigator && !WL && document.visibilityState==='visible'){ WL=await navigator.wakeLock.request('screen'); WL.addEventListener('release', ()=>{ WL=null; }); } }catch(e){} }
// the hub's own safe-area insets, for the games inside the frame (a frame doesn't get them by itself)
const probe=document.createElement('div'); probe.style.cssText='position:fixed;inset:0;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)'; document.body.appendChild(probe);
function measure(){ const cs=getComputedStyle(probe); SAFE={t:parseFloat(cs.paddingTop)||0, r:parseFloat(cs.paddingRight)||0, b:parseFloat(cs.paddingBottom)||0, l:parseFloat(cs.paddingLeft)||0}; }
addEventListener('resize', measure); measure();
// film grain
(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'), im=g.createImageData(128,128); for(let i=0;i<im.data.length;i+=4){ const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } g.putImageData(im,0,0); $('#grain').style.backgroundImage=`url(${c.toDataURL()})`; })();

// ---------- start: an invite link joins straight away; a page reloaded mid-night rejoins by itself ----------
const inv=(location.hash.match(/join=([A-Za-z0-9]{4})/)||[])[1];
const sess=LS.get('sess',null);
if(inv){ history.replaceState(null,'',location.pathname); if(sess && sess.code===inv.toUpperCase() && sess.side==='h') start('h', sess.code, true); else start('g', inv.toUpperCase(), false); }
else if(sess && Date.now()-sess.at<10*60e3) start(sess.side, sess.code, true);
else render();
window.__hub={ L, HS:()=>HS, GH:()=>GH, frame:()=>FRAME && FRAME.el, apply, request, REC:()=>REC,
  drop:()=>{ try{ L.conn && L.conn.close(); }catch(e){} }, mute:ms=>{ L.mute=now()+ms; }, outQ:()=>L.outQ.length };
})();
</script>
</body>
