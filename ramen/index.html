<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Midnight Ramen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap">
<style>
/* 深夜ラーメン Midnight Ramen: a two-player kitchen at a ramen stall under the train tracks.
   The Cook boils, ladles, slices and plates; the Server greets, takes the orders (in Japanese), serves, collects and wipes.
   Each phone runs its own station; only tickets, bowls and results travel between them. */
:root{ --bg:#07090D; --ink:#F1E9DD; --dim:#A9A29A; --red:#D8342B; --amber:#FF9A4D; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button,input{touch-action:manipulation;font-family:inherit}
[hidden]{display:none!important}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#grain{position:fixed;inset:0;pointer-events:none;opacity:.08;mix-blend-mode:overlay;z-index:3}
.ui{position:fixed;inset:0;z-index:6;display:flex;align-items:center;padding:14px max(18px,env(safe-area-inset-left));background:linear-gradient(90deg,rgba(7,9,13,.92),rgba(7,9,13,.7) 52%,rgba(7,9,13,.15))}
.panel{width:min(540px,100%);max-height:100%;overflow:auto;padding:2px}
.kicker{font:700 11px "Zen Kaku Gothic New";letter-spacing:.34em;color:var(--amber);text-transform:uppercase}
h1{margin:6px 0 4px;font:400 48px/1 "Dela Gothic One";letter-spacing:.04em;color:#FFE9D6;text-shadow:0 0 24px rgba(255,77,141,.45)}
h2{margin:6px 0 8px;font:400 28px/1.1 "Dela Gothic One";color:#FFE9D6}
.lead{margin:10px 0 14px;font:500 14px/1.65 "Zen Kaku Gothic New";color:#C9C2B8;max-width:46ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{font:900 14px "Zen Kaku Gothic New";letter-spacing:.08em;color:#0B0E14;background:var(--ink);border:0;border-radius:8px;padding:12px 18px;cursor:pointer}
.btn.red{background:var(--red);color:#fff}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px rgba(241,233,221,.35)}
.btn:active{transform:translateY(1px)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.role{all:unset;cursor:pointer;display:block;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(241,233,221,.16)}
.role:active{background:rgba(255,255,255,.09)}
.role i{display:block;font:700 10px "Zen Kaku Gothic New";letter-spacing:.28em;color:var(--amber);font-style:normal;text-transform:uppercase;margin-bottom:4px}
.role b{display:block;font:400 21px "Dela Gothic One";color:#FFE9D6}
.role small{display:block;margin-top:6px;font:500 12.5px/1.5 "Zen Kaku Gothic New";color:var(--dim)}
.code{font:400 44px "Dela Gothic One";letter-spacing:.24em;color:var(--amber)}
input.codein{font:400 22px "Dela Gothic One";letter-spacing:.2em;text-transform:uppercase;width:130px;padding:9px 12px;border-radius:8px;border:0;background:var(--ink);color:#0B0E14}
.note{font:500 12.5px/1.55 "Zen Kaku Gothic New";color:var(--dim);margin-top:10px}
.err{color:#FF8A7E;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.stats span{display:flex;flex-direction:column;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,.05);font:700 10px "Zen Kaku Gothic New";letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.stats b{font:400 22px "Dela Gothic One";color:#FFE9D6;letter-spacing:0}
.stars{font:400 30px "Dela Gothic One";color:var(--amber);letter-spacing:.1em;margin-top:2px}
.stars .off{color:rgba(241,233,221,.16)}
.rotate{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:var(--bg);font:700 16px "Zen Kaku Gothic New";text-align:center;padding:20px}
@media (orientation:portrait) and (max-width:820px){ .rotate{display:flex} }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="grain"></div>
<div class="ui" id="ui"><div class="panel" id="panel"></div></div>
<div class="rotate">Turn your phone sideways · 横にしてね</div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const TAU=Math.PI*2, rnd=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)], clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), inBox=(p,cx,cy,w,h)=>Math.abs(p.x-cx)<=w/2 && Math.abs(p.y-cy)<=h/2;
const VW=1000, VH=460, SHIFT_T=120, LIFT=16;

// ---------- what customers order (the words you learn by using them) ----------
const BROTH={ shoyu:{k:'しょうゆ', ro:'shōyu', m:'soy sauce', c1:'#5A2A10', c2:'#A35F27'}, miso:{k:'みそ', ro:'miso', m:'miso', c1:'#93561F', c2:'#D9A05A'}, shio:{k:'しお', ro:'shio', m:'salt', c1:'#AD955C', c2:'#EADCAE'} };
const TOPS={ tamago:{k:'たまご', ro:'tamago', m:'egg'}, chashu:{k:'チャーシュー', ro:'chāshū', m:'roast pork'}, negi:{k:'ねぎ', ro:'negi', m:'green onion'}, nori:{k:'のり', ro:'nori', m:'seaweed'} };
const FIRM={ katame:{k:'かため', ro:'katame', m:'firm'}, yawarakame:{k:'やわらかめ', ro:'yawarakame', m:'soft'} };
// noodles by seconds in the pot: raw → firm → normal → soft → soggy
const DONE=[[3.5,'nama','なま'],[5,'katame','かため'],[7,'futsu','ふつう'],[8.5,'yawarakame','やわらかめ'],[1e9,'nobita','のびた']];
const DONE_COL={nama:'#6E7781', katame:'#E8C547', futsu:'#6CC36C', yawarakame:'#F09A3E', nobita:'#D8342B'};
const doneOf=t=>DONE.find(d=>t<d[0]);
const store={ get(k,d){ try{ const v=localStorage.getItem('mr_'+k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem('mr_'+k, JSON.stringify(v)); }catch(e){} } };
// a word's picture hint disappears once you have served it right three times
const MASTER=store.get('mastery',{});
const known=w=>(MASTER[w]||0)>=3;
const learn=ws=>{ ws.forEach(w=>{ if(w) MASTER[w]=(MASTER[w]||0)+1; }); store.set('mastery',MASTER); };
const orderWords=o=>[o.b, ...o.t, o.f].filter(Boolean);
function phrase(o){ const B=BROTH[o.b].k, T=o.t.map(x=>TOPS[x].k), v=o.id%3;
  if(o.f) return `${B}ラーメン、${FIRM[o.f].k}で！ ${T.join('と')}も！`;
  if(T.length===2) return v ? `${B}ラーメン、${T[0]}と${T[1]}で！` : `${B}ひとつ！ ${T[0]}と${T[1]}のせて！`;
  return [`${B}ラーメン、${T[0]}で！`, `${B}ラーメンください！ ${T[0]}のせで`, `${B}ひとつ、${T[0]}つきで！`][v]; }
let OID=0;
function newOrder(t){ const ph=t<35?0:t<80?1:2, tk=Object.keys(TOPS), n=ph===0?1:(Math.random()<.5?2:1), tops=[];
  while(tops.length<n){ const x=pick(tk); if(!tops.includes(x)) tops.push(x); }
  const o={id:++OID, b:pick(Object.keys(BROTH)), t:tops, f:ph===2&&Math.random()<.55?pick(Object.keys(FIRM)):null}; o.text=phrase(o); return o; }
function judge(bw,o){ if(!bw || !bw.noodle || bw.b!==o.b) return {ok:false}; const d=bw.noodle;
  if(d==='nama' || d==='nobita' || (o.f && d!==o.f)) return {ok:false};
  if([...bw.tops].sort().join()!==[...o.t].sort().join()) return {ok:false};
  return {ok:true, perfect:o.f ? true : d==='futsu'}; }

// ---------- sound: everything synthesized, no voice ----------
let AC=null, MASTER_G=null, NOISE=null;
function audio(){ try{ if(!AC){ AC=new (window.AudioContext||window.webkitAudioContext)(); MASTER_G=AC.createGain(); MASTER_G.gain.value=.9; MASTER_G.connect(AC.destination);
      const n=AC.sampleRate*2, b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; NOISE=b; rainLoop(); }
    if(AC.state==='suspended') AC.resume(); }catch(e){} }
function nz(dur,o={}){ if(!AC) return; const t=AC.currentTime+(o.at||0), s=AC.createBufferSource(), f=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=NOISE; s.loop=true;
  f.type=o.type||'bandpass'; f.frequency.setValueAtTime(o.f||1000,t); if(o.f2) f.frequency.exponentialRampToValueAtTime(o.f2,t+dur); f.Q.value=o.q||1;
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.g||.2,t+(o.a||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(MASTER_G); s.start(t, Math.random()*1.5); s.stop(t+dur+.05); }
function tn(fr,dur,o={}){ if(!AC) return; const t=AC.currentTime+(o.at||0), s=AC.createOscillator(), g=AC.createGain(); s.type=o.type||'sine'; s.frequency.setValueAtTime(fr,t); if(o.f2) s.frequency.exponentialRampToValueAtTime(o.f2,t+dur);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(o.g||.1,t+(o.a||.005)); g.gain.exponentialRampToValueAtTime(.0001,t+dur); s.connect(g); g.connect(MASTER_G); s.start(t); s.stop(t+dur+.05); }
function rainLoop(){ const s=AC.createBufferSource(), hp=AC.createBiquadFilter(), lp=AC.createBiquadFilter(), g=AC.createGain(); s.buffer=NOISE; s.loop=true; hp.type='highpass'; hp.frequency.value=600; lp.type='lowpass'; lp.frequency.value=3400; g.gain.value=.04; s.connect(hp); hp.connect(lp); lp.connect(g); g.connect(MASTER_G); s.start(); }
const SFX={
  plop(){ tn(260,.16,{f2:90,g:.22}); nz(.08,{type:'lowpass',f:900,g:.12}); }, splash(){ nz(.35,{type:'highpass',f:1400,g:.12}); },
  pour(){ nz(.42,{f:1500,f2:700,q:1.5,g:.1,a:.04}); }, place(){ tn(620,.06,{type:'triangle',g:.08}); nz(.04,{f:2600,q:3,g:.07}); },
  slice(){ nz(.13,{f:5200,f2:2400,q:5,g:.2}); tn(150,.08,{type:'triangle',g:.18,at:.03}); }, bell(){ tn(1568,.7,{g:.09}); tn(2349,.55,{g:.045}); },
  coins(){ [2600,3150,2900].forEach((f,i)=>tn(f,.22,{g:.06,at:i*.06})); }, furin(){ [2093,2793,3520].forEach((f,i)=>tn(f,.9,{g:.035,at:i*.03})); },
  good(){ tn(784,.14,{type:'triangle',g:.09}); tn(1175,.2,{type:'triangle',g:.07,at:.07}); }, wrong(){ tn(116,.32,{type:'square',g:.06}); nz(.2,{type:'lowpass',f:420,g:.09}); },
  stamp(){ nz(.07,{type:'lowpass',f:700,g:.28}); tn(85,.13,{g:.22}); }, wipe(){ nz(.22,{f:1300,q:.7,g:.09,a:.03}); }, grab(){ tn(440,.05,{type:'triangle',g:.04}); },
  bubble(){ tn(rnd(180,320),.06,{f2:rnd(380,520),g:.02}); }, tick(){ tn(1100,.03,{type:'square',g:.03}); }, crash(){ nz(.5,{type:'highpass',f:2000,g:.2}); tn(300,.3,{type:'square',g:.05,f2:120}); },
  gong(){ tn(196,1.6,{g:.12}); tn(294,1.2,{g:.06}); nz(.4,{type:'lowpass',f:500,g:.06}); },
  train(){ nz(3.6,{type:'lowpass',f:220,f2:110,q:.7,g:.3,a:.9}); for(let i=0;i<10;i++) tn(70,.06,{type:'square',g:.035,at:.5+i*.28}); } };
const buzz=ms=>{ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} };

// ---------- canvas: a 1000×460 stage scaled to the phone ----------
const cv=$('#cv'), ctx=cv.getContext('2d'); let W=0, H=0, DPR=1, S=1, OX=0, OY=0;
const LAYER={};
function resize(){ W=innerWidth; H=innerHeight; DPR=Math.min(2,devicePixelRatio||1); cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR); S=Math.min(W/VW,H/VH); OX=(W-VW*S)/2; OY=(H-VH*S)/2; for(const k in LAYER) LAYER[k]=null; }
addEventListener('resize', resize); resize();
const toV=e=>({x:(e.clientX-OX)/S, y:(e.clientY-OY)/S});
let seed=7; const srand=()=>(seed=(seed*16807)%2147483647)/2147483647;
function mkLayer(draw){ const c=document.createElement('canvas'); c.width=Math.ceil(VW*S*DPR); c.height=Math.ceil(VH*S*DPR); const g=c.getContext('2d'); g.setTransform(S*DPR,0,0,S*DPR,0,0); seed=7; draw(g); return c; }
if(document.fonts) Promise.all(['400 20px "Dela Gothic One"','400 20px "Yuji Syuku"','700 16px "Zen Kaku Gothic New"','900 16px "Zen Kaku Gothic New"']
  .map(f=>document.fonts.load(f,'しょうゆみそしおラーメンらーめんしば屋ちゅうぼう¥0123'))).then(()=>{ for(const k in LAYER) LAYER[k]=null; }).catch(()=>{});
// film grain over everything
(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'), im=g.createImageData(128,128); for(let i=0;i<im.data.length;i+=4){ const v=Math.random()*255; im.data[i]=im.data[i+1]=im.data[i+2]=v; im.data[i+3]=255; } g.putImageData(im,0,0); $('#grain').style.backgroundImage=`url(${c.toDataURL()})`; })();

// ---------- drawing helpers ----------
function rr(g,x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function el(g,x,y,rx,ry){ g.beginPath(); g.ellipse(x,y,rx,ry,0,0,TAU); }
const SPR={};
function sprite(name,w,h,draw){ if(SPR[name]) return SPR[name]; const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h); return SPR[name]=c; }
const glowSpr=col=>sprite('g'+col,128,128,(g)=>{ const r=g.createRadialGradient(64,64,0,64,64,64); r.addColorStop(0,col); r.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=r; g.fillRect(0,0,128,128); });
const steamSpr=()=>sprite('steam',96,96,(g)=>{ const r=g.createRadialGradient(48,48,0,48,48,48); r.addColorStop(0,'rgba(255,255,255,.5)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=r; g.fillRect(0,0,96,96); });
function wrapJP(g,text,maxW){ const lines=[]; let cur=''; for(const ch of text){ if(cur && g.measureText(cur+ch).width>maxW && !'、。！？ー'.includes(ch)){ lines.push(cur.trim()); cur=ch; } else cur+=ch; } if(cur.trim()) lines.push(cur.trim()); return lines; }
function drawTop(g,id,x,y,s,rot){ g.save(); g.translate(x,y); if(rot) g.rotate(rot); g.scale(s,s);
  if(id==='tamago'){ el(g,0,0,12,9); g.fillStyle='#F6EFE3'; g.fill(); const r=g.createRadialGradient(-1,0,0,0,0,7); r.addColorStop(0,'#FFB347'); r.addColorStop(.7,'#E8892A'); r.addColorStop(1,'#C9681C'); el(g,0,.5,7,5.6); g.fillStyle=r; g.fill(); el(g,-2,-1,2.4,1.6); g.fillStyle='rgba(255,230,170,.7)'; g.fill(); }
  else if(id==='chashu'){ el(g,0,0,14,10); g.fillStyle='#6E3726'; g.fill(); el(g,0,0,11.5,8); g.fillStyle='#D59C86'; g.fill(); g.strokeStyle='rgba(255,240,230,.75)'; g.lineWidth=1.2; g.beginPath(); g.ellipse(-1,0,6,4,0,.4,4.2); g.stroke(); g.beginPath(); g.ellipse(2,1,3,2,0,0,5); g.stroke(); }
  else if(id==='negi'){ for(let i=0;i<7;i++){ const a=i*2.4, r=i?7:0; g.strokeStyle=i%3?'#7DBE4C':'#B9DA8A'; g.lineWidth=2.2; g.beginPath(); g.ellipse(Math.cos(a)*r,Math.sin(a)*r*.6,2.6,2,0,0,TAU); g.stroke(); } }
  else if(id==='nori'){ g.fillStyle='#17251C'; g.fillRect(-9,-12,18,22); g.fillStyle='rgba(120,160,130,.25)'; for(let i=-8;i<9;i+=4) g.fillRect(i,-12,1,22); }
  g.restore(); }
const FAT=[[-.5,-.2],[-.2,.3],[.3,-.35],[.55,.15],[.05,-.05],[-.35,.45]];
function noodleLines(g,x,y,rx,ry,s,n){ for(let i=0;i<n;i++){ const yy=y-ry*.45+i*ry*.16; g.beginPath(); for(let k=0;k<=12;k++){ const xx=x-rx*.72+k*rx*.12, w=Math.sin(k*1.3+i*2.1)*2.2*s; k?g.lineTo(xx,yy+w):g.moveTo(xx,yy+w); } g.stroke(); } }
// a ramen bowl seen from the counter: b = {b:broth, noodle, tops}; eaten 0..1
function drawBowl(g,x,y,s,b,eaten=0){ const rx=50*s, ry=17*s;
  g.fillStyle='rgba(0,0,0,.4)'; el(g,x,y+34*s,rx*.85,ry*.55); g.fill();
  g.beginPath(); g.moveTo(x-rx,y); g.bezierCurveTo(x-rx*.96,y+28*s,x-rx*.5,y+37*s,x,y+37*s); g.bezierCurveTo(x+rx*.5,y+37*s,x+rx*.96,y+28*s,x+rx,y); g.closePath();
  const bg=g.createLinearGradient(x-rx,0,x+rx,0); bg.addColorStop(0,'#3E0F0B'); bg.addColorStop(.45,'#8E2419'); bg.addColorStop(.7,'#6B1B13'); bg.addColorStop(1,'#33100C'); g.fillStyle=bg; g.fill();
  g.strokeStyle='rgba(241,233,221,.5)'; g.lineWidth=1.5*s; g.beginPath(); g.ellipse(x,y+14*s,rx*.9,ry*.95,0,.12*Math.PI,.88*Math.PI); g.stroke();
  if(b && b.tops.includes('nori') && eaten<.4){ g.save(); g.translate(x+rx*.3,y-ry*.35); g.rotate(.12); g.fillStyle='#17251C'; g.fillRect(-10*s,-24*s,20*s,26*s); g.fillStyle='rgba(120,160,130,.22)'; for(let i=-8;i<9;i+=4) g.fillRect(i*s,-24*s,1*s,26*s); g.restore(); }
  el(g,x,y,rx,ry); g.fillStyle='#EFE6D8'; g.fill();
  el(g,x,y+1*s,rx*.88,ry*.78); g.fillStyle='#2A1712'; g.fill();
  if(!b) return;
  g.save(); el(g,x,y+1*s,rx*.88,ry*.78); g.clip();
  if(b.b){ const B=BROTH[b.b], r=g.createRadialGradient(x-rx*.2,y-2*s,2,x,y,rx); r.addColorStop(0,B.c2); r.addColorStop(1,B.c1); g.fillStyle=r; g.fillRect(x-rx,y-ry,rx*2,ry*2);
    g.fillStyle='rgba(255,236,190,.38)'; for(const [fx,fy] of FAT){ el(g,x+fx*rx*.8,y+fy*ry*.7,2.4*s,1.3*s); g.fill(); } }
  const n=Math.round(7*(1-eaten));
  if(b.noodle && n>0){ const lw=(b.noodle==='nobita'?3.4:2.3)*s, col=b.noodle==='nama'?'#E9E3CC':b.noodle==='nobita'?'#DDC48C':'#E8C25A';
    g.strokeStyle='rgba(110,70,20,.35)'; g.lineWidth=lw+1.4*s; noodleLines(g,x,y,rx,ry,s,n); g.strokeStyle=col; g.lineWidth=lw; noodleLines(g,x,y,rx,ry,s,n); }
  g.restore();
  if(eaten<.5){ if(b.tops.includes('negi')) drawTop(g,'negi',x-rx*.05,y-ry*.2,s); if(b.tops.includes('tamago')) drawTop(g,'tamago',x-rx*.42,y+ry*.15,s); if(b.tops.includes('chashu')) drawTop(g,'chashu',x+rx*.36,y+ry*.1,s); } }

// ---------- particles, stamps, floating words ----------
const PT=[], FX={shake:0};
const steamAt=(x,y,n)=>{ for(let i=0;i<n;i++) PT.push({k:'steam',x:x+rnd(-12,12),y,vx:rnd(-8,8),vy:rnd(-40,-22),g:0,life:0,max:rnd(1,1.6),size:rnd(26,44)}); };
const splash=(x,y)=>{ for(let i=0;i<10;i++) PT.push({k:'drop',x,y,vx:rnd(-120,120),vy:rnd(-220,-80),g:700,life:0,max:.5,c:'rgba(210,235,245,.85)',size:rnd(1.5,3)}); steamAt(x,y-6,3); };
const drips=(x,y)=>{ for(let i=0;i<6;i++) PT.push({k:'drop',x:x+rnd(-14,14),y,vx:rnd(-20,20),vy:rnd(0,60),g:500,life:0,max:.4,c:'rgba(210,235,245,.8)',size:2}); };
const popText=(x,y,txt,c,size)=>PT.push({k:'text',x,y,vx:0,vy:-36,g:0,life:0,max:1.1,txt,c,size});

function kSwipe(it){ const n=it.path.length; if(n<2 || !K.cut.id) return; const a=it.path[n-2], b=it.path[n-1], B=KL.board, now=b.t;

function kUpdate(dt){ const now=performance.now();

  for(let i=0;i<3;i++){ if(!K.bowls[i]){ K.refill[i]-=dt; if(K.refill[i]<=0) K.bowls[i]=newBowl(); } else if(K.bowls[i].pop>0) K.bowls[i].pop=Math.max(0,K.bowls[i].pop-dt*4); }
  if(!K.cut.id){ const low=Object.keys(TOPS).find(id=>K.trays[id]<=2); if(low) K.cut={id:low,n:0,cool:0}; }
  K.tickets=K.tickets.filter(t=>!(t.kill && now>t.kill));
  K.tickets.forEach((t,i)=>{ const tx=16+i*126; t.x=t.x==null?VW:t.x+(tx-t.x)*Math.min(1,dt*10); });

function kRecv(m){ const now=performance.now();
  if(m.t==='ticket'){ K.tickets.push({id:m.id, o:m.o, p:1, x:null, rot:rnd(-.04,.04)}); SFX.place(); return; }

  if(m.t==='yen'){ if(SH) SH.yen=m.v; return; }
  if(m.t==='final'){ if(!SH) return; SH.final=m; SH.yen=m.yen; SH.stats=m.stats; if(SH.ph==='end') results(); } }

const CL={ seats:[{x:320},{x:480},{x:640},{x:800}], door:{x:936}, pass:[{x:82,y:196},{x:82,y:266},{x:82,y:336},{x:82,y:406}], pitcher:{x:946,y:414} };

function serve(j,s){ const bw=C.pass[j], seat=C.seats[s], c=seat.c; if(!bw || !c || c.st!=='order') return false; C.pass[j]=null; const r=judge(bw,c.o);

// ---------- しばBot: plays the other station when you practise ----------
const BS={t:0};
function botServer(dt){ BS.t-=dt; if(BS.t>0) return; BS.t=rnd(.45,.8);
  for(let j=0;j<4;j++){ const bw=C.pass[j]; if(!bw) continue; let s=C.seats.findIndex(st=>st.c&&st.c.st==='order'&&judge(bw,st.c.o).ok);
    if(s<0 && SH.t-bw.at>2.5) s=C.seats.findIndex(st=>st.c&&st.c.st==='order'); if(s>=0){ serve(j,s); return; } }
  let s=C.seats.findIndex(st=>st.c&&st.c.st==='wait'); if(s>=0){ takeOrder(s); return; }
  if(C.door.length && freeSeat()>=0){ greet(0); return; }
  s=C.seats.findIndex(st=>st.coins); if(s>=0){ collect(s); return; }
  s=C.seats.findIndex(st=>st.dirty); if(s>=0){ C.seats[s].dirty=null; return; }
  s=C.seats.findIndex(st=>st.c&&st.glass<.35); if(s>=0) C.seats[s].glass=1; }

  BC.busy=BC.busy.filter(b=>b.left>0); }

function ambient(dt){

  walkT-=dt; if(walkT<=0){ walkT=rnd(4,9); const d=Math.random()<.5?1:-1; WALK.push({x:d>0?-60:VW+60, d, v:rnd(38,64), L:newLook(), umb:pick(['rgba(225,232,245,.5)','#6E1C1C','#1F2F55','#262626'])}); }
  WALK.forEach(w=>w.x+=w.d*w.v*dt); for(let i=WALK.length-1;i>=0;i--) if(WALK[i].x<-90||WALK[i].x>VW+90) WALK.splice(i,1);
  const t=SH&&SH.ph==='run'?SH.t:clock; if(!TRN.on && t>=TRN.next){ TRN.on=true; TRN.x=-1300; SFX.train(); TRN.next=t+35; }
  if(TRN.on){ TRN.x+=dt*900; FX.shake=Math.max(FX.shake,.14); if(Math.random()<dt*24) PT.push({k:'dust',x:rnd(0,VW),y:rnd(0,40),vx:rnd(-10,10),vy:rnd(20,60),g:60,life:0,max:2}); if(TRN.x>VW+60) TRN.on=false; } }

  switch(L.style){ case 'short': g.beginPath(); g.ellipse(0,-97,18,14,0,Math.PI,TAU); g.fill(); g.fillRect(-18,-99,5,12); g.fillRect(13,-99,5,12); break;
    case 'bob': g.beginPath(); g.ellipse(0,-94,20,20,0,Math.PI*.95,Math.PI*2.05); g.fill(); g.fillRect(-20,-96,7,24); g.fillRect(13,-96,7,24); break;

    default: g.beginPath(); g.ellipse(0,-94,20,20,0,Math.PI*.9,Math.PI*2.1); g.fill(); g.fillRect(-20,-96,8,40); g.fillRect(12,-96,8,40); }
  if(!sil){ g.strokeStyle='rgba(28,18,12,.75)'; g.lineWidth=1.8; g.lineCap='round'; g.beginPath();

  if(!sil && L.acc==='phones'){ g.strokeStyle='#222'; g.lineWidth=3; g.beginPath(); g.arc(0,-62,13,Math.PI*1.15,Math.PI*1.85); g.stroke(); g.fillStyle='#222'; rr(g,-16,-66,7,10,3); g.fill(); rr(g,9,-66,7,10,3); g.fill(); }

  if(it.kind==='tap'){ it.fn(); buzz(5); return; }
  PTRS.set(e.pointerId,it); try{ cv.setPointerCapture(e.pointerId); }catch(x){} if(it.kind!=='swipe' && it.kind!=='wipe') SFX.grab(); });
cv.addEventListener('pointermove', e=>{ const it=PTRS.get(e.pointerId); if(!it) return; const p=toV(e); it.x=p.x; it.y=p.y; it.path.push({x:p.x,y:p.y,t:performance.now()}); if(it.path.length>24) it.path.shift();
  if(it.kind==='swipe') kSwipe(it); else if(it.kind==='wipe') cWipe(it); });
const up=e=>{ const it=PTRS.get(e.pointerId); if(!it) return; PTRS.delete(e.pointerId); const p=toV(e); it.x=p.x; it.y=p.y;
  if(it.kind==='basket' && K.baskets[it.i].st==='lift' && ROLE==='cook'){ kDrop(it,p); return; } if(it.kind!=='swipe' && it.kind!=='wipe' && it.kind!=='pitcher') (ROLE==='cook'?kDrop:cDrop)(it,p); };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
let lastTouchEnd=0;
document.addEventListener('touchend', e=>{ const now=Date.now(); if(now-lastTouchEnd<350 && e.target===cv) e.preventDefault(); lastTouchEnd=now; }, {passive:false});
['gesturestart','gesturechange','dblclick'].forEach(t=>document.addEventListener(t, e=>e.preventDefault(), {passive:false}));
document.addEventListener('click', async e=>{ const b=e.target.closest('button'); if(!b || !b.dataset.a) return; audio(); const a=b.dataset.a;
  if(a==='practice') return ui(`<div class="kicker">Practice with しばBot</div><h2>Pick your station</h2><p class="lead">しばBot runs the other one, so you can learn yours. The real fun is with a friend.</p>${ROLE_CARDS('p')}<div class="row"><button class="btn ghost" data-a="lobby">Back</button></div>`);
  if(a==='pcook'||a==='pserver'){ MODE='bot'; ROLE=a==='pcook'?'cook':'server'; newShift(); return; }
  if(a==='friend') return friendUI();
  if(a==='create') return ui(`<div class="kicker">Create a room</div><h2>Your station?</h2>${ROLE_CARDS('h')}<div class="row"><button class="btn ghost" data-a="friend">Back</button></div>`);
  if(a==='hcook'||a==='hserver'){ ROLE=a==='hcook'?'cook':'server'; ui('<h2>Opening a room…</h2>'); let r, code;
    for(let i=0;i<4;i++){ code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join(''); r=await netHost(code); if(r!=='taken') break; }
    if(r!==true) return friendUI(r||'Online play is not available here.'); MODE='net'; IS_HOST=true; roomUI(); return; }
  if(a==='join'){ const code=($('#codeIn').value||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(code)) return friendUI('Type the 4-character code.');
    ROLE=''; IS_HOST=false; ui('<h2>Joining…</h2>'); const r=await netJoin(code); if(r!==true) return friendUI(r); MODE='net'; if(!SH) guestUI(); return; }
  if(a==='start'||a==='again'){ if(MODE==='net'){ if(!IS_HOST) return; netSend({t:'start'}); } newShift(); return; }
  if(a==='lobby'){ try{ NET && NET.peer && NET.peer.destroy(); NET && NET.room && NET.room.leave(); }catch(x){} location.reload(); } });

// ---------- online: claude.ai room inside claude.ai, PeerJS anywhere else ----------
let NET=null, guestHere=false;
async function roomApi(){ try{ return window.claude && claude.use ? await claude.use('room') : null; }catch(e){ return null; } }
function onGuest(){ guestHere=true; netSend({t:'hello', role:ROLE}); if(!SH || SH.ph==='end') roomUI(); }
function onNet(m){ if(!m) return;
  if(m.t==='hello'){ ROLE=m.role==='cook'?'server':'cook'; if(!SH) guestUI(); return; }
  if(m.t==='start'){ if(ROLE) newShift(); return; }
  if(!SH) return; if(ROLE==='cook') kRecv(m); else cRecv(m); }
async function netHost(code){ const R=await roomApi();
  if(R){ const room=await R.join('ramen-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room, out:[], outN:0, inN:0}; NET.raw=out=>room.presence({role:'host', out}).catch(()=>{}); NET.raw([]);
    room.onPeers(ch=>{ const gp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='guest'); if(gp && !guestHere) onGuest(); if(gp) netIn(gp.presence.out); }); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer('kotoba-ramen-'+code.toLowerCase(), {debug:0}); NET={kind:'online', code, peer};
    peer.on('open', ()=>res(true)); peer.on('error', e=>res(e.type==='unavailable-id' ? 'taken' : 'Could not open a room: '+e.type));
    peer.on('connection', c=>{ NET.conn=c; c.on('open', onGuest); c.on('data', onNet); c.on('close', ()=>{ guestHere=false; }); }); }); }
async function netJoin(code){ const R=await roomApi();
  if(R){ const room=await R.join('ramen-'+code.toLowerCase()); NET={kind:'claude.ai room', code, room, out:[], outN:0, inN:0}; NET.raw=out=>room.presence({role:'guest', out}).catch(()=>{}); NET.raw([]);
    room.onPeers(ch=>{ const hp=ch.peers.find(p=>!p.isMe && p.presence && p.presence.role==='host'); if(hp) netIn(hp.presence.out); }); return true; }
  if(!window.Peer) return 'PeerJS did not load';
  return new Promise(res=>{ const peer=new Peer({debug:0}); NET={kind:'online', code, peer}; let done=false;
    const t=setTimeout(()=>{ if(!done){ done=true; res('No room with that code (or the connection is blocked).'); } }, 12000);
    peer.on('error', e=>{ if(!done){ done=true; clearTimeout(t); res(e.type==='peer-unavailable' ? 'No room with that code.' : 'Connection problem: '+e.type); } });
    peer.on('open', ()=>{ const c=peer.connect('kotoba-ramen-'+code.toLowerCase(), {reliable:true}); NET.conn=c;
      c.on('open', ()=>{ if(!done){ done=true; clearTimeout(t); res(true); } }); c.on('data', onNet); }); }); }
let flushAt=0, flushQ=false;
function netSend(m){ if(!NET) return; if(NET.peer){ if(NET.conn && NET.conn.open) NET.conn.send(m); return; }
  NET.outN++; NET.out.push({n:NET.outN, m}); if(NET.out.length>40) NET.out.shift();
  const now=performance.now(); if(now-flushAt>120){ flushAt=now; NET.raw(NET.out.slice()); } else if(!flushQ){ flushQ=true; setTimeout(()=>{ flushQ=false; flushAt=performance.now(); NET.raw(NET.out.slice()); },130); } }
function netIn(out){ if(!out) return; for(const e of out) if(e.n>NET.inN){ NET.inN=e.n; onNet(e.m); } }

// ---------- main loop ----------
let last=0, clock=0;
function frame(now){ requestAnimationFrame(frame); const dt=last?Math.min(.05,(now-last)/1000):.016; last=now; clock+=dt;
  if(SH){ if(SH.ph==='count'){ const before=Math.ceil(SH.cd); SH.cd-=dt; if(Math.ceil(SH.cd)!==before && SH.cd>0) SFX.tick(); if(SH.cd<=0){ SH.ph='run'; SFX.gong(); } }
    else if(SH.ph==='run'){ SH.t+=dt; if(SH.t>=SHIFT_T) endShift(); } }
  if(SH && SH.ph==='run'){ if(ROLE==='cook'){ kUpdate(dt); if(MODE==='bot'){ cUpdate(dt); botServer(dt); } } else if(ROLE==='server'){ cUpdate(dt); if(MODE==='bot') botCook(dt); } }
  ambient(dt); stepParticles(dt); FX.shake=Math.max(0,FX.shake-dt*1.6);
  ctx.setTransform(1,0,0,1,0,0); ctx.fillStyle='#07090D'; ctx.fillRect(0,0,cv.width,cv.height);
  const sx=FX.shake?rnd(-1,1)*FX.shake*7:0, sy=FX.shake?rnd(-1,1)*FX.shake*5:0;
  ctx.setTransform(S*DPR,0,0,S*DPR,(OX+sx)*DPR,(OY+sy)*DPR); ctx.save(); ctx.beginPath(); ctx.rect(0,0,VW,VH); ctx.clip();
  if(SH && ROLE==='cook') drawKitchen(); else drawCounter();
  drawParticles(ctx); drawCountdown(ctx); ctx.restore(); }
requestAnimationFrame(frame);
lobbyUI();
window.__ramen={ S:()=>SH, K:()=>K, C:()=>C, KL, CL, role:()=>ROLE, mode:()=>MODE, judge, scr:(x,y)=>({x:x*S+OX, y:y*S+OY}), act:{greet, takeOrder, serve, collect}, toServer, toCook, spawn:()=>spawn() };
})();
</script>
